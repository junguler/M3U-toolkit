=========\n   LOADING\n   ============================================================ */\n  const state = { parsed: null, name: 'playlist.m3u', buckets: [], skippedNoUrl: 0 };\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n\n  function loadText(text, name) {\n    const parsed = parseM3U(text);\n    if (!parsed.entries.length) return alert('No entries found in that playlist.');\n    state.parsed = parsed;\n    state.name = name;\n    const stem = name.replace(/\\.(m3u8?|txt)$/i, '');\n    $('prefix').value = stem || 'playlist';\n    recompute();\n  }\n\n  async function loadFile() {\n    const file = $('fileInput').files[0];\n    if (!file) return alert('Please upload an M3U file.');\n    loadText(await file.text(), file.name);\n  }\n\n  async function loadUrl() {\n    const input = $('urlInput').value.trim();\n    if (!input) return alert('Please enter an online M3U URL.');\n    let url;\n    try { url = normalizeOnlineUrl(input); } catch (error) { return alert(error.message); }\n    say('Fetching...');\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 20000);\n    try {\n      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      let name = 'playlist.m3u';\n      try { name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || name; } catch { /* keep default */ }\n      loadText(await response.text(), name);\n    } catch (error) {\n      say(`Error fetching online M3U file: ${error.message}. The server may block browser CORS requests.`);\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  function loadPasted() {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    loadText(text, 'pasted_streams.m3u');\n  }\n\n  /* ============================================================\n   BUCKETING\n   ============================================================ */\n  function streamType(url) {\n    const bare = url.split('?')[0].toLowerCase();\n    const m = /\\.(mp3|aacp?|ogg|oga|opus|flac|m3u8|pls|m4a|wav|wma|asx)(?:$|[;/])/.exec(bare) || /[;/][^;/]*\\.(mp3|aacp?|ogg|oga|opus|flac|m3u8|m4a)$/.exec(bare);\n    if (!m) return 'unknown';\n    const t = m[1];\n    if (t === 'aacp') return 'aac';\n    if (t === 'oga') return 'ogg';\n    if (t === 'm3u8') return 'hls-m3u8';\n    return t;\n  }\n\n  function bitrateBucket(entry, attrs) {\n    const source = `${attrs['tvg-bitrate'] || ''} ${attrs.bitrate || ''} ${entry.title} ${entry.url}`;\n    const m = /(\\d{2,3})\\s*(?:k\\b|kbps|kb\\/s|kbit)/i.exec(source) || /[^\\d](\\d{2,3})k[^a-z]/i.exec(` ${source} `);\n    if (!m) return 'unknown';\n    const kbps = Number(m[1]);\n    if (kbps \u003c= 64) return '64k-and-below';\n    if (kbps \u003c= 128) return '65-128k';\n    if (kbps \u003c= 192) return '129-192k';\n    return 'above-192k';\n  }\n\n  function letterOf(title) {\n    const first = (title || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/^[^\\p{L}\\p{N}]+/u, '').charAt(0);\n    if (!first) return '';\n    if (/\\d/.test(first)) return '0-9';\n    return first.toUpperCase();\n  }\n\n  function hostOf(url) {\n    try {\n      return new URL(url).hostname.toLowerCase();\n    } catch {\n      return '';\n    }\n  }\n\n  function valuesFor(entry, mode, attrName) {\n    const a = parseAttrs(entry.extinf);\n    switch (mode) {\n      case 'group': {\n        let g = a['group-title'];\n        if (!g) {\n          const line = entry.extra.find((l) => /^#EXTGRP:/i.test(l));\n          if (line) g = line.slice(line.indexOf(':') + 1).trim();\n        }\n        return g ? [g] : [];\n      }\n      case 'country': return a['tvg-country'] ? [a['tvg-country']] : [];\n      case 'language': return a['tvg-language'] ? [a['tvg-language']] : [];\n      case 'letter': { const l = letterOf(entry.title); return l ? [l] : []; }\n      case 'type': { const t = streamType(entry.url); return t === 'unknown' ? [] : [t]; }\n      case 'bitrate': { const b = bitrateBucket(entry, a); return b === 'unknown' ? [] : [b]; }\n      case 'host': { const h = hostOf(entry.url); return h ? [h] : []; }\n      case 'scheme': { const m = /^([a-z][a-z0-9+.-]*):/i.exec(entry.url); return m ? [m[1].toLowerCase()] : []; }\n      case 'attr': return attrName && a[attrName] ? [a[attrName]] : [];\n      default: return [];\n    }\n  }\n\n  const slug = (s, lower) => {\n    let out = s.normalize('NFC').replace(/[^\\p{L}\\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60);\n    if (lower) out = out.toLowerCase();\n    return out || 'x';\n  };\n\n  function computeBuckets() {\n    const o = {\n      mode: $('mode').value,\n      attr: $('attrName').value.trim(),\n      chunk: Math.max(1, parseInt($('chunkSize').value, 10) || 500),\n      min: Math.max(1, parseInt($('minSize').value, 10) || 1),\n      order: $('order').value,\n      multi: $('multi').checked,\n      keepUnknown: $('keepUnknown').checked,\n      lower: $('lower').checked,\n      prefix: slug($('prefix').value.trim() || 'playlist', false),\n    };\n\n    const entries = state.parsed.entries.filter((e) => e.url);\n    state.skippedNoUrl = state.parsed.entries.length - entries.length;\n    const map = new Map();\n\n    const put = (key, label, entry) => {\n      let b = map.get(key);\n      if (!b) {\n        b = { key, label, entries: [], set: new Set() };\n        map.set(key, b);\n      }\n      if (!b.set.has(entry)) {\n        b.set.add(entry);\n        b.entries.push(entry);\n      }\n    };\n\n    let dropped = 0;\n\n    if (o.mode === 'chunk') {\n      entries.forEach((e, i) => {\n        const n = Math.floor(i / o.chunk) + 1;\n        put(`part-${String(n).padStart(3, '0')}`, `part ${n}`, e);\n      });\n    } else {\n      entries.forEach((e) => {\n        let values = valuesFor(e, o.mode, o.attr);\n        if (o.multi) values = values.flatMap((v) => v.split(/[;,|]/));\n        values = values.map((v) => v.replace(/\\s+/g, ' ').trim()).filter(Boolean);\n        if (!values.length) {\n          if (o.keepUnknown) put('\\u0000unknown', 'unknown', e);\n          else dropped++;\n          return;\n        }\n        values.forEach((v) => put(v.toLowerCase(), v, e));\n      });\n    }\n\n    let buckets = [...map.values()];\n\n    if (o.min > 1 && o.mode !== 'chunk') {\n      const small = buckets.filter((b) => b.key !== '\\u0000unknown' && b.entries.length \u003c o.min);\n      if (small.length) {\n        buckets = buckets.filter((b) => !small.includes(b));\n        const other = { key: '\\u0000other', label: 'other', entries: [], set: new Set() };\n        small.forEach((b) => b.entries.forEach((e) => { if (!other.set.has(e)) { other.set.add(e); other.entries.push(e); } }));\n        buckets.push(other);\n      }\n    }\n\n    const collator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });\n    if (o.mode === 'chunk') {\n      /* keep part order */\n    } else if (o.order === 'size') {\n      buckets.sort((a, b) => b.entries.length - a.entries.length || collator.compare(a.label, b.label));\n    } else {\n      buckets.sort((a, b) => collator.compare(a.label, b.label));\n    }\n\n    /* unique file names */\n    const used = new Set();\n    buckets.forEach((b) => {\n      const stem = o.mode === 'chunk' ? `${o.prefix}_${b.key}` : `${o.prefix}_${slug(b.label, o.lower)}`;\n      let name = stem;\n      let n = 2;\n      while (used.has(name.toLowerCase())) name = `${stem}-${n++}`;\n      used.add(name.toLowerCase());\n      b.filename = `${name}.m3u`;\n      b.include = true;\n    });\n\n    state.dropped = dropped;\n    return buckets;\n  }\n\n  function bucketText(bucket) {\n    const lines = [state.parsed.extm3u, ...state.parsed.header];\n    bucket.entries.forEach((e) => lines.push(...renderEntry(e)));\n    return lines.join('\\n') + '\\n';\n  }\n\n  /* ============================================================\n   UI\n   ============================================================ */\n  function recompute() {\n    if (!state.parsed) return;\n    state.buckets = computeBuckets();\n    renderBuckets();\n  }\n\n  const SHOW_LIMIT = 400;\n\n  function renderBuckets() {\n    const rows = state.buckets.slice(0, SHOW_LIMIT).map((b, i) =>\n      `\u003ctr data-i=\"${i}\"${b.include ? '' : ' class=\"off\"'}>` +\n      `\u003ctd>\u003cinput type=\"checkbox\" class=\"inc\"${b.include ? ' checked' : ''}>\u003c/td>` +\n      `\u003ctd>${escHtml(b.label)}\u003c/td>\u003ctd class=\"num\">${b.entries.length}\u003c/td>` +\n      `\u003ctd class=\"fname\">${escHtml(b.filename)}\u003c/td>` +\n      '\u003ctd>\u003cbutton class=\"mini yellow dl\">Save\u003c/button>\u003c/td>\u003c/tr>',\n    );\n    if (state.buckets.length > SHOW_LIMIT) {\n      rows.push(`\u003ctr>\u003ctd>\u003c/td>\u003ctd colspan=\"4\" class=\"fname\">...and ${state.buckets.length - SHOW_LIMIT} more buckets (they are all included in the ZIP)\u003c/td>\u003c/tr>`);\n    }\n    $('tbody').innerHTML = rows.join('');\n    $('results').classList.toggle('hidden', !state.buckets.length);\n    updateSummary();\n  }\n\n  function updateSummary() {\n    const chosen = state.buckets.filter((b) => b.include);\n    const written = chosen.reduce((n, b) => n + b.entries.length, 0);\n    $('zipBtn').textContent = `Download ZIP (${chosen.length} files)`;\n    $('zipBtn').disabled = !chosen.length;\n    say(\n      `${state.parsed.entries.length} entries loaded from ${state.name}. ${state.buckets.length} bucket(s), ${chosen.length} selected, ${written} entries to be written.` +\n        (state.skippedNoUrl ? ` ${state.skippedNoUrl} title-only entr${state.skippedNoUrl === 1 ? 'y' : 'ies'} without a URL skipped.` : '') +\n        (state.dropped ? ` ${state.dropped} entr${state.dropped === 1 ? 'y' : 'ies'} with no value dropped.` : ''),\n    );\n  }\n\n  $('tbody').addEventListener('change', (ev) => {\n    if (!ev.target.classList.contains('inc')) return;\n    const tr = ev.target.closest('tr');\n    const bucket = state.buckets[Number(tr.dataset.i)];\n    bucket.include = ev.target.checked;\n    tr.classList.toggle('off', !bucket.include);\n    updateSummary();\n  });\n\n  $('tbody').addEventListener('click', (ev) => {\n    const btn = ev.target.closest('button.dl');\n    if (!btn) return;\n    const bucket = state.buckets[Number(btn.closest('tr').dataset.i)];\n    saveBlob(new Blob([bucketText(bucket)], { type: 'audio/x-mpegurl' }), bucket.filename);\n  });\n\n  $('zipBtn').addEventListener('click', () => {\n    const files = state.buckets.filter((b) => b.include).map((b) => ({ name: b.filename, text: bucketText(b) }));\n    if (!files.length) return;\n    const stem = slug($('prefix').value.trim() || 'playlist', false);\n    saveBlob(buildZip(files), `${stem}_split.zip`);\n  });\n\n  function syncModeFields() {\n    const mode = $('mode').value;\n    $('attrWrap').classList.toggle('hidden', mode !== 'attr');\n    $('chunkWrap').classList.toggle('hidden', mode !== 'chunk');\n  }\n\n  ['mode', 'attrName', 'chunkSize', 'minSize', 'order', 'multi', 'keepUnknown', 'lower', 'prefix'].forEach((id) => {\n    $(id).addEventListener(id === 'mode' || id === 'order' || $(id).type === 'checkbox' ? 'change' : 'input', () => {\n      syncModeFields();\n      recompute();\n    });\n  });\n\n  $('fileLoad').addEventListener('click', loadFile);\n  $('urlLoad').addEventListener('click', loadUrl);\n  $('textLoad').addEventListener('click', loadPasted);\n  syncModeFields();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"compare",label:"Compare versions",tip:"See what was added, removed or changed between two playlists",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Diff\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.wide { width: 1240px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'] { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 240px; }\n.toolbar select { flex: 0 1 auto; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 68vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; min-width: max-content; }\n.grid th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 2px 4px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid tr.sel td { background: #2c2400; }\n.grid td input[type='text'] { width: 100%; margin: 0; padding: 4px 6px; border-width: 2px; font-size: 0.85em; }\n.grid td.idx { color: var(--muted); font-size: 0.8em; text-align: right; padding-right: 8px; }\n.grid td.acts { white-space: nowrap; }\n.rowbtn { display: inline-flex; width: 30px; height: 28px; margin-right: 4px; padding: 0; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 2px; }\n.pager span { min-width: 110px; text-align: center; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\n.container.mid { width: 1000px; }\n.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 6px; }\n.side { border: var(--bw) solid var(--line); background: var(--ink); padding: 10px; }\n.side h2 { margin: 0 0 6px; font-size: 1em; letter-spacing: 0.05em; text-transform: uppercase; color: var(--yellow); }\n.side input, .side textarea { width: 100%; margin: 4px 0; padding: 8px; border-width: 3px; font-size: 0.9em; }\n@media (max-width: 760px) { .sides { grid-template-columns: 1fr; } }\n.chips { margin: 8px 0; }\n.chip { display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px; border: 2px solid var(--line); background: var(--ink); cursor: pointer; font-size: 0.85em; user-select: none; }\n.chip.active { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }\n.chip.added { border-left: 7px solid var(--green); } .chip.removed { border-left: 7px solid var(--red); }\n.chip.changed { border-left: 7px solid var(--yellow); } .chip.moved { border-left: 7px solid var(--violet); }\n.badge { display: inline-block; padding: 1px 6px; font-size: 0.72em; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); }\n.b-added { background: var(--green); } .b-removed { background: var(--red); } .b-changed { background: var(--yellow); } .b-moved { background: var(--violet); }\n.grid td.det { color: var(--muted); font-size: 0.8em; word-break: break-all; }\n.grid td.nm small { display: block; color: var(--muted); font-size: 0.75em; word-break: break-all; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container mid\">\n\u003ch1>M3U Diff\u003c/h1>\n\n\u003cdiv class=\"sides\">\n\u003cdiv class=\"side\">\n\u003ch2>Old version (A)\u003c/h2>\n\u003cinput type=\"file\" id=\"aFile\" accept=\".m3u,.m3u8,.txt\">\n\u003cinput type=\"text\" id=\"aUrl\" placeholder=\"or an online M3U URL...\">\n\u003ctextarea id=\"aText\" rows=\"3\" placeholder=\"or paste M3U content...\">\u003c/textarea>\n\u003c/div>\n\u003cdiv class=\"side\">\n\u003ch2>New version (B)\u003c/h2>\n\u003cinput type=\"file\" id=\"bFile\" accept=\".m3u,.m3u8,.txt\">\n\u003cinput type=\"text\" id=\"bUrl\" placeholder=\"or an online M3U URL...\">\n\u003ctextarea id=\"bText\" rows=\"3\" placeholder=\"or paste M3U content...\">\u003c/textarea>\n\u003c/div>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Compare options\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oLoose\" checked>\u003clabel for=\"oLoose\">Treat http/https, www., trailing slash and tracking params as the same URL\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oAttrs\" checked>\u003clabel for=\"oAttrs\">Report changed attributes (logo, group, country...)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oMoved\" checked>\u003clabel for=\"oMoved\">Pair a removed and an added station with the same title as \"URL changed\"\u003c/label>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"center-col\">\u003cbutton id=\"compareBtn\" class=\"orange wide-btn\">Compare\u003c/button>\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"results\" class=\"hidden\">\n\u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>Change\u003c/th>\u003cth>Station\u003c/th>\u003cth>Details\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"mdBtn\" class=\"green wide-btn\">Download Changelog (.md)\u003c/button>\n\u003cbutton id=\"addedBtn\" class=\"yellow wide-btn\">Download Added (.m3u)\u003c/button>\n\u003cbutton id=\"removedBtn\" class=\"yellow wide-btn\">Download Removed (.m3u)\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  /* ---------------- M3U core ---------------- */\n  function splitExtinf(line) {\n    let q = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      if (line[i] === '\"') q = !q;\n      else if (line[i] === ',' && !q) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pe = null;\n    let px = [];\n    const flush = (url) => { entries.push({ extinf: pe, extra: px, url }); pe = null; px = []; };\n    for (const line of lines) {\n      if (!line) continue;\n      if (/^#EXTM3U/i.test(line)) { if (!seen) extm3u = line; continue; }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) { if (pe) flush(null); pe = line; continue; }\n      if (line.startsWith('#')) { if (!entries.length && !pe) header.push(line); else px.push(line); continue; }\n      flush(line);\n    }\n    if (pe) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function renderEntry(e) {\n    const out = [];\n    if (e.extinf) out.push(e.extinf);\n    out.push(...e.extra);\n    if (e.url) out.push(e.url);\n    return out;\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    const { prefix } = splitExtinf(extinf);\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  const JUNK = /^(utm_[a-z]+|fbclid|gclid|cb|nocache|_|ts|timestamp|rnd)$/i;\n\n  function urlKey(raw, loose) {\n    if (!loose) return raw.trim();\n    let u;\n    try { u = new URL(raw); } catch { return raw.trim().toLowerCase(); }\n    if (u.protocol !== 'http:' && u.protocol !== 'https:') return u.href;\n    const host = u.hostname.toLowerCase().replace(/^www\\./, '');\n    let port = u.port;\n    if (port === '80' || port === '443') port = '';\n    const path = u.pathname.replace(/\\/{2,}/g, '/').replace(/\\/;?$/, '');\n    const params = [...u.searchParams.entries()].filter(([k]) => !JUNK.test(k)).sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]));\n    return host + (port ? `:${port}` : '') + path + (params.length ? `?${params.map(([k, v]) => `${k}=${v}`).join('&')}` : '');\n  }\n\n  const titleKey = (t) => t.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().replace(/[([][^)\\]]*[)\\]]/g, ' ').replace(/[^\\p{L}\\p{N}]+/gu, '');\n\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  async function readSide(prefix, label) {\n    const file = $(`${prefix}File`).files[0];\n    if (file) return { text: await file.text(), name: file.name };\n    const input = $(`${prefix}Url`).value.trim();\n    if (input) {\n      const controller = new AbortController();\n      const timer = setTimeout(() => controller.abort(), 20000);\n      try {\n        const url = normalizeOnlineUrl(input);\n        const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });\n        if (!response.ok) throw new Error(`HTTP ${response.status}`);\n        let name = label;\n        try { name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || label; } catch { /* keep */ }\n        return { text: await response.text(), name };\n      } catch (error) {\n        throw new Error(`${label}: could not fetch (${error.message}). The server may block browser CORS requests.`);\n      } finally {\n        clearTimeout(timer);\n      }\n    }\n    const text = $(`${prefix}Text`).value;\n    if (text.trim()) return { text, name: `${label}.m3u` };\n    throw new Error(`${label}: choose a file, enter a URL or paste some M3U content.`);\n  }\n\n  /* ---------------- diff ---------------- */\n  const state = { a: null, b: null, rows: [], counts: {}, filter: null, nameA: 'A', nameB: 'B' };\n\n  function indexEntries(parsed, loose) {\n    const map = new Map();\n    let dupes = 0;\n    parsed.entries.forEach((e) => {\n      if (!e.url) return;\n      const key = urlKey(e.url, loose);\n      if (map.has(key)) { dupes++; return; }\n      map.set(key, e);\n    });\n    return { map, dupes };\n  }\n\n  function diffAttrs(ea, eb) {\n    const a = parseAttrs(ea.extinf);\n    const b = parseAttrs(eb.extinf);\n    const out = [];\n    if (ea.title !== eb.title) out.push(`title: \"${ea.title}\" -> \"${eb.title}\"`);\n    if (!$('oLoose').checked && ea.url !== eb.url) out.push(`url: ${ea.url} -> ${eb.url}`);\n    if ($('oAttrs').checked) {\n      new Set([...Object.keys(a), ...Object.keys(b)]).forEach((k) => {\n        if ((a[k] || '') !== (b[k] || '')) out.push(`${k}: \"${a[k] || ''}\" -> \"${b[k] || ''}\"`);\n      });\n    }\n    return out;\n  }\n\n  function compare() {\n    const loose = $('oLoose').checked;\n    const ia = indexEntries(state.a, loose);\n    const ib = indexEntries(state.b, loose);\n    const rows = [];\n    let same = 0;\n    const onlyA = [];\n    const onlyB = [];\n\n    ib.map.forEach((eb, key) => {\n      const ea = ia.map.get(key);\n      if (!ea) { onlyB.push({ key, e: eb }); return; }\n      const diffs = diffAttrs(ea, eb);\n      if (diffs.length) rows.push({ type: 'changed', a: ea, b: eb, details: diffs });\n      else same++;\n    });\n    ia.map.forEach((ea, key) => { if (!ib.map.has(key)) onlyA.push({ key, e: ea }); });\n\n    if ($('oMoved').checked) {\n      const pool = new Map();\n      onlyA.forEach((x, i) => {\n        const tk = titleKey(x.e.title);\n        if (!tk) return;\n        if (!pool.has(tk)) pool.set(tk, []);\n        pool.get(tk).push(i);\n      });\n      const usedA = new Set();\n      const usedB = new Set();\n      onlyB.forEach((y, j) => {\n        const list = pool.get(titleKey(y.e.title));\n        if (!list || !titleKey(y.e.title)) return;\n        const i = list.find((n) => !usedA.has(n));\n        if (i === undefined) return;\n        usedA.add(i);\n        usedB.add(j);\n        rows.push({ type: 'moved', a: onlyA[i].e, b: y.e, details: [`${onlyA[i].e.url}`, `-> ${y.e.url}`] });\n      });\n      onlyA.forEach((x, i) => { if (!usedA.has(i)) rows.push({ type: 'removed', a: x.e, details: [x.e.url] }); });\n      onlyB.forEach((y, j) => { if (!usedB.has(j)) rows.push({ type: 'added', b: y.e, details: [y.e.url] }); });\n    } else {\n      onlyA.forEach((x) => rows.push({ type: 'removed', a: x.e, details: [x.e.url] }));\n      onlyB.forEach((y) => rows.push({ type: 'added', b: y.e, details: [y.e.url] }));\n    }\n\n    const order = { added: 0, removed: 1, moved: 2, changed: 3 };\n    rows.sort((p, q) => order[p.type] - order[q.type]);\n\n    state.rows = rows;\n    state.counts = { added: 0, removed: 0, moved: 0, changed: 0, same };\n    rows.forEach((r) => { state.counts[r.type]++; });\n    state.dupes = { a: ia.dupes, b: ib.dupes };\n    state.filter = null;\n    render();\n  }\n\n  const LABEL = { added: 'Added', removed: 'Removed', moved: 'URL changed', changed: 'Changed' };\n  const SHOW_LIMIT = 1500;\n\n  function render() {\n    const c = state.counts;\n    $('results').classList.remove('hidden');\n    say(\n      `${state.nameA} (${state.a.entries.filter((e) => e.url).length} streams) vs ${state.nameB} (${state.b.entries.filter((e) => e.url).length} streams): ` +\n        `${c.added} added, ${c.removed} removed, ${c.moved} URL changed, ${c.changed} changed, ${c.same} unchanged.` +\n        (state.dupes.a || state.dupes.b ? ` Repeated URLs inside a file are counted once (${state.dupes.a} in A, ${state.dupes.b} in B).` : ''),\n    );\n\n    $('chips').innerHTML = ['added', 'removed', 'moved', 'changed']\n      .map((t) => `\u003cspan class=\"chip ${t}${state.filter === t ? ' active' : ''}\" data-t=\"${t}\">${LABEL[t]} &middot; ${c[t]}\u003c/span>`)\n      .join('');\n\n    const rows = state.rows.filter((r) => !state.filter || r.type === state.filter);\n    $('tbody').innerHTML =\n      rows.slice(0, SHOW_LIMIT).map((r) => {\n        const e = r.b || r.a;\n        const det = r.details.map(esc).join('\u003cbr>');\n        return `\u003ctr>\u003ctd>\u003cspan class=\"badge b-${r.type}\">${LABEL[r.type]}\u003c/span>\u003c/td>\u003ctd class=\"nm\">${esc(e.title || '(no title)')}\u003c/td>\u003ctd class=\"det\">${det}\u003c/td>\u003c/tr>`;\n      }).join('') +\n      (rows.length > SHOW_LIMIT ? `\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"det\">...and ${rows.length - SHOW_LIMIT} more. They are all in the downloads.\u003c/td>\u003c/tr>` : '') +\n      (!rows.length ? '\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"det\">No differences to show.\u003c/td>\u003c/tr>' : '');\n  }\n\n  $('chips').addEventListener('click', (ev) => {\n    const chip = ev.target.closest('.chip');\n    if (!chip) return;\n    state.filter = state.filter === chip.dataset.t ? null : chip.dataset.t;\n    render();\n  });\n\n  $('compareBtn').addEventListener('click', async () => {\n    $('compareBtn').disabled = true;\n    say('Reading both playlists...');\n    try {\n      const [a, b] = await Promise.all([readSide('a', 'Old version'), readSide('b', 'New version')]);\n      state.a = parseM3U(a.text);\n      state.b = parseM3U(b.text);\n      state.nameA = a.name;\n      state.nameB = b.name;\n      if (!state.a.entries.length || !state.b.entries.length) throw new Error('One of the playlists has no entries.');\n      compare();\n    } catch (error) {\n      say(error.message);\n    } finally {\n      $('compareBtn').disabled = false;\n    }\n  });\n  ['oLoose', 'oAttrs', 'oMoved'].forEach((id) => $(id).addEventListener('change', () => { if (state.a && state.b) compare(); }));\n\n  /* ---------------- exports ---------------- */\n  function save(text, mime, name) {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  const stem = (n) => n.replace(/\\.(m3u8?|txt)$/i, '');\n\n  function playlistOf(type) {\n    const src = type === 'added' ? state.b : state.a;\n    const lines = [src.extm3u, ...src.header];\n    state.rows.filter((r) => r.type === type).forEach((r) => lines.push(...renderEntry(type === 'added' ? r.b : r.a)));\n    return `${lines.join('\\n')}\\n`;\n  }\n\n  $('addedBtn').addEventListener('click', () => save(playlistOf('added'), 'audio/x-mpegurl', `${stem(state.nameB)}_added.m3u`));\n  $('removedBtn').addEventListener('click', () => save(playlistOf('removed'), 'audio/x-mpegurl', `${stem(state.nameA)}_removed.m3u`));\n\n  $('mdBtn').addEventListener('click', () => {\n    const c = state.counts;\n    const today = new Date().toISOString().slice(0, 10);\n    const out = [\n      `# Playlist changes (${today})`, '',\n      `Compared \\`${state.nameA}\\` with \\`${state.nameB}\\`.`, '',\n      '## Summary', '',\n      `- Added: ${c.added}`, `- Removed: ${c.removed}`, `- URL changed: ${c.moved}`, `- Changed: ${c.changed}`, `- Unchanged: ${c.same}`, '',\n    ];\n    const section = (type, title, line) => {\n      const list = state.rows.filter((r) => r.type === type);\n      if (!list.length) return;\n      out.push(`## ${title} (${list.length})`, '');\n      list.forEach((r) => out.push(line(r)));\n      out.push('');\n    };\n    const name = (r) => (r.b || r.a).title || '(no title)';\n    section('added', 'Added', (r) => `- **${name(r)}**: ${r.b.url}`);\n    section('removed', 'Removed', (r) => `- **${name(r)}**: ${r.a.url}`);\n    section('moved', 'URL changed', (r) => `- **${name(r)}**: ${r.a.url} -> ${r.b.url}`);\n    section('changed', 'Changed', (r) => `- **${name(r)}**: ${r.details.join('; ')}`);\n    save(`${out.join('\\n')}\\n`, 'text/markdown', `${stem(state.nameB)}_changelog.md`);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"stats",label:"Playlist stats",tip:"Counts, missing metadata, protocols, hosts and more",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Stats\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.wide { width: 1240px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'] { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 240px; }\n.toolbar select { flex: 0 1 auto; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 68vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; min-width: max-content; }\n.grid th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 2px 4px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid tr.sel td { background: #2c2400; }\n.grid td input[type='text'] { width: 100%; margin: 0; padding: 4px 6px; border-width: 2px; font-size: 0.85em; }\n.grid td.idx { color: var(--muted); font-size: 0.8em; text-align: right; padding-right: 8px; }\n.grid td.acts { white-space: nowrap; }\n.rowbtn { display: inline-flex; width: 30px; height: 28px; margin-right: 4px; padding: 0; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 2px; }\n.pager span { min-width: 110px; text-align: center; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\n.container.mid { width: 1000px; }\n.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 10px; }\n@media (max-width: 800px) { .cards { grid-template-columns: 1fr; } }\n.card { border: var(--bw) solid var(--line); background: var(--ink); padding: 0 0 6px; min-width: 0; }\n.card.full { grid-column: 1 / -1; }\n.card h2 { margin: 0 0 8px; padding: 5px 10px; background: var(--yellow); color: var(--ink); font-size: 0.85em; letter-spacing: 0.06em; text-transform: uppercase; }\n.bigs { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 4px 10px 8px; }\n.big b { display: block; font-size: 1.7em; color: var(--yellow); line-height: 1.1; }\n.big span { font-size: 0.75em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }\n.brow { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; gap: 8px; align-items: center; padding: 2px 10px; font-size: 0.85em; }\n.brow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.brow .bar { height: 14px; background: #2a2a2a; border: 2px solid #444; }\n.brow .bar i { display: block; height: 100%; background: var(--orange); }\n.brow.good .bar i { background: var(--green); }\n.brow .cnt { color: var(--muted); white-space: nowrap; font-size: 0.85em; }\n.brow .cnt button { display: inline-flex; vertical-align: middle; margin-left: 6px; height: 22px; padding: 0 6px; font-size: 0.7em; box-shadow: 1px 1px 0 var(--text); }\n.note { padding: 2px 10px; color: var(--muted); font-size: 0.8em; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container mid\">\n\u003ch1>M3U Stats\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\" multiple>\n\u003cbutton id=\"fileLoad\" class=\"orange\">Analyze local files\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlLoad\" class=\"pink\">Analyze Online Link\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textLoad\" class=\"violet\">Analyze Pasted streams\u003c/button>\n\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"results\" class=\"hidden\">\n\u003cdiv class=\"cards\" id=\"cards\">\u003c/div>\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"csvBtn\" class=\"green wide-btn\">Download Stats (CSV)\u003c/button>\n\u003cbutton id=\"jsonBtn\" class=\"yellow wide-btn\">Download Stats (JSON)\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  const fmt = (n) => n.toLocaleString();\n  const pct = (n, t) => (t ? `${Math.round((n / t) * 1000) / 10}%` : '0%');\n\n  function splitExtinf(line) {\n    let q = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      if (line[i] === '\"') q = !q;\n      else if (line[i] === ',' && !q) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pe = null;\n    let px = [];\n    const flush = (url) => { entries.push({ extinf: pe, extra: px, url }); pe = null; px = []; };\n    for (const line of lines) {\n      if (!line) continue;\n      if (/^#EXTM3U/i.test(line)) { if (!seen) extm3u = line; continue; }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) { if (pe) flush(null); pe = line; continue; }\n      if (line.startsWith('#')) { if (!entries.length && !pe) header.push(line); else px.push(line); continue; }\n      flush(line);\n    }\n    if (pe) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    const { prefix } = splitExtinf(extinf);\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  function renderEntry(e) {\n    const out = [];\n    if (e.extinf) out.push(e.extinf);\n    out.push(...e.extra);\n    if (e.url) out.push(e.url);\n    return out;\n  }\n\n  function streamType(url) {\n    const bare = url.split('?')[0].toLowerCase();\n    const m = /\\.(mp3|aacp?|ogg|oga|opus|flac|m3u8|pls|m4a|wav|wma|asx)(?:$|[;/])/.exec(bare) || /[;/][^;/]*\\.(mp3|aacp?|ogg|oga|opus|flac|m3u8|m4a)$/.exec(bare);\n    if (!m) return 'not in URL';\n    const t = m[1];\n    return t === 'aacp' ? 'aac' : t === 'oga' ? 'ogg' : t === 'm3u8' ? 'hls (m3u8)' : t;\n  }\n\n  function bitrateBucket(e, a) {\n    const src = `${a['tvg-bitrate'] || ''} ${a.bitrate || ''} ${e.title} ${e.url}`;\n    const m = /(\\d{2,3})\\s*(?:k\\b|kbps|kb\\/s|kbit)/i.exec(src) || /[^\\d](\\d{2,3})k[^a-z]/i.exec(` ${src} `);\n    if (!m) return 'not stated';\n    const k = Number(m[1]);\n    return k \u003c= 64 ? '64k and below' : k \u003c= 128 ? '65-128k' : k \u003c= 192 ? '129-192k' : 'above 192k';\n  }\n\n  const hostOf = (u) => { try { return new URL(u).hostname.toLowerCase(); } catch { return ''; } };\n\n  function groupOf(e, a) {\n    if (a['group-title']) return a['group-title'];\n    const line = e.extra.find((l) => /^#EXTGRP:/i.test(l));\n    return line ? line.slice(line.indexOf(':') + 1).trim() : '';\n  }\n\n  const state = { parsed: null, name: '', stats: null };\n\n  function computeStats(parsed) {\n    const all = parsed.entries;\n    const withUrl = all.filter((e) => e.url);\n    const total = withUrl.length;\n    const keys = new Map();\n    const dist = { scheme: new Map(), type: new Map(), bitrate: new Map(), group: new Map(), country: new Map(), language: new Map(), host: new Map() };\n    const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);\n    const FIELDS = ['group-title', 'tvg-logo', 'tvg-id', 'tvg-name', 'tvg-country', 'tvg-language'];\n    const filled = Object.fromEntries(FIELDS.map((f) => [f, 0]));\n    let dupUrls = 0;\n\n    withUrl.forEach((e) => {\n      const a = parseAttrs(e.extinf);\n      const key = e.url.toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/;?$/, '');\n      if (keys.has(key)) dupUrls++; else keys.set(key, 1);\n      const sm = /^([a-z][a-z0-9+.-]*):/i.exec(e.url);\n      bump(dist.scheme, sm ? `${sm[1].toLowerCase()}://` : 'no scheme');\n      bump(dist.type, streamType(e.url));\n      bump(dist.bitrate, bitrateBucket(e, a));\n      const g = groupOf(e, a);\n      if (g) filled['group-title']++;\n      bump(dist.group, g || '(none)');\n      FIELDS.slice(1).forEach((f) => { if (a[f]) filled[f]++; });\n      bump(dist.country, a['tvg-country'] || '(none)');\n      bump(dist.language, a['tvg-language'] || '(none)');\n      bump(dist.host, hostOf(e.url) || '(none)');\n    });\n\n    return {\n      total, noUrl: all.length - total, unique: keys.size, dupUrls, titleless: withUrl.filter((e) => !e.title).length,\n      hosts: dist.host.size, fields: FIELDS.map((f) => ({ field: f, filled: filled[f] })), dist,\n    };\n  }\n\n  const sortMap = (m) => [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));\n\n  function bars(title, map, total, { top = 12, full = false } = {}) {\n    const rows = sortMap(map);\n    const shown = rows.slice(0, top);\n    const rest = rows.slice(top).reduce((n, r) => n + r[1], 0);\n    if (rest) shown.push([`${rows.length - top} more`, rest]);\n    const max = Math.max(1, ...shown.map((r) => r[1]));\n    return (\n      `\u003cdiv class=\"card${full ? ' full' : ''}\">\u003ch2>${esc(title)}\u003c/h2>` +\n      shown.map(([k, n]) => `\u003cdiv class=\"brow\">\u003cspan class=\"lab\" title=\"${esc(k)}\">${esc(k)}\u003c/span>\u003cspan class=\"bar\">\u003ci style=\"width:${(n / max) * 100}%\">\u003c/i>\u003c/span>\u003cspan class=\"cnt\">${fmt(n)} &middot; ${pct(n, total)}\u003c/span>\u003c/div>`).join('') +\n      '\u003c/div>'\n    );\n  }\n\n  function render() {\n    const s = state.stats;\n    const big = (v, l) => `\u003cdiv class=\"big\">\u003cb>${v}\u003c/b>\u003cspan>${l}\u003c/span>\u003c/div>`;\n    let html =\n      `\u003cdiv class=\"card full\">\u003ch2>Overview &middot; ${esc(state.name)}\u003c/h2>\u003cdiv class=\"bigs\">` +\n      big(fmt(s.total), 'streams') + big(fmt(s.unique), 'unique URLs') + big(fmt(s.dupUrls), 'repeated URLs') +\n      big(fmt(s.hosts), 'server hosts') + big(fmt(s.titleless), 'without a title') + (s.noUrl ? big(fmt(s.noUrl), 'title-only, no URL') : '') +\n      '\u003c/div>\u003c/div>';\n\n    html += '\u003cdiv class=\"card full\">\u003ch2>Metadata completeness\u003c/h2>';\n    s.fields.forEach((f) => {\n      const missing = s.total - f.filled;\n      html +=\n        `\u003cdiv class=\"brow good\">\u003cspan class=\"lab\">${esc(f.field)}\u003c/span>\u003cspan class=\"bar\">\u003ci style=\"width:${s.total ? (f.filled / s.total) * 100 : 0}%\">\u003c/i>\u003c/span>` +\n        `\u003cspan class=\"cnt\">${fmt(f.filled)} / ${fmt(s.total)} &middot; ${pct(f.filled, s.total)}` +\n        (missing ? `\u003cbutton class=\"mini white\" data-miss=\"${esc(f.field)}\">Missing .m3u\u003c/button>` : '') + '\u003c/span>\u003c/div>';\n    });\n    html += '\u003c/div>';\n\n    html += bars('Protocol', s.dist.scheme, s.total);\n    html += bars('Stream type (from the URL)', s.dist.type, s.total);\n    html += bars('Bitrate (from title / URL)', s.dist.bitrate, s.total);\n    html += bars('Countries', s.dist.country, s.total);\n    html += bars('Groups', s.dist.group, s.total, { top: 15 });\n    html += bars('Languages', s.dist.language, s.total);\n    html += bars('Most used server hosts', s.dist.host, s.total, { top: 15, full: true });\n\n    $('cards').innerHTML = html;\n    $('results').classList.remove('hidden');\n    say(`${state.name}: ${fmt(s.total)} streams analysed.`);\n  }\n\n  function save(text, mime, name) {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  const stem = () => state.name.replace(/\\.(m3u8?|txt)$/i, '').replace(/[^\\w.-]+/g, '_') || 'playlist';\n\n  $('cards').addEventListener('click', (ev) => {\n    const btn = ev.target.closest('button[data-miss]');\n    if (!btn) return;\n    const field = btn.dataset.miss;\n    const lines = [state.parsed.extm3u, ...state.parsed.header];\n    let n = 0;\n    state.parsed.entries.forEach((e) => {\n      if (!e.url) return;\n      const a = parseAttrs(e.extinf);\n      const has = field === 'group-title' ? groupOf(e, a) : a[field];\n      if (!has) { lines.push(...renderEntry(e)); n++; }\n    });\n    save(`${lines.join('\\n')}\\n`, 'audio/x-mpegurl', `${stem()}_missing_${field}.m3u`);\n    say(`${fmt(n)} streams without ${field} saved.`);\n  });\n\n  function csvCell(v) { return `\"${String(v).replace(/\"/g, '\"\"')}\"`; }\n\n  $('csvBtn').addEventListener('click', () => {\n    const s = state.stats;\n    const rows = [['section', 'name', 'count', 'percent']];\n    rows.push(['overview', 'streams', s.total, ''], ['overview', 'unique URLs', s.unique, ''], ['overview', 'repeated URLs', s.dupUrls, ''], ['overview', 'hosts', s.hosts, ''], ['overview', 'without title', s.titleless, '']);\n    s.fields.forEach((f) => rows.push(['completeness', f.field, f.filled, pct(f.filled, s.total)]));\n    Object.entries(s.dist).forEach(([name, map]) => sortMap(map).forEach(([k, n]) => rows.push([name, k, n, pct(n, s.total)])));\n    save(`${rows.map((r) => r.map(csvCell).join(',')).join('\\n')}\\n`, 'text/csv', `${stem()}_stats.csv`);\n  });\n\n  $('jsonBtn').addEventListener('click', () => {\n    const s = state.stats;\n    const out = {\n      file: state.name, streams: s.total, uniqueUrls: s.unique, repeatedUrls: s.dupUrls, hosts: s.hosts, withoutTitle: s.titleless,\n      completeness: Object.fromEntries(s.fields.map((f) => [f.field, { filled: f.filled, missing: s.total - f.filled }])),\n      distributions: Object.fromEntries(Object.entries(s.dist).map(([k, m]) => [k, Object.fromEntries(sortMap(m))])),\n    };\n    save(`${JSON.stringify(out, null, 2)}\\n`, 'application/json', `${stem()}_stats.json`);\n  });\n\n  function load(text, name) {\n    const parsed = parseM3U(text);\n    if (!parsed.entries.length) return say('No entries found in that playlist.');\n    state.parsed = parsed;\n    state.name = name;\n    state.stats = computeStats(parsed);\n    render();\n  }\n\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  $('fileLoad').addEventListener('click', async () => {\n    const files = [...$('fileInput').files];\n    if (!files.length) return alert('Please upload one or more M3U files.');\n    const texts = await Promise.all(files.map((f) => f.text()));\n    load(texts.join('\\n'), files.length === 1 ? files[0].name : `${files.length} files combined`);\n  });\n\n  $('urlLoad').addEventListener('click', async () => {\n    const input = $('urlInput').value.trim();\n    if (!input) return alert('Please enter an online M3U URL.');\n    say('Fetching...');\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 20000);\n    try {\n      const url = normalizeOnlineUrl(input);\n      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      let name = 'playlist.m3u';\n      try { name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || name; } catch { /* keep */ }\n      load(await response.text(), name);\n    } catch (error) {\n      say(`Error fetching online M3U file: ${error.message}. The server may block browser CORS requests.`);\n    } finally {\n      clearTimeout(timer);\n    }\n  });\n\n  $('textLoad').addEventListener('click', () => {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    load(text, 'pasted_streams.m3u');\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"browse",label:"Browse & play",tip:"Browse a repo's playlists, search stations and listen in the browser",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Radio Browser\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.wide { width: 1240px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'] { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 240px; }\n.toolbar select { flex: 0 1 auto; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 68vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; min-width: max-content; }\n.grid th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 2px 4px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid tr.sel td { background: #2c2400; }\n.grid td input[type='text'] { width: 100%; margin: 0; padding: 4px 6px; border-width: 2px; font-size: 0.85em; }\n.grid td.idx { color: var(--muted); font-size: 0.8em; text-align: right; padding-right: 8px; }\n.grid td.acts { white-space: nowrap; }\n.rowbtn { display: inline-flex; width: 30px; height: 28px; margin-right: 4px; padding: 0; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 2px; }\n.pager span { min-width: 110px; text-align: center; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\n/* Browser additions */\n.container.wide { width: 1100px; }\n.pl-list { border: var(--bw) solid var(--line); background: var(--ink); max-height: 250px; overflow: auto; }\n.pl-row { display: flex; gap: 10px; padding: 5px 10px; border-bottom: 2px solid #333; cursor: pointer; }\n.pl-row:hover { background: #222222; }\n.pl-row .dir { color: var(--muted); }\n.pl-row .sz { margin-left: auto; color: var(--muted); font-size: 0.8em; white-space: nowrap; }\n.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 6px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.panel-head input { margin: 0; padding: 6px 8px; border-width: 3px; max-width: 280px; text-transform: none; letter-spacing: 0; font-weight: 400; }\n.player { position: sticky; top: 0; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 10px 0; padding: 8px 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.player .now { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.player .now small { display: block; color: var(--muted); font-size: 0.78em; overflow: hidden; text-overflow: ellipsis; }\n.player input[type='range'] { width: 110px; margin: 0; padding: 0; border: 0; background: transparent; accent-color: var(--orange); }\n.player .auto { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }\n.grid td.nm { min-width: 220px; }\n.grid td.nm small { display: block; color: var(--muted); font-size: 0.75em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }\n.grid td.dim { color: var(--muted); font-size: 0.85em; }\n.grid tr.playing td { background: #10301f; }\n.grid .tag-http { display: inline-block; margin-left: 6px; padding: 0 4px; background: var(--blue); color: var(--ink); font-size: 0.7em; font-weight: 900; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container wide\">\n\u003ch1>M3U Radio Browser\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"repoInput\" placeholder=\"GitHub repository, e.g. junguler/m3u-radio-music-playlists\" value=\"junguler/m3u-radio-music-playlists\">\n\u003cbutton id=\"repoLoad\" class=\"orange\">Load repository\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\">\n\u003cbutton id=\"fileLoad\" class=\"pink\">Open local file\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"2\" placeholder=\"Or paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textLoad\" class=\"violet\">Open pasted streams\u003c/button>\n\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"repoPanel\" class=\"hidden\">\n\u003cdiv class=\"panel-head\">\u003cspan id=\"repoTitle\">Playlists\u003c/span>\u003cinput type=\"search\" id=\"plFilter\" placeholder=\"Filter playlists...\">\u003c/div>\n\u003cdiv class=\"pl-list\" id=\"plList\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"stationPanel\" class=\"hidden\">\n\u003cdiv class=\"panel-head\">\u003cspan id=\"plTitle\">Stations\u003c/span>\u003c/div>\n\n\u003cdiv class=\"player\">\n\u003cbutton id=\"prevBtn\" class=\"mini white\" title=\"Previous\">&laquo;\u003c/button>\n\u003cbutton id=\"playBtn\" class=\"mini green\" title=\"Play or stop\">Play\u003c/button>\n\u003cbutton id=\"nextBtn\" class=\"mini white\" title=\"Next\">&raquo;\u003c/button>\n\u003cdiv class=\"now\">\u003cspan id=\"nowTitle\">Nothing playing\u003c/span>\u003csmall id=\"nowStatus\">Press play on a station.\u003c/small>\u003c/div>\n\u003clabel class=\"auto\">\u003cinput type=\"checkbox\" id=\"autoSkip\" checked>Skip dead streams\u003c/label>\n\u003cinput type=\"range\" id=\"vol\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.8\" title=\"Volume\">\n\u003c/div>\n\n\u003cdiv class=\"toolbar\">\n\u003cinput type=\"search\" id=\"search\" placeholder=\"Search title, group, country or host...\">\n\u003cselect id=\"groupSel\" title=\"Group\">\u003c/select>\n\u003cselect id=\"countrySel\" title=\"Country\">\u003c/select>\n\u003c/div>\n\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Station\u003c/th>\u003cth>Group\u003c/th>\u003cth>Country\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"pager\">\n\u003cbutton id=\"firstPg\" class=\"mini white\">&laquo;\u003c/button>\n\u003cbutton id=\"prevPg\" class=\"mini white\">&lsaquo;\u003c/button>\n\u003cspan id=\"pageInfo\">\u003c/span>\n\u003cbutton id=\"nextPg\" class=\"mini white\">&rsaquo;\u003c/button>\n\u003cbutton id=\"lastPg\" class=\"mini white\">&raquo;\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"rawBtn\" class=\"yellow wide-btn\" disabled>Copy raw playlist URL\u003c/button>\n\u003cbutton id=\"dlBtn\" class=\"green wide-btn\">Download playlist\u003c/button>\n\u003cbutton id=\"dlViewBtn\" class=\"green wide-btn\">Download filtered view\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  /* ---------------- M3U core ---------------- */\n  function splitExtinf(line) {\n    let q = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      if (line[i] === '\"') q = !q;\n      else if (line[i] === ',' && !q) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    const { prefix } = splitExtinf(extinf);\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pe = null;\n    let px = [];\n    const flush = (url) => { entries.push({ extinf: pe, extra: px, url }); pe = null; px = []; };\n    for (const line of lines) {\n      if (!line) continue;\n      if (/^#EXTM3U/i.test(line)) { if (!seen) extm3u = line; continue; }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) { if (pe) flush(null); pe = line; continue; }\n      if (line.startsWith('#')) { if (!entries.length && !pe) header.push(line); else px.push(line); continue; }\n      flush(line);\n    }\n    if (pe) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function renderEntry(e) {\n    const out = [];\n    if (e.extinf) out.push(e.extinf);\n    out.push(...e.extra);\n    if (e.url) out.push(e.url);\n    return out;\n  }\n\n  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\\./, ''); } catch { return ''; } };\n\n  const state = {\n    repo: null, files: [], parsed: null, stations: [], visible: [], page: 0,\n    name: '', text: '', rawUrl: '', now: null,\n  };\n\n  /* ============================================================\n   GITHUB REPOSITORY LISTING\n   ============================================================ */\n  function parseRepo(input) {\n    const s = input.trim().replace(/\\.git$/, '');\n    const m = /github\\.com\\/([^/\\s]+)\\/([^/\\s#?]+)/i.exec(s);\n    if (m) return { owner: m[1], name: m[2] };\n    const m2 = /^([\\w.-]+)\\/([\\w.-]+)$/.exec(s);\n    return m2 ? { owner: m2[1], name: m2[2] } : null;\n  }\n\n  async function timedFetch(url, ms, options) {\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), ms);\n    try {\n      return await fetch(url, { ...options, signal: controller.signal });\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  async function gh(path) {\n    const response = await timedFetch(`https://api.github.com${path}`, 20000, { headers: { Accept: 'application/vnd.github+json' } });\n    const data = await response.json().catch(() => ({}));\n    if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);\n    return data;\n  }\n\n  const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');\n\n  async function loadRepo() {\n    const repo = parseRepo($('repoInput').value);\n    if (!repo) return alert('Enter a repository as owner/name or paste its GitHub URL.');\n    $('repoLoad').disabled = true;\n    say(`Loading ${repo.owner}/${repo.name}...`);\n    try {\n      const info = await gh(`/repos/${repo.owner}/${repo.name}`).catch(() => null);\n      const branch = (info && info.default_branch) || 'HEAD';\n      const tree = await gh(`/repos/${repo.owner}/${repo.name}/git/trees/${encodeURIComponent(branch)}?recursive=1`);\n      const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });\n      state.repo = { ...repo, branch };\n      state.files = tree.tree\n        .filter((t) => t.type === 'blob' && /\\.m3u8?$/i.test(t.path))\n        .map((t) => ({ path: t.path, size: t.size || 0 }))\n        .sort((a, b) => collator.compare(a.path, b.path));\n      $('repoTitle').textContent = `Playlists in ${repo.owner}/${repo.name} (${state.files.length})`;\n      $('plFilter').value = '';\n      renderFiles();\n      $('repoPanel').classList.remove('hidden');\n      say(\n        state.files.length\n          ? `Found ${state.files.length} playlist file(s). Click one to open it.` + (tree.truncated ? ' The repository is very large, so GitHub returned a partial list.' : '')\n          : 'No .m3u or .m3u8 files found in that repository.',\n      );\n    } catch (error) {\n      say(`Could not load the repository: ${error.message}`);\n    } finally {\n      $('repoLoad').disabled = false;\n    }\n  }\n\n  const FILE_LIMIT = 400;\n\n  function renderFiles() {\n    const terms = $('plFilter').value.toLowerCase().split(/\\s+/).filter(Boolean);\n    const list = state.files.filter((f) => terms.every((t) => f.path.toLowerCase().includes(t)));\n    $('plList').innerHTML =\n      list.slice(0, FILE_LIMIT).map((f) => {\n        const slash = f.path.lastIndexOf('/');\n        const dir = slash >= 0 ? f.path.slice(0, slash + 1) : '';\n        return `\u003cdiv class=\"pl-row\" data-path=\"${esc(f.path)}\">\u003cspan>\u003cspan class=\"dir\">${esc(dir)}\u003c/span>${esc(f.path.slice(slash + 1))}\u003c/span>\u003cspan class=\"sz\">${Math.max(1, Math.round(f.size / 1024))} KB\u003c/span>\u003c/div>`;\n      }).join('') +\n      (list.length > FILE_LIMIT ? `\u003cdiv class=\"pl-row\">\u003cspan class=\"dir\">...and ${list.length - FILE_LIMIT} more. Use the filter.\u003c/span>\u003c/div>` : '') +\n      (!list.length ? '\u003cdiv class=\"pl-row\">\u003cspan class=\"dir\">No playlist matches.\u003c/span>\u003c/div>' : '');\n  }\n\n  $('plFilter').addEventListener('input', renderFiles);\n\n  $('plList').addEventListener('click', async (ev) => {\n    const row = ev.target.closest('.pl-row[data-path]');\n    if (!row || !state.repo) return;\n    const path = row.dataset.path;\n    const raw = `https://raw.githubusercontent.com/${state.repo.owner}/${state.repo.name}/${encodeURIComponent(state.repo.branch)}/${encPath(path)}`;\n    say(`Opening ${path}...`);\n    try {\n      const response = await timedFetch(raw, 25000, { cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      loadPlaylist(await response.text(), path.split('/').pop(), raw);\n    } catch (error) {\n      say(`Could not open ${path}: ${error.message}`);\n    }\n  });\n\n  /* ============================================================\n   STATION LIST\n   ============================================================ */\n  function loadPlaylist(text, name, rawUrl) {\n    const parsed = parseM3U(text);\n    const stations = parsed.entries.filter((e) => e.url).map((e) => {\n      const a = parseAttrs(e.extinf);\n      let group = a['group-title'] || '';\n      if (!group) {\n        const g = e.extra.find((l) => /^#EXTGRP:/i.test(l));\n        if (g) group = g.slice(g.indexOf(':') + 1).trim();\n      }\n      return { e, title: e.title || e.url, group, country: a['tvg-country'] || '', url: e.url, host: hostOf(e.url) };\n    });\n    if (!stations.length) return say('No streams found in that playlist.');\n\n    stopPlayback();\n    Object.assign(state, { parsed, stations, name, text, rawUrl: rawUrl || '', page: 0 });\n\n    const fill = (sel, label, values) => {\n      sel.textContent = '';\n      const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };\n      add('', `${label}: all`);\n      [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' })).forEach((v) => add(v, v));\n    };\n    fill($('groupSel'), 'Group', stations.map((s) => s.group));\n    fill($('countrySel'), 'Country', stations.map((s) => s.country));\n    $('search').value = '';\n\n    $('plTitle').textContent = `${name} (${stations.length} stations)`;\n    $('rawBtn').disabled = !state.rawUrl;\n    $('stationPanel').classList.remove('hidden');\n    applyFilter(true);\n    say(`${stations.length} stations loaded from ${name}.`);\n    $('stationPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });\n  }\n\n  function applyFilter(resetPage) {\n    const terms = $('search').value.toLowerCase().split(/\\s+/).filter(Boolean);\n    const g = $('groupSel').value;\n    const c = $('countrySel').value;\n    state.visible = state.stations.filter((s) => {\n      if (g && s.group !== g) return false;\n      if (c && s.country !== c) return false;\n      if (terms.length) {\n        const hay = `${s.title} ${s.group} ${s.country} ${s.host}`.toLowerCase();\n        if (!terms.every((t) => hay.includes(t))) return false;\n      }\n      return true;\n    });\n    if (resetPage) state.page = 0;\n    renderTable();\n  }\n\n  const PAGE = 100;\n\n  function renderTable() {\n    const pages = Math.max(1, Math.ceil(state.visible.length / PAGE));\n    state.page = Math.min(Math.max(0, state.page), pages - 1);\n    const start = state.page * PAGE;\n    $('tbody').innerHTML = state.visible.slice(start, start + PAGE).map((s, i) => {\n      const playing = state.now === s;\n      const http = /^http:/i.test(s.url) ? '\u003cspan class=\"tag-http\" title=\"Plain http stream\">http\u003c/span>' : '';\n      return (\n        `\u003ctr data-i=\"${start + i}\"${playing ? ' class=\"playing\"' : ''}>` +\n        `\u003ctd>\u003cbutton class=\"rowbtn white play\" title=\"Play\">${playing ? '&#9632;' : '&#9654;'}\u003c/button>\u003c/td>` +\n        `\u003ctd class=\"nm\">${esc(s.title)}${http}\u003csmall>${esc(s.host)}\u003c/small>\u003c/td>` +\n        `\u003ctd class=\"dim\">${esc(s.group)}\u003c/td>\u003ctd class=\"dim\">${esc(s.country)}\
