u003c/td>` +\n        '\u003ctd>\u003cbutton class=\"rowbtn white copy\" title=\"Copy stream URL\">&#10063;\u003c/button>\u003c/td>\u003c/tr>'\n      );\n    }).join('') || '\u003ctr>\u003ctd>\u003c/td>\u003ctd class=\"dim\">No stations match.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>';\n    $('pageInfo').textContent = `${state.visible.length} stations, page ${state.page + 1} / ${pages}`;\n    $('firstPg').disabled = $('prevPg').disabled = state.page === 0;\n    $('lastPg').disabled = $('nextPg').disabled = state.page >= pages - 1;\n  }\n\n  ['search'].forEach((id) => $(id).addEventListener('input', () => applyFilter(true)));\n  ['groupSel', 'countrySel'].forEach((id) => $(id).addEventListener('change', () => applyFilter(true)));\n  $('firstPg').addEventListener('click', () => { state.page = 0; renderTable(); });\n  $('prevPg').addEventListener('click', () => { state.page--; renderTable(); });\n  $('nextPg').addEventListener('click', () => { state.page++; renderTable(); });\n  $('lastPg').addEventListener('click', () => { state.page = 1e9; renderTable(); });\n\n  async function copy(text) {\n    try {\n      await navigator.clipboard.writeText(text);\n    } catch {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      ta.remove();\n    }\n  }\n\n  $('tbody').addEventListener('click', async (ev) => {\n    const tr = ev.target.closest('tr[data-i]');\n    if (!tr) return;\n    const s = state.visible[Number(tr.dataset.i)];\n    if (!s) return;\n    if (ev.target.closest('button.play')) {\n      if (state.now === s) stopPlayback(); else play(s);\n    } else if (ev.target.closest('button.copy')) {\n      await copy(s.url);\n      $('nowStatus').textContent = `Copied the stream URL of ${s.title}.`;\n    }\n  });\n\n  /* ============================================================\n   PLAYER\n   ============================================================ */\n  const audio = new Audio();\n  audio.preload = 'none';\n  audio.volume = 0.8;\n  let skips = 0;\n\n  const setNow = (title, status) => {\n    $('nowTitle').textContent = title;\n    $('nowStatus').textContent = status;\n  };\n\n  function play(s) {\n    state.now = s;\n    setNow(s.title, window.__pageProtocol === 'https:' && /^http:/i.test(s.url) ? 'Connecting... (an http stream on an https page is usually blocked)' : 'Connecting...');\n    $('playBtn').textContent = 'Stop';\n    audio.src = s.url;\n    const started = audio.play();\n    if (started && started.catch) started.catch(() => { /* the error event reports it */ });\n    showPlaying(s);\n  }\n\n  function showPlaying(s) {\n    const i = state.visible.indexOf(s);\n    if (i >= 0) state.page = Math.floor(i / PAGE);\n    renderTable();\n  }\n\n  function stopPlayback() {\n    state.now = null;\n    audio.pause();\n    audio.removeAttribute('src');\n    audio.load();\n    skips = 0;\n    $('playBtn').textContent = 'Play';\n    setNow('Nothing playing', 'Press play on a station.');\n    if (state.visible.length) renderTable();\n  }\n\n  function step(dir) {\n    if (!state.visible.length) return;\n    const i = state.now ? state.visible.indexOf(state.now) : -1;\n    const next = state.visible[i + dir] || (i === -1 && dir > 0 ? state.visible[0] : null);\n    if (next) play(next);\n  }\n\n  audio.addEventListener('playing', () => { skips = 0; if (state.now) setNow(state.now.title, 'Playing'); });\n  audio.addEventListener('waiting', () => { if (state.now) $('nowStatus').textContent = 'Buffering...'; });\n  audio.addEventListener('ended', () => { if (state.now) $('nowStatus').textContent = 'The stream ended.'; });\n  audio.addEventListener('error', () => {\n    if (!state.now) return;\n    const failed = state.now;\n    if ($('autoSkip').checked && skips \u003c 25 && state.visible.indexOf(failed) \u003c state.visible.length - 1) {\n      skips++;\n      $('nowStatus').textContent = `Could not play \"${failed.title}\", skipping...`;\n      setTimeout(() => { if (state.now === failed) step(1); }, 300);\n    } else {\n      setNow(failed.title, 'Cannot play this stream here (offline, blocked, mixed content or an unsupported format).');\n    }\n  });\n\n  $('playBtn').addEventListener('click', () => {\n    if (state.now) stopPlayback(); else step(1);\n  });\n  $('nextBtn').addEventListener('click', () => step(1));\n  $('prevBtn').addEventListener('click', () => step(-1));\n  $('vol').addEventListener('input', () => { audio.volume = Number($('vol').value); });\n\n  /* ============================================================\n   EXPORT + LOCAL INPUT\n   ============================================================ */\n  function save(text, name) {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: 'audio/x-mpegurl' }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  $('rawBtn').addEventListener('click', async () => {\n    await copy(state.rawUrl);\n    $('nowStatus').textContent = 'Raw playlist URL copied.';\n  });\n  $('dlBtn').addEventListener('click', () => save(state.text, state.name));\n  $('dlViewBtn').addEventListener('click', () => {\n    const lines = [state.parsed.extm3u, ...state.parsed.header];\n    state.visible.forEach((s) => lines.push(...renderEntry(s.e)));\n    save(`${lines.join('\\n')}\\n`, state.name.replace(/(\\.m3u8?)?$/i, '_view$1') || 'view.m3u');\n  });\n\n  $('repoLoad').addEventListener('click', loadRepo);\n  $('repoInput').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') loadRepo(); });\n  $('fileLoad').addEventListener('click', async () => {\n    const file = $('fileInput').files[0];\n    if (!file) return alert('Please choose an M3U file.');\n    loadPlaylist(await file.text(), file.name, '');\n  });\n  $('textLoad').addEventListener('click', () => {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    loadPlaylist(text, 'pasted_streams.m3u', '');\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}
];

  const tabsEl = document.getElementById('tabs');
  const framesEl = document.getElementById('frames');
  const frames = new Map();
  const buttons = new Map();
  let active = null;

  TABS.forEach((tab) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.id = `tab-${tab.id}`;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', 'false');
    button.setAttribute('tabindex', '-1');
    button.title = tab.tip;
    button.textContent = tab.label;
    button.addEventListener('click', () => show(tab.id, true));
    tabsEl.appendChild(button);
    buttons.set(tab.id, button);
  });

  function show(id, updateHash) {
    const tab = TABS.find((t) => t.id === id) || TABS[0];

    if (active === tab.id) return;

    if (!frames.has(tab.id)) {
      const frame = document.createElement('iframe');
      frame.title = tab.label;
      frame.setAttribute('allow', 'clipboard-write; clipboard-read; autoplay');
      frame.srcdoc = tab.html;
      framesEl.appendChild(frame);
      frames.set(tab.id, frame);
    }

    frames.forEach((frame, key) => frame.classList.toggle('on', key === tab.id));
    buttons.forEach((button, key) => {
      const on = key === tab.id;

      button.setAttribute('aria-selected', String(on));
      button.setAttribute('tabindex', on ? '0' : '-1');
    });

    active = tab.id;
    document.title = `${tab.label} - M3U Toolkit`;

    if (updateHash) {
      try {
        history.replaceState(null, '', `#${tab.id}`);
      } catch {
        location.hash = tab.id; /* some browsers refuse replaceState on file:// pages */
      }
    }
  }

  tabsEl.addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;

    const i = TABS.findIndex((t) => t.id === active);
    const next = TABS[(i + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];

    show(next.id, true);
    buttons.get(next.id).focus();
    ev.preventDefault();
  });

  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));

  show(location.hash.slice(1), false);
})();
</script>
