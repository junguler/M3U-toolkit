0px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'] { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 240px; }\n.toolbar select { flex: 0 1 auto; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 68vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; min-width: max-content; }\n.grid th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 2px 4px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid tr.sel td { background: #2c2400; }\n.grid td input[type='text'] { width: 100%; margin: 0; padding: 4px 6px; border-width: 2px; font-size: 0.85em; }\n.grid td.idx { color: var(--muted); font-size: 0.8em; text-align: right; padding-right: 8px; }\n.grid td.acts { white-space: nowrap; }\n.rowbtn { display: inline-flex; width: 30px; height: 28px; margin-right: 4px; padding: 0; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 2px; }\n.pager span { min-width: 110px; text-align: center; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\n/* Station Discovery additions */\n.form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; margin: 6px 0 10px; }\n.form-grid label { display: flex; flex-direction: column; font-size: 0.75em; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }\n.form-grid input, .form-grid select { margin: 3px 0 0; padding: 8px; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--text); }\n.form-grid .check { flex-direction: row; align-items: center; gap: 6px; text-transform: none; font-size: 0.9em; color: var(--text); letter-spacing: 0; }\n@media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }\n.nowbar { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; padding: 6px 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.nowbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.grid td.tags { color: var(--muted); font-size: 0.8em; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.grid td.nm { min-width: 200px; }\n.grid td.nm small { display: block; color: var(--muted); font-size: 0.75em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }\n.grid td.num { text-align: right; white-space: nowrap; color: var(--muted); }\n.grid tr.playing td { background: #10301f; }\n#listOut { display: block; width: 100%; height: 150px; margin: 5px 0 6px; padding: 8px 10px; font-size: 0.85em; resize: vertical; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container wide\">\n\u003ch1>M3U Station Discovery\u003c/h1>\n\n\u003cdiv class=\"form-grid\">\n\u003clabel>Station name\u003cinput type=\"text\" id=\"fName\" placeholder=\"e.g. jazz fm\">\u003c/label>\n\u003clabel>Tag / genre\u003cinput type=\"text\" id=\"fTag\" list=\"tagList\" placeholder=\"e.g. jazz\">\u003c/label>\n\u003clabel>Country\u003cinput type=\"text\" id=\"fCountry\" list=\"countryList\" placeholder=\"e.g. Germany\">\u003c/label>\n\u003clabel>Language\u003cinput type=\"text\" id=\"fLang\" list=\"langList\" placeholder=\"e.g. german\">\u003c/label>\n\u003clabel>Codec\n\u003cselect id=\"fCodec\">\u003coption value=\"\">Any\u003c/option>\u003coption>MP3\u003c/option>\u003coption>AAC\u003c/option>\u003coption>AAC+\u003c/option>\u003coption>OGG\u003c/option>\u003coption>FLAC\u003c/option>\u003c/select>\n\u003c/label>\n\u003clabel>Minimum bitrate (kbps)\u003cinput type=\"number\" id=\"fBitrate\" min=\"0\" max=\"2000\" step=\"16\" placeholder=\"any\">\u003c/label>\n\u003clabel>Order by\n\u003cselect id=\"fOrder\">\n\u003coption value=\"clickcount\">Most listened\u003c/option>\n\u003coption value=\"votes\">Most votes\u003c/option>\n\u003coption value=\"bitrate\">Highest bitrate\u003c/option>\n\u003coption value=\"name\">Name\u003c/option>\n\u003coption value=\"random\">Random\u003c/option>\n\u003c/select>\n\u003c/label>\n\u003clabel>Results per page\n\u003cselect id=\"fLimit\">\u003coption>50\u003c/option>\u003coption selected>100\u003c/option>\u003coption>250\u003c/option>\u003coption>500\u003c/option>\u003c/select>\n\u003c/label>\n\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fBroken\" checked>Hide stations whose last check failed\u003c/label>\n\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"fHttps\">https streams only\u003c/label>\n\u003cdiv>\u003c/div>\n\u003cdiv style=\"display:flex;align-items:flex-end\">\u003cbutton id=\"searchBtn\" class=\"orange wide-btn\">Search\u003c/button>\u003c/div>\n\u003c/div>\n\u003cdatalist id=\"tagList\">\u003c/datalist>\u003cdatalist id=\"countryList\">\u003c/datalist>\u003cdatalist id=\"langList\">\u003c/datalist>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Advanced settings (server)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"serverInput\">Radio Browser server (leave empty to try the public mirrors)\u003c/label>\n\u003cinput type=\"text\" id=\"serverInput\" placeholder=\"https://de1.api.radio-browser.info\">\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv class=\"nowbar\">\u003cspan id=\"nowText\">Preview: press the play button on a station.\u003c/span>\u003cbutton id=\"stopBtn\" class=\"mini red\">Stop\u003c/button>\u003c/div>\n\n\u003cdiv class=\"toolbar\">\n\u003cbutton id=\"selAllBtn\" class=\"mini white\">Select all\u003c/button>\n\u003cbutton id=\"selNoneBtn\" class=\"mini white\">Select none\u003c/button>\n\u003cbutton id=\"addBtn\" class=\"mini green\">Add selected to list\u003c/button>\n\u003cbutton id=\"moreBtn\" class=\"mini violet hidden\">Load more\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003cth>Station\u003c/th>\u003cth>Country\u003c/th>\u003cth>Codec\u003c/th>\u003cth>Votes\u003c/th>\u003cth>Tags\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\" open>\n\u003csummary>Playlist options\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"oGroup\">group-title\u003c/label>\n\u003cselect id=\"oGroup\">\n\u003coption value=\"tag\">First tag of the station\u003c/option>\n\u003coption value=\"country\">Country\u003c/option>\n\u003coption value=\"fixed\">Fixed text\u003c/option>\n\u003coption value=\"none\">None\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cinput type=\"text\" id=\"oFixed\" placeholder=\"Fixed group text\" value=\"Discovered\">\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oResolved\" checked>\u003clabel for=\"oResolved\">Use the resolved stream URL (url_resolved)\u003c/label>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oLogo\" checked>\u003clabel for=\"oLogo\">Add tvg-logo (station favicon)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oCountry\" checked>\u003clabel for=\"oCountry\">Add tvg-country\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oLang\" checked>\u003clabel for=\"oLang\">Add tvg-language\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"oId\">\u003clabel for=\"oId\">Add tvg-id (Radio Browser station id)\u003c/label>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"existingFile\">Append to an existing playlist (optional)\u003c/label>\n\u003cinput type=\"file\" id=\"existingFile\" accept=\".m3u,.m3u8,.txt\">\n\u003c/div>\n\u003cdiv class=\"btn-row\">\u003cbutton id=\"existingClear\" class=\"mini white\">Forget existing\u003c/button>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"list-head\" style=\"display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\">\n\u003cspan id=\"listTitle\">Your list (0)\u003c/span>\n\u003cbutton id=\"listClear\" class=\"mini red\">Clear list\u003c/button>\n\u003c/div>\n\u003ctextarea id=\"listOut\" readonly placeholder=\"Stations you add appear here as M3U...\">\u003c/textarea>\n\u003cp id=\"listNote\" style=\"min-height:1.2em;margin:4px 0 6px;font-size:.85em;color:var(--muted)\">\u003c/p>\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"downloadBtn\" class=\"green wide-btn\" disabled>Download Playlist\u003c/button>\n\u003cbutton id=\"copyBtn\" class=\"yellow wide-btn\" disabled>Copy to clipboard\u003c/button>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n\n  /* ============================================================\n   RADIO BROWSER API (free, no key, CORS enabled)\n   ============================================================ */\n  const MIRRORS = [\n    'https://de1.api.radio-browser.info',\n    'https://de2.api.radio-browser.info',\n    'https://fi1.api.radio-browser.info',\n    'https://nl1.api.radio-browser.info',\n    'https://all.api.radio-browser.info',\n  ];\n\n  const state = { base: '', results: [], selected: new Set(), query: null, basket: new Map(), existing: '', existingName: '', total: 0 };\n\n  async function api(path, params) {\n    const custom = $('serverInput').value.trim().replace(/\\/+$/, '');\n    const bases = custom ? [custom] : state.base ? [state.base, ...MIRRORS.filter((b) => b !== state.base)] : MIRRORS;\n    const qs = params ? `?${params}` : '';\n    let lastError = new Error('no server');\n\n    for (const base of bases) {\n      const controller = new AbortController();\n      const timer = setTimeout(() => controller.abort(), 9000);\n      try {\n        const response = await fetch(`${base}${path}${qs}`, { signal: controller.signal });\n        if (!response.ok) throw new Error(`HTTP ${response.status}`);\n        const data = await response.json();\n        state.base = base;\n        return data;\n      } catch (error) {\n        lastError = error;\n      } finally {\n        clearTimeout(timer);\n      }\n    }\n    throw lastError;\n  }\n\n  /* autocomplete lists: tags, countries, languages (failures are silent) */\n  const lists = { countries: new Set(), languages: new Set() };\n\n  async function loadLists() {\n    const fill = (id, names) => {\n      const dl = $(id);\n      dl.textContent = '';\n      names.forEach((n) => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });\n    };\n    try {\n      const tags = await api('/json/tags', 'order=stationcount&reverse=true&hidebroken=true&limit=400');\n      fill('tagList', tags.map((t) => t.name).filter((n) => n && n.length \u003c 30));\n      const countries = await api('/json/countries', 'order=stationcount&reverse=true&hidebroken=true');\n      countries.forEach((c) => lists.countries.add(c.name.toLowerCase()));\n      fill('countryList', countries.map((c) => c.name).filter(Boolean));\n      const langs = await api('/json/languages', 'order=stationcount&reverse=true&hidebroken=true&limit=250');\n      langs.forEach((l) => lists.languages.add(l.name.toLowerCase()));\n      fill('langList', langs.map((l) => l.name).filter(Boolean));\n    } catch {\n      /* the search will explain a connection problem */\n    }\n  }\n\n  /* ============================================================\n   SEARCH\n   ============================================================ */\n  function buildParams() {\n    const p = new URLSearchParams();\n    const name = $('fName').value.trim();\n    const tag = $('fTag').value.trim();\n    const country = $('fCountry').value.trim();\n    const lang = $('fLang').value.trim();\n    const codec = $('fCodec').value;\n    const bitrate = parseInt($('fBitrate').value, 10);\n    const order = $('fOrder').value;\n\n    if (name) p.set('name', name);\n    if (tag) p.set('tag', tag);\n    if (country) {\n      p.set('country', country);\n      if (lists.countries.has(country.toLowerCase())) p.set('countryExact', 'true');\n    }\n    if (lang) {\n      p.set('language', lang);\n      if (lists.languages.has(lang.toLowerCase())) p.set('languageExact', 'true');\n    }\n    if (codec) p.set('codec', codec);\n    if (bitrate > 0) p.set('bitrateMin', String(bitrate));\n    p.set('order', order);\n    p.set('reverse', order === 'name' || order === 'random' ? 'false' : 'true');\n    p.set('hidebroken', $('fBroken').checked ? 'true' : 'false');\n    if ($('fHttps').checked) p.set('is_https', 'true');\n    p.set('limit', $('fLimit').value);\n    return p;\n  }\n\n  async function search(more) {\n    if (!more) {\n      state.query = buildParams();\n      state.results = [];\n      state.selected.clear();\n      stopPlayback();\n    }\n    const p = new URLSearchParams(state.query);\n    p.set('offset', String(state.results.length));\n\n    $('searchBtn').disabled = true;\n    $('moreBtn').disabled = true;\n    say('Searching...');\n\n    try {\n      const data = await api('/json/stations/search', p);\n      const known = new Set(state.results.map((s) => s.stationuuid));\n      data.forEach((s) => { if (!known.has(s.stationuuid)) state.results.push(s); });\n      const limit = Number(state.query.get('limit'));\n      $('moreBtn').classList.toggle('hidden', data.length \u003c limit);\n      renderResults();\n      say(\n        state.results.length\n          ? `${state.results.length} station(s) loaded from ${state.base.replace('https://', '')}. Tick the ones you want and press \"Add selected to list\".`\n          : 'No stations matched. Try fewer filters.',\n      );\n    } catch (error) {\n      say(`Could not reach a Radio Browser server (${error.message}). Check your connection, or enter another server under Advanced settings.`);\n    } finally {\n      $('searchBtn').disabled = false;\n      $('moreBtn').disabled = false;\n    }\n  }\n\n  function renderResults() {\n    $('tbody').innerHTML = state.results\n      .map((s, i) => {\n        const url = s.url_resolved || s.url || '';\n        const codec = [s.codec, s.bitrate ? `${s.bitrate}k` : ''].filter(Boolean).join(' ');\n        const inList = state.basket.has(normUrl(url));\n        return (\n          `\u003ctr data-i=\"${i}\"${state.playing === i ? ' class=\"playing\"' : ''}>` +\n          `\u003ctd>\u003cinput type=\"checkbox\" class=\"pick\"${state.selected.has(i) ? ' checked' : ''}>\u003c/td>` +\n          `\u003ctd>\u003cbutton class=\"rowbtn white play\" title=\"Preview\">${state.playing === i ? '&#9632;' : '&#9654;'}\u003c/button>\u003c/td>` +\n          `\u003ctd class=\"nm\">${esc(s.name || '(no name)')}${inList ? ' \u003csmall style=\"color:var(--green)\">in your list\u003c/small>' : `\u003csmall>${esc(url)}\u003c/small>`}\u003c/td>` +\n          `\u003ctd>${esc(s.countrycode || s.country || '')}\u003c/td>\u003ctd class=\"num\">${esc(codec)}\u003c/td>\u003ctd class=\"num\">${esc(s.votes)}\u003c/td>` +\n          `\u003ctd class=\"tags\" title=\"${esc(s.tags)}\">${esc(s.tags)}\u003c/td>\u003c/tr>`\n        );\n      })\n      .join('');\n  }\n\n  $('tbody').addEventListener('change', (ev) => {\n    if (!ev.target.classList.contains('pick')) return;\n    const i = Number(ev.target.closest('tr').dataset.i);\n    if (ev.target.checked) state.selected.add(i); else state.selected.delete(i);\n  });\n\n  $('tbody').addEventListener('click', (ev) => {\n    const btn = ev.target.closest('button.play');\n    if (btn) togglePlayback(Number(btn.closest('tr').dataset.i));\n  });\n\n  $('selAllBtn').addEventListener('click', () => { state.results.forEach((_, i) => state.selected.add(i)); renderResults(); });\n  $('selNoneBtn').addEventListener('click', () => { state.selected.clear(); renderResults(); });\n  $('searchBtn').addEventListener('click', () => search(false));\n  $('moreBtn').addEventListener('click', () => search(true));\n  ['fName', 'fTag', 'fCountry', 'fLang', 'fBitrate'].forEach((id) =>\n    $(id).addEventListener('keydown', (ev) => { if (ev.key === 'Enter') search(false); }),\n  );\n\n  /* ============================================================\n   PREVIEW PLAYER\n   ============================================================ */\n  let audio = null;\n  state.playing = -1;\n\n  function setNow(text) { $('nowText').textContent = text; }\n\n  function stopPlayback() {\n    if (audio) {\n      audio.removeAttribute('src');\n      audio.load();\n      audio = null;\n    }\n    const was = state.playing;\n    state.playing = -1;\n    setNow('Preview: press the play button on a station.');\n    if (was !== -1) renderResults();\n  }\n\n  function togglePlayback(i) {\n    if (state.playing === i) return stopPlayback();\n    stopPlayback();\n\n    const s = state.results[i];\n    if (!s) return;\n    const url = s.url_resolved || s.url;\n    if (!url) return setNow('This station has no stream URL.');\n\n    state.playing = i;\n    audio = new Audio();\n    const mine = audio;\n    setNow(`Connecting: ${s.name}`);\n    if (window.__pageProtocol === 'https:' && /^http:/i.test(url)) {\n      setNow(`Connecting: ${s.name} (this page is https, so the browser may block an http stream)`);\n    }\n    mine.addEventListener('playing', () => { if (audio === mine) setNow(`Playing: ${s.name}`); });\n    mine.addEventListener('error', () => {\n      if (audio !== mine) return;\n      setNow(`Cannot play \"${s.name}\" in the browser (blocked, offline or unsupported format).`);\n      audio = null;\n      state.playing = -1;\n      renderResults();\n    });\n    mine.src = url;\n    const started = mine.play();\n    if (started && started.catch) started.catch(() => { /* the error event reports it */ });\n    renderResults();\n\n    /* the directory asks players to register a click */\n    if (s.stationuuid && state.base) fetch(`${state.base}/json/url/${encodeURIComponent(s.stationuuid)}`).catch(() => {});\n  }\n\n  $('stopBtn').addEventListener('click', stopPlayback);\n\n  /* ============================================================\n   YOUR LIST -> M3U\n   ============================================================ */\n  const normUrl = (u) => String(u || '').trim().toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/;?$/, '');\n  const attr = (v) => String(v == null ? '' : v).replace(/[\\r\\n]+/g, ' ').replace(/\"/g, \"'\").trim();\n  const cleanName = (s) => String(s || '').replace(/\\s+/g, ' ').replace(/,/g, ' ').trim() || 'Unnamed station';\n\n  function groupFor(s, o) {\n    if (o.group === 'tag') return (s.tags || '').split(',')[0].trim();\n    if (o.group === 'country') return s.country || '';\n    if (o.group === 'fixed') return o.fixed;\n    return '';\n  }\n\n  function extinfFor(s, o) {\n    const parts = [];\n    const add = (k, v) => { const a = attr(v); if (a) parts.push(` ${k}=\"${a}\"`); };\n    if (o.id) add('tvg-id', s.stationuuid);\n    if (o.logo) add('tvg-logo', /^https?:\\/\\//i.test(s.favicon || '') ? s.favicon : '');\n    if (o.country) add('tvg-country', s.countrycode);\n    if (o.lang) add('tvg-language', s.language);\n    add('group-title', groupFor(s, o));\n    return `#EXTINF:-1${parts.join('')},${cleanName(s.name)}`;\n  }\n\n  function options() {\n    return {\n      group: $('oGroup').value, fixed: $('oFixed').value.trim(), resolved: $('oResolved').checked,\n      logo: $('oLogo').checked, country: $('oCountry').checked, lang: $('oLang').checked, id: $('oId').checked,\n    };\n  }\n\n  function urlOf(s, o) {\n    return (o.resolved ? s.url_resolved || s.url : s.url || s.url_resolved) || '';\n  }\n\n  function buildList() {\n    const o = options();\n    const known = new Set();\n    let existing = state.existing.replace(/^\\uFEFF/, '').replace(/\\s+$/, '');\n    existing.split(/\\r?\\n/).forEach((line) => {\n      const t = line.trim();\n      if (t && !t.startsWith('#')) known.add(normUrl(t));\n    });\n\n    const lines = [];\n    let skipped = 0;\n    state.basket.forEach((s) => {\n      const url = urlOf(s, o);\n      if (!url) return;\n      if (known.has(normUrl(url))) { skipped++; return; }\n      lines.push(extinfFor(s, o), url);\n    });\n\n    if (!existing && !lines.length) return { text: '', added: 0, skipped };\n    if (existing && !/^#EXTM3U/i.test(existing)) existing = `#EXTM3U\\n${existing}`;\n    const text = (existing ? `${existing}\\n` : '#EXTM3U\\n') + lines.join('\\n');\n    return { text: `${text.replace(/\\n+$/, '')}\\n`, added: lines.length / 2, skipped };\n  }\n\n  function refreshList() {\n    const built = buildList();\n    $('listOut').value = built.text;\n    $('listTitle').textContent = `Your list (${state.basket.size})`;\n    $('downloadBtn').disabled = $('copyBtn').disabled = !built.text;\n    $('listNote').textContent =\n      (state.existingName ? `Appending to ${state.existingName}. ` : '') +\n      (built.skipped ? `${built.skipped} station(s) skipped because the URL is already in that playlist. ` : '') +\n      (built.text ? `${built.added} new station(s) in the output.` : '');\n  }\n\n  $('addBtn').addEventListener('click', () => {\n    if (!state.selected.size) return alert('Tick at least one station first.');\n    const o = options();\n    let added = 0;\n    state.selected.forEach((i) => {\n      const s = state.results[i];\n      const url = s && urlOf(s, o);\n      if (!url) return;\n      const key = normUrl(url);\n      if (!state.basket.has(key)) { state.basket.set(key, s); added++; }\n    });\n    state.selected.clear();\n    renderResults();\n    refreshList();\n    say(`Added ${added} station(s) to your list.`);\n  });\n\n  $('listClear').addEventListener('click', () => { state.basket.clear(); renderResults(); refreshList(); });\n\n  ['oGroup', 'oFixed', 'oResolved', 'oLogo', 'oCountry', 'oLang', 'oId'].forEach((id) =>\n    $(id).addEventListener(id === 'oFixed' ? 'input' : 'change', refreshList),\n  );\n\n  $('existingFile').addEventListener('change', async () => {\n    const file = $('existingFile').files[0];\n    if (!file) return;\n    state.existing = await file.text();\n    state.existingName = file.name;\n    refreshList();\n  });\n\n  $('existingClear').addEventListener('click', () => {\n    state.existing = '';\n    state.existingName = '';\n    $('existingFile').value = '';\n    refreshList();\n  });\n\n  $('downloadBtn').addEventListener('click', () => {\n    const text = buildList().text;\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: 'audio/x-mpegurl' }));\n    a.download = state.existingName ? state.existingName.replace(/(\\.m3u8?)?$/i, '_discovered$1') : 'discovered_stations.m3u';\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  });\n\n  $('copyBtn').addEventListener('click', async () => {\n    const text = buildList().text;\n    try {\n      await navigator.clipboard.writeText(text);\n    } catch {\n      $('listOut').select();\n      document.execCommand('copy');\n    }\n    $('listNote').textContent = 'Copied to the clipboard.';\n  });\n\n  loadLists();\n  refreshList();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"https",label:"Upgrade to https",tip:"Swap http streams for working https versions",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U HTTPS Upgrader\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody {\n  margin: 0;\n  padding: 24px 10px 60px;\n  font-family: var(--mono);\n  font-size: 14px;\n  background: var(--concrete);\n  color: var(--text);\n}\nh1 {\n  margin: -20px -20px 18px;\n  padding: 8px 14px;\n  background: var(--yellow);\n  color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow);\n  font-size: 1.9em;\n  font-weight: 900;\n  line-height: 1.25;\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n  text-align: left;\n}\n.container {\n  position: relative;\n  width: 660px;\n  max-width: 100%;\n  margin: 0 auto;\n  padding: 20px;\n  background: var(--panel);\n  border: var(--bw) solid var(--line);\n  box-shadow: 10px 10px 0 var(--ink);\n  text-align: left;\n}\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1;\n  min-width: 0;\n  margin: 5px 0;\n  padding: 10px;\n  border: var(--bw) solid var(--line);\n  border-radius: 0;\n  background: var(--ink);\n  color: var(--text);\n  font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 3px solid var(--ink);\n  border-radius: 0;\n  background: var(--orange);\n  color: var(--ink);\n  font: inherit;\n  font-weight: 900;\n  -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\n/* Buttons: one colour per role, set through --c */\nbutton {\n  --c: var(--orange);\n  flex: none;\n  width: 130px;\n  height: 48px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 0 6px;\n  border: var(--bw) solid var(--ink);\n  border-radius: 0;\n  background: var(--c);\n  color: var(--ink);\n  font: inherit;\n  font-size: 0.95em;\n  font-weight: 900;\n  -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em;\n  line-height: 1.15;\n  text-align: center;\n  text-transform: uppercase;\n  box-shadow: 3px 3px 0 var(--text);\n  cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n\n#fileCheckButton, #fileButton { --c: var(--orange); }\n#urlCheckButton, #urlButton { --c: var(--pink); }\n#textCheckButton, #textButton { --c: var(--violet); }\n.pause-button { display: none; --c: var(--blue); }\n.cancel-button { display: none; --c: var(--red); }\n\n#downloadButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 10px auto;\n  --c: var(--green);\n}\n#downloadReportButton, #downloadDeadButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 0 auto 10px auto;\n  --c: var(--yellow);\n}\n#viewImagesButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 0 auto 10px auto;\n  --c: var(--line);\n}\n.download-row { display: flex; flex-direction: column; align-items: center; gap: 5px; }\n\n/* Output area */\n.output-wrapper {\n  position: relative;\n  width: 100%;\n  height: 110px;\n  min-width: 0;\n  min-height: 80px;\n  max-width: 100%;\n  max-height: 80vh;\n  margin: 5px 0 10px 0;\n  border: var(--bw) solid var(--line);\n  background: var(--ink);\n  resize: vertical;\n  overflow: auto;\n}\n.output-wrapper textarea#output {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  min-width: 100%;\n  min-height: 100%;\n  margin: 0;\n  padding: 0 10px;\n  border: none;\n  background: transparent;\n  color: var(--text);\n  font-size: 0.85em;\n  resize: none;\n  overflow: auto;\n  display: block;\n}\n#summaryLine {\n  min-height: 1em;\n  margin: 5px 0 10px 0;\n  font-size: 0.85em;\n  color: var(--muted);\n  text-align: left;\n}\n\n/* Advanced settings panel */\n.advanced-settings {\n  margin: 5px 0 10px 0;\n  border: var(--bw) solid var(--line);\n  background: var(--ink);\n  text-align: left;\n}\n.advanced-settings summary {\n  padding: 10px;\n  cursor: pointer;\n  user-select: none;\n  font-weight: 800;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n.advanced-settings summary:hover { background: #222222; }\n.advanced-settings .settings-grid {\n  padding: 10px;\n  border-top: var(--bw) solid var(--line);\n  background: var(--panel);\n}\n.advanced-settings .settings-grid { display: flex; align-items: center; gap: 25px; }\n.settings-column { display: flex; }\n.numeric-column { gap: 10px; }\n.checkbox-column { flex-direction: column; gap: 8px; }\n.advanced-settings .setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.advanced-settings .setting-item.checkbox-item { flex-direction: row; align-items: center; gap: 6px; }\n.advanced-settings input[type='number'] { width: 80px; flex-grow: 0; margin: 3px 0 0 0; padding: 6px; }\n.advanced-settings input[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.output-wrapper p#currentChecking {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  min-width: 100%;\n  min-height: 100%;\n  margin: 0;\n  padding: 10px;\n  border: none;\n  background: var(--ink);\n  text-align: left;\n  white-space: normal;\n  overflow: hidden;\n  display: none;\n}\n.output-wrapper p#currentChecking .checking-line {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  max-width: 100%;\n}\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n  .settings .input-group { flex-wrap: nowrap; }\n  .settings .input-group > select { flex: 1 1 auto; }\n}\n\n/* HTTPS Upgrader additions */\n.advanced-settings .settings-grid { flex-wrap: wrap; }\n#downloadHttpsButton { display: none; width: 260px; height: 48px; margin: 0 auto 10px auto; --c: var(--green); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n\u003ch1>M3U HTTPS Upgrader\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8\">\n\u003cbutton id=\"fileCheckButton\">Upgrade local file\u003c/button>\n\u003cbutton id=\"filePauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"fileCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlCheckButton\">Upgrade Online Link\u003c/button>\n\u003cbutton id=\"urlPauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"urlCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textCheckButton\">Upgrade Pasted streams\u003c/button>\n\u003cbutton id=\"textPauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"textCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Advanced settings (concurrency, timeout, https candidates)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-column numeric-column\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"concurrencyInput\">Concurrency\u003c/label>\n\u003cinput type=\"number\" id=\"concurrencyInput\" min=\"1\" max=\"50\" value=\"8\">\n\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"timeoutInput\">Timeout (ms)\u003c/label>\n\u003cinput type=\"number\" id=\"timeoutInput\" min=\"1000\" max=\"30000\" step=\"500\" value=\"7000\">\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-column checkbox-column\">\n\u003cdiv class=\"setting-item checkbox-item\">\n\u003cinput type=\"checkbox\" id=\"try443Checkbox\" checked>\n\u003clabel for=\"try443Checkbox\">Also try port 443 when the stream uses a custom port\u003c/label>\n\u003c/div>\n\u003cdiv class=\"setting-item checkbox-item\">\n\u003cinput type=\"checkbox\" id=\"htmlCheckbox\" checked>\n\u003clabel for=\"htmlCheckbox\">Reject https answers that are web pages, not streams\u003c/label>\n\u003c/div>\n\u003cdiv class=\"setting-item checkbox-item\">\n\u003cinput type=\"checkbox\" id=\"opaqueCheckbox\" checked>\n\u003clabel for=\"opaqueCheckbox\">Accept hls/pls/asx links that answer but cannot be read (unverified)\u003c/label>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"output-wrapper\">\n\u003ctextarea id=\"output\" rows=\"10\" readonly>\u003c/textarea>\n\u003cp id=\"currentChecking\">\u003c/p>\n\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv class=\"download-row\">\n\u003cbutton id=\"downloadButton\">Download Upgraded Playlist\u003c/button>\n\u003cbutton id=\"downloadHttpsButton\">Download HTTPS-only Playlist\u003c/button>\n\u003cbutton id=\"downloadReportButton\">Download Upgrade Report\u003c/button>\n\u003c/div>\n\u003ca id=\"downloadLink\" style=\"display:none\">\u003c/a>\n\u003ca id=\"downloadHttpsLink\" style=\"display:none\">\u003c/a>\n\u003ca id=\"downloadReportLink\" style=\"display:none\">\u003c/a>\n\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  /* ============================================================\n   SHARED BASE\n   Identical in M3U-link-checker, M3U-Metadata-embedder and\n   m3u-logo-embedder. A tool only has to provide:\n     LOCKED_INPUT_IDS, resetOutput(), processLinks(text, type, sourceName)\n   ============================================================ */\n\n  const $ = (id) => document.getElementById(id);\n  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\n  /* one run at a time: the other start buttons are disabled while it is going */\n  const run = { cancelled: false, paused: false };\n\n  /* AbortControllers of every request that is currently in flight */\n  const inflight = new Set();\n\n  const progress = { done: 0, total: 0 };\n\n  function beginRun() {\n    run.cancelled = false;\n    run.paused = false;\n  }\n\n  /*\n   * Starts a tracked request with a timeout. Call finish() when done:\n   * it also aborts, which closes a response body that was not read to\n   * the end (a live radio stream would otherwise keep downloading).\n   */\n  function startRequest(timeoutMs) {\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), timeoutMs);\n\n    inflight.add(controller);\n\n    return {\n      signal: controller.signal,\n      finish() {\n        clearTimeout(timer);\n        inflight.delete(controller);\n        controller.abort();\n      },\n    };\n  }\n\n  async function waitWhilePaused() {\n    while (run.paused && !run.cancelled) {\n      await sleep(200);\n    }\n  }\n\n  /* runs worker(item) for every item, at most `concurrency` at a time */\n  async function runPool(items, concurrency, worker) {\n    const active = new Set();\n\n    for (const item of items) {\n      if (run.cancelled) {\n        break;\n      }\n\n      const task = (async () => {\n        try {\n          await worker(item);\n        } catch (error) {\n          console.error(error);\n        } finally {\n          active.delete(task);\n        }\n      })();\n\n      active.add(task);\n\n      if (active.size >= concurrency) {\n        await Promise.race(active);\n      }\n    }\n\n    await Promise.allSettled(active);\n  }\n\n  /* ---------------- settings ---------------- */\n\n  /* default, min and max come from the input element itself */\n  function readNumber(id) {\n    const el = $(id);\n    const n = parseInt(el.value, 10);\n    const value = Number.isFinite(n) ? n : Number(el.defaultValue);\n\n    return Math.min(Number(el.max), Math.max(Number(el.min), value));\n  }\n\n  /* ---------------- UI state ---------------- */\n\n  function setCurrentChecking(message) {\n    const el = $('currentChecking');\n\n    el.textContent = '';\n\n    String(message)\n      .split('\\n')\n      .forEach((line) => {\n        const lineEl = document.createElement('div');\n\n        lineEl.className = 'checking-line';\n        lineEl.textContent = line;\n        lineEl.title = line;\n\n        el.appendChild(lineEl);\n      });\n  }\n\n  function setDisplayStates(checkingInProgress) {\n    $('output').style.display = checkingInProgress ? 'none' : 'block';\n    $('currentChecking').style.display = checkingInProgress ? 'block' : 'none';\n  }\n\n  function toggleButtons(type, checking) {\n    $(`${type}CheckButton`).style.display = checking ? 'none' : 'flex';\n    $(`${type}CancelButton`).style.display = checking ? 'flex' : 'none';\n\n    const pauseButton = $(`${type}PauseButton`);\n\n    pauseButton.style.display = checking ? 'flex' : 'none';\n\n    if (checking) {\n      pauseButton.textContent = 'Pause';\n    }\n\n    setDisplayStates(checking);\n\n    ['file', 'url', 'text']\n      .filter((t) => t !== type)\n      .forEach((other) => {\n        $(`${other}CheckButton`).disabled = checking;\n      });\n\n    LOCKED_INPUT_IDS.forEach((id) => {\n      $(id).disabled = checking;\n    });\n  }\n\n  function showProgress(heading, title, url, summary) {\n    progress.done++;\n\n    setCurrentChecking(\n      `${heading} ${progress.done} of ${progress.total}:` +\n        (title ? `\\n${title}` : '') +\n        `\\n${url}`,\n    );\n\n    $('summaryLine').textContent = summary(progress.done, progress.total);\n  }\n\n  /* ---------------- downloads ---------------- */\n\n  function hideDownload(buttonId) {\n    $(buttonId).style.display = 'none';\n  }\n\n  /* puts `text` behind a hidden \u003ca> and shows its button; frees the previous blob */\n  function setDownload(buttonId, linkId, text, mime, filename) {\n    const link = $(linkId);\n\n    if (link.href.startsWith('blob:')) {\n      URL.revokeObjectURL(link.href);\n    }\n\n    link.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    link.download = filename;\n\n    $(buttonId).style.display = 'block';\n  }\n\n  function clickLink(linkId) {\n    $(linkId).click();\n  }\n\n  /* ---------------- file names ---------------- */\n\n  function sourceNameFromUrl(input) {\n    try {\n      const last = new URL(input).pathname.split('/').pop();\n\n      return (last && decodeURIComponent(last)) || 'playlist.m3u';\n    } catch {\n      return 'playlist.m3u';\n    }\n  }\n\n  /* \"my list.m3u8\" + \"_checked\" -> \"my list_checked.m3u8\"; anything else gets .m3u */\n  function outputName(sourceName, suffix) {\n    const match = /\\.(m3u8?)$/i.exec(sourceName);\n    const stem = match ? sourceName.slice(0, -match[0].length) : sourceName;\n\n    return `${stem}${suffix}.${match ? match[1].toLowerCase() : 'm3u'}`;\n  }\n\n  function reportName(sourceName, suffix, reportSuffix) {\n    return outputName(sourceName, suffix).replace(/\\.m3u8?$/i, '') + reportSuffix;\n  }\n\n  /* ============================================================\n   M3U PARSING\n   An entry is everything that belongs to one stream: its #EXTINF\n   line, any extra #-lines (#EXTGRP, #EXTVLCOPT...) and the URL.\n   ============================================================ */\n\n  /* split at the first comma that is not inside quotes */\n  function splitExtinf(line) {\n    let inQuotes = false;\n\n    for (let i = 0; i \u003c line.length; i++) {\n      const ch = line[i];\n\n      if (ch === '\"') {\n        inQuotes = !inQuotes;\n      } else if (ch === ',' && !inQuotes) {\n        return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n      }\n    }\n\n    return { prefix: line, title: '' };\n  }\n\n  const isHttpUrl = (s) => /^https?:\\/\\//i.test(s || '');\n\n  function parseM3U(text) {\n    const lines = text\n      .replace(/^\\uFEFF/, '')\n      .split(/\\r?\\n/)\n      .map((l) => l.trim());\n\n    let extm3u = '#EXTM3U';\n    let sawEntryOrHeader = false;\n\n    const header = [];\n    const entries = [];\n\n    let pendingExtinf = null;\n    let pendingExtra = [];\n\n    const flush = (url) => {\n      entries.push({ extinf: pendingExtinf, extra: pendingExtra, url });\n\n      pendingExtinf = null;\n      pendingExtra = [];\n    };\n\n    for (const line of lines) {\n      if (line === '') {\n        continue;\n      }\n\n      if (/^#EXTM3U/i.test(line)) {\n        /* keep attributes such as url-tvg=\"...\" from the first header line */\n        if (!sawEntryOrHeader) {\n          extm3u = line;\n        }\n\n        continue;\n      }\n\n      sawEntryOrHeader = true;\n\n      if (/^#EXTINF/i.test(line)) {\n        if (pendingExtinf) {\n          flush(null); /* EXTINF without a URL: keep it, do not lose it */\n        }\n\n        pendingExtinf = line;\n\n        continue;\n      }\n\n      if (line.startsWith('#')) {\n        if (!entries.length && !pendingExtinf) {\n          header.push(line);\n        } else {\n          pendingExtra.push(line);\n        }\n\n        continue;\n      }\n\n      flush(line);\n    }\n\n    if (pendingExtinf) {\n      flush(null);\n    }\n\n    entries.forEach((entry) => {\n      entry.title = entry.extinf ? splitExtinf(entry.extinf).title : '';\n    });\n\n    return { extm3u, header, entries };\n  }\n\n  /* the lines of one entry, optionally with a replacement #EXTINF */\n  function renderEntry(entry, extinfOverride) {\n    const out = [];\n\n    if (entry.extinf) {\n      out.push(extinfOverride || entry.extinf);\n    }\n\n    out.push(...entry.extra);\n\n    if (entry.url) {\n      out.push(entry.url);\n    }\n\n    return out;\n  }\n\n  /* ============================================================\n   ONLINE PLAYLIST FETCH\n   ============================================================ */\n\n  /* github.com/.../raw/... redirects without CORS headers; go straight to raw.githubusercontent.com */\n  function normalizeOnlineM3UUrl(inputUrl) {\n    let url;\n\n    try {\n      url = new URL(inputUrl);\n    } catch {\n      throw new Error('Invalid URL.');\n    }\n\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') {\n      throw new Error('Only HTTP and HTTPS URLs are supported.');\n    }\n\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n\n      if (parts.length >= 5 && parts[2].toLowerCase() === 'raw') {\n        const [owner, repo, ...rest] = parts.filter((_, i) => i !== 2);\n\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n\n    return url.href;\n  }\n\n  const looksLikeM3U = (text) =>\n    /^\\s*#EXT(M3U|INF)/i.test(text) || /^\\s*[a-z][a-z0-9+.-]*:\\/\\//im.test(text);\n\n  async function fetchOnlineM3U(inputUrl, signal) {\n    const normalized = normalizeOnlineM3UUrl(inputUrl);\n    const urlsToTry = normalized === inputUrl ? [inputUrl] : [normalized, inputUrl];\n\n    let lastError = null;\n\n    for (const url of urlsToTry) {\n      try {\n        const response = await fetch(url, { signal, cache: 'no-store', redirect: 'follow' });\n\n        if (!response.ok) {\n          throw new Error(`HTTP ${response.status} ${response.statusText}`);\n        }\n\n        const text = await response.text();\n\n        if (!text.trim()) {\n          throw new Error('The fetched playlist is empty.');\n        }\n\n        if (!looksLikeM3U(text)) {\n          throw new Error('The fetched content does not appear to be an M3U playlist.');\n        }\n\n        return text;\n      } catch (error) {\n        if (error.name === 'AbortError') {\n          throw error;\n        }\n\n        lastError = error;\n      }\n    }\n\n    throw new Error(\n      `Unable to fetch the playlist. ${lastError.message} ` +\n        'The remote server may block browser CORS requests.',\n    );\n  }\n\n  /* ============================================================\n   START BUTTONS, PAUSE, CANCEL\n   ============================================================ */\n\n  async function startFile() {\n    const file = $('fileInput').files[0];\n\n    if (!file) {\n      return alert('Please upload an M3U file.');\n    }\n\n    await processLinks(await file.text(), 'file', file.name);\n  }\n\n  async function startUrl() {\n    const input = $('urlInput').value.trim();\n\n    if (!input) {\n      return alert('Please enter an online M3U URL.');\n    }\n\n    let normalized;\n\n    try {\n      normalized = normalizeOnlineM3UUrl(input);\n    } catch (error) {\n      return alert(`Error fetching online M3U file: ${error.message}`);\n    }\n\n    beginRun();\n    toggleButtons('url', true); /* shows Cancel while the download is running */\n\n    setCurrentChecking(\n      normalized !== input\n        ? `Fetching GitHub raw playlist...\\n${normalized}`\n        : 'Fetching online M3U file...',\n    );\n\n    const controller = new AbortController();\n\n    inflight.add(controller);\n\n    let text;\n\n    try {\n      text = await fetchOnlineM3U(input, controller.signal);\n    } catch (error) {\n      toggleButtons('url', false);\n      resetOutput();\n\n      if (error.name === 'AbortError') {\n        $('summaryLine').textContent = 'Online M3U fetch cancelled.';\n      } else {\n        $('summaryLine').textContent = `Error fetching online M3U file: ${error.message}`;\n        alert(`Error fetching online M3U file: ${error.message}`);\n      }\n\n      return;\n    } finally {\n      inflight.delete(controller);\n    }\n\n    await processLinks(text, 'url', sourceNameFromUrl(input));\n  }\n\n  async function startText() {\n    const text = $('textInput').value;\n\n    if (!text.trim()) {\n      return alert('Please paste M3U content.');\n    }\n\n    await processLinks(text, 'text', 'pasted_streams.m3u');\n  }\n\n  function togglePause(type) {\n    run.paused = !run.paused;\n\n    $(`${type}PauseButton`).textContent = run.paused ? 'Resume' : 'Pause';\n\n    const summary = $('summaryLine');\n    const prefix = 'Paused — click Resume to continue. ';\n\n    if (run.paused) {\n      summary.textContent = prefix + summary.textContent;\n    } else if (summary.textContent.startsWith(prefix)) {\n      summary.textContent = summary.textContent.slice(prefix.length);\n    }\n  }\n\n  function cancelProcess() {\n    run.cancelled = true;\n    run.paused = false;\n\n    inflight.forEach((controller) => controller.abort());\n  }\n\n  function wireControls(extra = {}) {\n    const starters = { file: startFile, url: startUrl, text: startText };\n\n    Object.entries(starters).forEach(([type, start]) => {\n      $(`${type}CheckButton`).addEventListener('click', start);\n      $(`${type}PauseButton`).addEventListener('click', () => togglePause(type));\n      $(`${type}CancelButton`).addEventListener('click', cancelProcess);\n    });\n\n    Object.entries(extra).forEach(([id, handler]) => $(id).addEventListener('click', handler));\n  }\n\n\n  const LOCKED_INPUT_IDS = [\n    'fileInput',\n    'urlInput',\n    'textInput',\n    'concurrencyInput',\n    'timeoutInput',\n    'try443Checkbox',\n    'htmlCheckbox',\n    'opaqueCheckbox',\n  ];\n\n  /* http url -> Promise\u003cresult>; the same address in two entries is only tested once */\n  const checkCache = new Map();\n  /* https origin -> Promise\u003cboolean>; one dead server is only waited for once */\n  const originCache = new Map();\n  /* functions that stop a running playback test */\n  const audioStops = new Set();\n\n  function getSettings() {\n    return {\n      concurrency: readNumber('concurrencyInput'),\n      timeout: readNumber('timeoutInput'),\n      try443: $('try443Checkbox').checked,\n      rejectHtml: $('htmlCheckbox').checked,\n      opaque: $('opaqueCheckbox').checked,\n    };\n  }\n\n  function resetOutput() {\n    $('output').value = '';\n\n    hideDownload('downloadButton');\n    hideDownload('downloadHttpsButton');\n    hideDownload('downloadReportButton');\n\n    setCurrentChecking('');\n\n    $('summaryLine').textContent = '';\n\n    setDisplayStates(false);\n\n    progress.done = 0;\n    progress.total = 0;\n\n    checkCache.clear();\n    originCache.clear();\n  }\n\n  /* ============================================================\n   TESTING ONE https ADDRESS\n   ============================================================ */\n\n  /* formats a browser cannot play in an \u003caudio> element: they can only be probed, not played */\n  const NOT_PLAYABLE_IN_BROWSER = /\\.(m3u8|pls|asx|wma|wmv|mms)(?:$|[?;])/i;\n\n  /* One GET with a tiny Range. cors:true -> readable status and type; cors:false -> only \"did the server answer\". */\n  async function fetchOnce(url, timeoutMs, { cors }) {\n    const request = startRequest(timeoutMs);\n\n    try {\n      const options = {\n        method: 'GET',\n        signal: request.signal,\n        headers: { Range: 'bytes=0-1' },\n        redirect: 'follow',\n        cache: 'no-store',\n      };\n\n      if (!cors) options.mode = 'no-cors';\n\n      const response = await fetch(url, options);\n\n      if (!cors) return { ok: true };\n\n      return {\n        ok: response.status === 200 || response.status === 206,\n        status: response.status,\n        type: (response.headers.get('content-type') || '').toLowerCase(),\n      };\n    } catch (error) {\n      return { ok: false, error: error.name === 'AbortError' ? 'timeout' : 'network' };\n    } finally {\n      request.finish(); /* closes the connection: a live stream would otherwise keep downloading */\n    }\n  }\n\n  /*\n   * Does the stream really play? An \u003caudio> element loads cross-origin audio without any CORS\n   * headers, so this verifies streams whose server never sends them. Nothing is played aloud.\n   */\n  function playbackTest(url, timeoutMs) {\n    return new Promise((resolve) => {\n      const audio = new Audio();\n      let finished = false;\n\n      const finish = (ok) => {\n        if (finished) return;\n\n        finished = true;\n        clearTimeout(timer);\n        audioStops.delete(stop);\n        audio.removeAttribute('src');\n        audio.load();\n        resolve(ok);\n      };\n\n      const stop = () => finish(false);\n      const timer = setTimeout(stop, timeoutMs);\n\n      audioStops.add(stop);\n\n      audio.preload = 'auto';\n      audio.muted = true;\n      audio.addEventListener('loadedmetadata', () => finish(true), { once: true });\n      audio.addEventListener('canplay', () => finish(true), { once: true });\n      audio.addEventListener('error', stop, { once: true });\n      audio.src = url;\n    });\n  }\n\n  function originAlive(origin, settings) {\n    if (!originCache.has(origin)) {\n      originCache.set(\n        origin,\n        fetchOnce(`${origin}/`, settings.timeout, { cors: false }).then((result) => result.ok),\n      );\n    }\n\n    return originCache.get(origin);\n  }\n\n  async function probeCandidate(url, settings) {\n    let origin;\n\n    try {\n      origin = new URL(url).origin;\n    } catch {\n      return { ok: false };\n    }\n\n    if (!(await originAlive(origin, settings))) {\n      return { ok: false, reason: 'no https server there' };\n    }\n\n    if (run.cancelled) return { ok: false };\n\n    const read = await fetchOnce(url, settings.timeout, { cors: true });\n\n    if (read.ok) {\n      if (settings.rejectHtml && /text\\/html|application\\/xhtml/.test(read.type)) {\n        return { ok: false, reason: 'answers with a web page, not a stream' };\n      }\n\n      return { ok: true, how: 'verified' };\n    }\n\n    if (read.status) return { ok: false, reason: `HTTP ${read.status}` };\n    if (read.error === 'timeout') return { ok: false, reason: 'timed out' };\n    if (run.cancelled) return { ok: false };\n\n    /* CORS-blocked: the response exists but cannot be read, so try to play it */\n    if (!NOT_PLAYABLE_IN_BROWSER.test(url)) {\n      if (await playbackTest(url, settings.timeout)) return { ok: true, how: 'playback' };\n\n      return { ok: false, reason: 'does not play over https' };\n    }\n\n    if (settings.opaque) {\n      const opaque = await fetchOnce(url, settings.timeout, { cors: false });\n\n      if (opaque.ok) return { ok: true, how: 'unverified' };\n    }\n\n    return { ok: false, reason: 'no answer over https' };\n  }\n\n  function candidatesFor(httpUrl, settings) {\n    let parsed;\n\n    try {\n      parsed = new URL(httpUrl);\n    } catch {\n      return [];\n    }\n\n    const list = [];\n    const same = new URL(httpUrl);\n\n    same.protocol = 'https:'; /* a custom port is kept, the default port 80 becomes 443 */\n    list.push(same.href);\n\n    if (settings.try443 && parsed.port && parsed.port !== '80') {\n      const standard = new URL(same.href);\n\n      standard.port = '';\n      list.push(standard.href);\n    }\n\n    return [...new Set(list)];\n  }\n\n  async function checkStream(httpUrl, settings) {\n    let lastReason = 'no https version found';\n\n    for (const candidate of candidatesFor(httpUrl, settings)) {\n      if (run.cancelled) return { state: 'cancelled' };\n\n      const result = await probeCandidate(candidate, settings);\n\n      if (result.ok) return { state: 'upgraded', url: candidate, how: result.how };\n\n      if (result.reason) lastReason = result.reason;\n    }\n\n    return { state: 'stay', reason: lastReason };\n  }\n\n  /* ============================================================\n   OUTPUT\n   ============================================================ */\n\n  function buildPlaylist(parsed, results, httpsOnly) {\n    const lines = [parsed.extm3u, ...parsed.header];\n\n    let streams = 0;\n    let droppedHttp = 0;\n\n    parsed.entries.forEach((entry, index) => {\n      if (!entry.url) return;\n\n      const result = results.get(index);\n      const url = result && result.state === 'upgraded' ? result.url : entry.url;\n\n      if (httpsOnly && /^http:\\/\\//i.test(url)) {\n        droppedHttp++;\n\n        return;\n      }\n\n      streams++;\n\n      lines.push(...renderEntry({ ...entry, url }));\n    });\n\n    return { text: lines.join('\\n'), streams, droppedHttp };\n  }\n\n  function buildReport(parsed, results) {\n    const upgraded = [];\n    const stay = [];\n\n    parsed.entries.forEach((entry, index) => {\n      const result = results.get(index);\n\n      if (!result) return;\n\n      const title = entry.title || '(no title)';\n\n      if (result.state === 'upgraded') {\n        const note = result.how === 'unverified' ? ' [unverified: answered, could not be read or played]' : result.how === 'playback' ? ' [plays]' : ' [verified]';\n\n        upgraded.push(`${title}\\n${entry.url}\\n  -> ${result.url}${note}\\n`);\n      } else {\n        stay.push(`${title}\\n${entry.url}\\n  stays http: ${result.reason}\\n`);\n      }\n    });\n\n    return (\n      `UPGRADED (${upgraded.length})\\n\\n${upgraded.join('\\n') || '(none)\\n'}\\n\\n` +\n      `STAY HTTP (${stay.length})\\n\\n${stay.join('\\n') || '(none)\\n'}`\n    );\n  }\n\n  async function processLinks(text, type, sourceName) {\n    beginRun();\n    resetOutput();\n    toggleButtons(type, true);\n\n    const settings = getSettings();\n\n    setCurrentChecking('Starting https upgrade test...');\n\n    const parsed = parseM3U(text);\n\n    const jobs = parsed.entries\n      .map((entry, index) => ({ entry, index }))\n      .filter((job) => /^http:\\/\\//i.test(job.entry.url || ''));\n\n    progress.total = jobs.length;\n\n    const results = new Map();\n\n    let upgradable = 0;\n    let stay = 0;\n    let unverified = 0;\n\n    await runPool(jobs, settings.concurrency, async ({ entry, index }) => {\n      await waitWhilePaused();\n\n      if (run.cancelled) return;\n\n      if (!checkCache.has(entry.url)) {\n        checkCache.set(entry.url, checkStream(entry.url, settings));\n      }\n\n      const result = await checkCache.get(entry.url);\n\n      if (result.state === 'cancelled') return;\n\n      results.set(index, result);\n\n      if (result.state === 'upgraded') {\n        upgradable++;\n        if (result.how === 'unverified') unverified++;\n      } else {\n        stay++;\n      }\n\n      showProgress(\n        'Testing https for',\n        entry.title,\n        entry.url,\n        (done, total) => `Tested ${done}/${total} — ${upgradable} can upgrade, ${stay} http-only so far`,\n      );\n    });\n\n    const upgradedList = buildPlaylist(parsed, results, false);\n    const httpsOnly = buildPlaylist(parsed, results, true);\n\n    $('output').value = upgradedList.text;\n\n    toggleButtons(type, false);\n\n    const totalEntries = parsed.entries.filter((e) => e.url).length;\n    const httpsAlready = totalEntries - jobs.length;\n\n    if (!jobs.length) {\n      setCurrentChecking('No http:// streams found: nothing to upgrade.');\n    } else if (run.cancelled) {\n      setCurrentChecking('Cancelled. Showing partial results.');\n    } else {\n      setCurrentChecking(`Done. ${upgradable} of ${jobs.length} http streams have a working https address.`);\n    }\n\n    $('summaryLine').textContent =\n      `${run.cancelled ? 'Cancelled' : 'Done'}: ${upgradable} upgraded` +\n      (unverified ? ` (${unverified} unverified)` : '') +\n      `, ${stay} stay http, ${httpsAlready} were not http (https, rtmp...). ` +\n      `The https-only file has ${httpsOnly.streams} streams.`;\n\n    if (jobs.length) {\n      setDownload('downloadButton', 'downloadLink', upgradedList.text, 'audio/x-mpegurl', outputName(sourceName, '_https'));\n      setDownload('downloadHttpsButton', 'downloadHttpsLink', httpsOnly.text, 'audio/x-mpegurl', outputName(sourceName, '_https_only'));\n      setDownload('downloadReportButton', 'downloadReportLink', buildReport(parsed, results), 'text/plain', reportName(sourceName, '_https', '_report.txt'));\n    }\n  }\n\n  ['fileCancelButton', 'urlCancelButton', 'textCancelButton'].forEach((id) => {\n    $(id).addEventListener('click', () => [...audioStops].forEach((stop) => stop()));\n  });\n\n  wireControls({\n    downloadButton: () => clickLink('downloadLink'),\n    downloadHttpsButton: () => clickLink('downloadHttpsLink'),\n    downloadReportButton: () => clickLink('downloadReportLink'),\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"split",label:"Split playlist",tip:"Split one big playlist into many files by genre, country and more",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Splitter\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.mid { width: 860px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 240px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'], .setting-item input[type='number'] { margin: 3px 0 0; padding: 6px; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 60vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; }\n.grid th { position: sticky; top: 0; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 4px 8px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid td.num { text-align: right; white-space: nowrap; color: var(--muted); }\n.grid td.fname { word-break: break-all; font-size: 0.85em; color: var(--muted); }\n.grid tr.off td { opacity: 0.45; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container mid\">\n\u003ch1>M3U Splitter\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\">\n\u003cbutton id=\"fileLoad\" class=\"orange\">Load local file\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlLoad\" class=\"pink\">Load Online Link\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textLoad\" class=\"violet\">Load Pasted streams\u003c/button>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\" open>\n\u003csummary>Split options\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"mode\">Split by\u003c/label>\n\u003cselect id=\"mode\">\n\u003coption value=\"group\">group-title (or #EXTGRP)\u003c/option>\n\u003coption value=\"country\">tvg-country\u003c/option>\n\u003coption value=\"language\">tvg-language\u003c/option>\n\u003coption value=\"letter\">First letter of the title\u003c/option>\n\u003coption value=\"type\">Stream type (from the URL: mp3, aac, ogg, hls...)\u003c/option>\n\u003coption value=\"bitrate\">Bitrate (from the title, URL or bitrate attribute)\u003c/option>\n\u003coption value=\"host\">Server host\u003c/option>\n\u003coption value=\"scheme\">http / https\u003c/option>\n\u003coption value=\"attr\">Any other attribute...\u003c/option>\n\u003coption value=\"chunk\">Fixed number of entries per file\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003cdiv class=\"setting-item hidden\" id=\"attrWrap\">\u003clabel for=\"attrName\">Attribute name\u003c/label>\u003cinput type=\"text\" id=\"attrName\" placeholder=\"e.g. tvg-chno\">\u003c/div>\n\u003cdiv class=\"setting-item hidden\" id=\"chunkWrap\">\u003clabel for=\"chunkSize\">Entries per file\u003c/label>\u003cinput type=\"number\" id=\"chunkSize\" min=\"1\" max=\"100000\" value=\"500\">\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"prefix\">File name prefix\u003c/label>\n\u003cinput type=\"text\" id=\"prefix\" placeholder=\"playlist\" value=\"playlist\">\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"minSize\">Buckets smaller than this go into \"other\"\u003c/label>\n\u003cinput type=\"number\" id=\"minSize\" min=\"1\" max=\"100000\" value=\"1\">\n\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"order\">Order buckets\u003c/label>\n\u003cselect id=\"order\">\n\u003coption value=\"size\">Largest first\u003c/option>\n\u003coption value=\"name\">A to Z\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"multi\">\u003clabel for=\"multi\">Split multi-value fields on ; , | (entry lands in each file)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"keepUnknown\" checked>\u003clabel for=\"keepUnknown\">Entries with no value go to an \"unknown\" file\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"lower\" checked>\u003clabel for=\"lower\">Lower-case file names\u003c/label>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"results\" class=\"hidden\">\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Bucket\u003c/th>\u003cth>Entries\u003c/th>\u003cth>File\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"zipBtn\" class=\"green wide-btn\">Download ZIP\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n\n  /* ============================================================\n   M3U CORE (same parser as the other M3U tool pages)\n   ============================================================ */\n  function splitExtinf(line) {\n    let inQuotes = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      const ch = line[i];\n      if (ch === '\"') inQuotes = !inQuotes;\n      else if (ch === ',' && !inQuotes) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pendingExtinf = null;\n    let pendingExtra = [];\n    const flush = (url) => {\n      entries.push({ extinf: pendingExtinf, extra: pendingExtra, url });\n      pendingExtinf = null;\n      pendingExtra = [];\n    };\n    for (const line of lines) {\n      if (line === '') continue;\n      if (/^#EXTM3U/i.test(line)) {\n        if (!seen) extm3u = line;\n        continue;\n      }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) {\n        if (pendingExtinf) flush(null);\n        pendingExtinf = line;\n        continue;\n      }\n      if (line.startsWith('#')) {\n        if (!entries.length && !pendingExtinf) header.push(line);\n        else pendingExtra.push(line);\n        continue;\n      }\n      flush(line);\n    }\n    if (pendingExtinf) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function renderEntry(entry) {\n    const out = [];\n    if (entry.extinf) out.push(entry.extinf);\n    out.push(...entry.extra);\n    if (entry.url) out.push(entry.url);\n    return out;\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const { prefix } = splitExtinf(extinf);\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  const escHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  function saveBlob(blob, name) {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  /* ============================================================\n   MINIMAL ZIP WRITER (stored, no compression, UTF-8 names)\n   ============================================================ */\n  const CRC_TABLE = (() => {\n    const t = new Uint32Array(256);\n    for (let n = 0; n \u003c 256; n++) {\n      let c = n;\n      for (let k = 0; k \u003c 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;\n      t[n] = c >>> 0;\n    }\n    return t;\n  })();\n\n  function crc32(bytes) {\n    let c = 0xffffffff;\n    for (let i = 0; i \u003c bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);\n    return (c ^ 0xffffffff) >>> 0;\n  }\n\n  function buildZip(files) {\n    const enc = new TextEncoder();\n    const now = new Date();\n    const dosTime = (now.getHours() \u003c\u003c 11) | (now.getMinutes() \u003c\u003c 5) | (now.getSeconds() >> 1);\n    const dosDate = ((now.getFullYear() - 1980) \u003c\u003c 9) | ((now.getMonth() + 1) \u003c\u003c 5) | now.getDate();\n    const parts = [];\n    const central = [];\n    let offset = 0;\n\n    for (const f of files) {\n      const name = enc.encode(f.name);\n      const data = enc.encode(f.text);\n      const crc = crc32(data);\n\n      const local = new DataView(new ArrayBuffer(30));\n      local.setUint32(0, 0x04034b50, true);\n      local.setUint16(4, 20, true);\n      local.setUint16(6, 0x0800, true);\n      local.setUint16(8, 0, true);\n      local.setUint16(10, dosTime, true);\n      local.setUint16(12, dosDate, true);\n      local.setUint32(14, crc, true);\n      local.setUint32(18, data.length, true);\n      local.setUint32(22, data.length, true);\n      local.setUint16(26, name.length, true);\n      local.setUint16(28, 0, true);\n      parts.push(local.buffer, name, data);\n\n      const cd = new DataView(new ArrayBuffer(46));\n      cd.setUint32(0, 0x02014b50, true);\n      cd.setUint16(4, 20, true);\n      cd.setUint16(6, 20, true);\n      cd.setUint16(8, 0x0800, true);\n      cd.setUint16(10, 0, true);\n      cd.setUint16(12, dosTime, true);\n      cd.setUint16(14, dosDate, true);\n      cd.setUint32(16, crc, true);\n      cd.setUint32(20, data.length, true);\n      cd.setUint32(24, data.length, true);\n      cd.setUint16(28, name.length, true);\n      cd.setUint32(42, offset, true);\n      central.push(cd.buffer, name);\n\n      offset += 30 + name.length + data.length;\n    }\n\n    const centralSize = central.reduce((n, p) => n + (p.byteLength !== undefined ? p.byteLength : p.length), 0);\n    const end = new DataView(new ArrayBuffer(22));\n    end.setUint32(0, 0x06054b50, true);\n    end.setUint16(8, files.length, true);\n    end.setUint16(10, files.length, true);\n    end.setUint32(12, centralSize, true);\n    end.setUint32(16, offset, true);\n\n    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });\n  }\n\n  /* ===================================================
