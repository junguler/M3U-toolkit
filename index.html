<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3U Toolkit</title>
<style>
/* Concrete Signal - same look as every tool inside. System fonts only, no external requests. */
:root {
  --concrete: #2b2b2b;
  --panel: #1a1a1a;
  --line: #e6e6e6;
  --ink: #000000;
  --text: #ffffff;
  --muted: #bdbdbd;
  --yellow: #ffd100;
  --bw: 4px;
  --mono: ui-monospace, Consolas, "Courier New", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--concrete); color: var(--text); font-family: var(--mono); font-size: 14px; overflow: hidden; }

#bar { flex: none; display: flex; align-items: stretch; gap: 10px; padding: 0 10px 0 0; background: var(--panel); border-bottom: var(--bw) solid var(--line); }
.brand { flex: none; display: flex; align-items: center; padding: 0 14px; background: var(--yellow); color: var(--ink); font-size: 1.25em; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
#tabs { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 9px 0; }
#tabs button {
  flex: none; height: 36px; display: flex; align-items: center; padding: 0 12px;
  border: 3px solid var(--line); border-radius: 0; background: var(--panel); color: var(--text);
  font: inherit; font-size: 0.85em; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; cursor: pointer;
}
#tabs button:hover { background: #2e2e2e; }
#tabs button[aria-selected='true'] {
  background: var(--yellow); color: var(--ink); border-color: var(--ink);
  -webkit-text-stroke: 0.5px currentColor; box-shadow: 3px 3px 0 var(--text); transform: translate(-1px, -1px);
}
#tabs button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

#frames { flex: 1; min-height: 0; position: relative; background: var(--concrete); }
#frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--concrete); }
#frames iframe.on { display: block; }

@media (max-width: 760px) {
  #bar { flex-direction: column; padding: 0; gap: 0; }
  .brand { padding: 6px 12px; }
  #tabs { flex-wrap: nowrap; overflow-x: auto; padding: 8px 10px; }
}
</style>
</head>
<body>
<header id="bar">
<div class="brand">M3U Toolkit</div>
<nav id="tabs" role="tablist" aria-label="Tools"></nav>
</header>
<main id="frames"></main>

<script>
(() => {
  'use strict';

  /* every tool is a complete page of its own, kept as text and loaded into an iframe the first time its tab opens */
  const TABS = [
  {id:"merge",label:"Merge & dedupe",tip:"Combine playlists and remove duplicate streams",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Merger\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.list-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 4px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.source-list { border: var(--bw) solid var(--line); background: var(--ink); max-height: 220px; overflow: auto; }\n.empty { padding: 12px; color: var(--muted); font-size: 0.85em; }\n.src-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 2px solid #333; }\n.src-row:last-child { border-bottom: none; }\n.src-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.src-count { color: var(--muted); font-size: 0.85em; white-space: nowrap; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 230px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select { margin: 3px 0 0; padding: 6px; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n#output { display: block; width: 100%; height: 170px; margin: 5px 0 6px; padding: 8px 10px; font-size: 0.85em; resize: vertical; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n\u003ch1>M3U Merger\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\" multiple>\n\u003cbutton id=\"fileAdd\" class=\"orange\">Add files\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"urlInput\" rows=\"2\" placeholder=\"Online M3U URLs, one per line...\">\u003c/textarea>\n\u003cbutton id=\"urlAdd\" class=\"pink\">Add URLs\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textAdd\" class=\"violet\">Add pasted\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"list-head\">\u003cspan>Sources\u003c/span>\u003cbutton id=\"clearAll\" class=\"mini red\">Clear all\u003c/button>\u003c/div>\n\u003cdiv id=\"sourceList\" class=\"source-list\">\u003c/div>\n\n\u003cdetails class=\"advanced-settings\" open>\n\u003csummary>Options (matching, keep rule, sorting)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optScheme\" checked>\u003clabel for=\"optScheme\">Treat http:// and https:// as the same stream\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optWww\" checked>\u003clabel for=\"optWww\">Ignore a leading www.\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optJunk\" checked>\u003clabel for=\"optJunk\">Ignore tracking / cache-buster params (utm_*, cb, ...)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optQuery\">\u003clabel for=\"optQuery\">Ignore the whole query string\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"optTitle\">Also merge by station title\u003c/label>\n\u003cselect id=\"optTitle\">\n\u003coption value=\"off\">Off (URL only)\u003c/option>\n\u003coption value=\"host\">Same title on the same host\u003c/option>\n\u003coption value=\"any\">Same title anywhere (aggressive)\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"optKeep\">When duplicates are found, keep\u003c/label>\n\u003cselect id=\"optKeep\">\n\u003coption value=\"richest\">The entry with the most metadata\u003c/option>\n\u003coption value=\"https\">The https:// version, then most metadata\u003c/option>\n\u003coption value=\"first\">The first one seen\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optFill\" checked>\u003clabel for=\"optFill\">Fill missing tvg-* / group attributes from the dropped copy\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"optGroup\">\u003clabel for=\"optGroup\">No group-title? Use the source file name\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"optSort\">Sort result\u003c/label>\n\u003cselect id=\"optSort\">\n\u003coption value=\"none\">Keep source order\u003c/option>\n\u003coption value=\"title\">By title\u003c/option>\n\u003coption value=\"group\">By group, then title\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"center-col\">\u003cbutton id=\"mergeBtn\" class=\"orange wide-btn\" disabled>Merge &amp; dedupe\u003c/button>\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\u003ctextarea id=\"output\" readonly placeholder=\"Merged playlist appears here...\">\u003c/textarea>\n\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"downloadBtn\" class=\"green wide-btn hidden\">Download Merged Playlist\u003c/button>\n\u003cbutton id=\"reportBtn\" class=\"yellow wide-btn hidden\">Download Duplicates Report\u003c/button>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n\n  /* ============================================================\n   M3U CORE (same parser as the other M3U tool pages)\n   ============================================================ */\n  function splitExtinf(line) {\n    let inQuotes = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      const ch = line[i];\n      if (ch === '\"') inQuotes = !inQuotes;\n      else if (ch === ',' && !inQuotes) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pendingExtinf = null;\n    let pendingExtra = [];\n    const flush = (url) => {\n      entries.push({ extinf: pendingExtinf, extra: pendingExtra, url });\n      pendingExtinf = null;\n      pendingExtra = [];\n    };\n    for (const line of lines) {\n      if (line === '') continue;\n      if (/^#EXTM3U/i.test(line)) {\n        if (!seen) extm3u = line;\n        continue;\n      }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) {\n        if (pendingExtinf) flush(null);\n        pendingExtinf = line;\n        continue;\n      }\n      if (line.startsWith('#')) {\n        if (!entries.length && !pendingExtinf) header.push(line);\n        else pendingExtra.push(line);\n        continue;\n      }\n      flush(line);\n    }\n    if (pendingExtinf) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function renderEntry(entry) {\n    const out = [];\n    if (entry.extinf) out.push(entry.extinf);\n    out.push(...entry.extra);\n    if (entry.url) out.push(entry.url);\n    return out;\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const { prefix } = splitExtinf(extinf);\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  /* replaces an existing attribute value or appends a new attribute before the title comma */\n  function setAttr(extinf, key, value) {\n    const { prefix, title } = splitExtinf(extinf);\n    const safe = String(value).replace(/\"/g, \"'\");\n    const esc = key.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    const re = new RegExp(`(\\\\s${esc}=\")[^\"]*(\")`);\n    const next = re.test(prefix) ? prefix.replace(re, `$1${safe}$2`) : `${prefix} ${key}=\"${safe}\"`;\n    return `${next},${title}`;\n  }\n\n  const downloadText = (text, mime, name) => {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  };\n\n  /* ============================================================\n   ONLINE FETCH\n   ============================================================ */\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  async function fetchText(input) {\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 20000);\n    try {\n      const response = await fetch(normalizeOnlineUrl(input), { signal: controller.signal, cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      return await response.text();\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  /* ============================================================\n   SOURCES\n   ============================================================ */\n  const state = { sources: [], notes: [] };\n\n  function say(lines) {\n    $('summaryLine').textContent = Array.isArray(lines) ? lines.join('\\n') : lines;\n  }\n\n  function renderSources() {\n    const box = $('sourceList');\n    box.textContent = '';\n    if (!state.sources.length) {\n      const p = document.createElement('div');\n      p.className = 'empty';\n      p.textContent = 'No sources yet. Add files, URLs or pasted text above.';\n      box.appendChild(p);\n    }\n    state.sources.forEach((s, i) => {\n      const row = document.createElement('div');\n      row.className = 'src-row';\n      const name = document.createElement('span');\n      name.className = 'src-name';\n      name.textContent = s.name;\n      name.title = s.name;\n      const count = document.createElement('span');\n      count.className = 'src-count';\n      count.textContent = `${s.parsed.entries.length} entries`;\n      const del = document.createElement('button');\n      del.className = 'mini red';\n      del.textContent = 'Remove';\n      del.addEventListener('click', () => {\n        state.sources.splice(i, 1);\n        renderSources();\n      });\n      row.append(name, count, del);\n      box.appendChild(row);\n    });\n    $('mergeBtn').disabled = !state.sources.length;\n  }\n\n  function addSource(name, text) {\n    const parsed = parseM3U(text);\n    if (!parsed.entries.length) {\n      state.notes.push(`\"${name}\": no entries found, skipped.`);\n      return false;\n    }\n    state.sources.push({ name, parsed });\n    return true;\n  }\n\n  async function addFiles() {\n    const files = [...$('fileInput').files];\n    if (!files.length) return alert('Please choose one or more M3U files.');\n    state.notes = [];\n    for (const file of files) addSource(file.name, await file.text());\n    $('fileInput').value = '';\n    renderSources();\n    say(state.notes.length ? state.notes : `Added ${files.length} file(s).`);\n  }\n\n  async function addUrls() {\n    const urls = $('urlInput').value.split(/\\r?\\n/).map((s) => s.trim()).filter(Boolean);\n    if (!urls.length) return alert('Please enter at least one online M3U URL.');\n    state.notes = [];\n    $('urlAdd').disabled = true;\n    let added = 0;\n    for (let i = 0; i \u003c urls.length; i++) {\n      say(`Fetching ${i + 1}/${urls.length}...\\n${urls[i]}`);\n      try {\n        const text = await fetchText(urls[i]);\n        let name = urls[i];\n        try { name = decodeURIComponent(new URL(urls[i]).pathname.split('/').pop()) || urls[i]; } catch { /* keep url */ }\n        if (addSource(name, text)) added++;\n      } catch (error) {\n        state.notes.push(`${urls[i]}\\n  failed: ${error.message} (the server may block browser CORS requests)`);\n      }\n    }\n    $('urlAdd').disabled = false;\n    $('urlInput').value = '';\n    renderSources();\n    say([`Added ${added} of ${urls.length} URL(s).`, ...state.notes]);\n  }\n\n  function addPasted() {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    state.notes = [];\n    const n = state.sources.filter((s) => s.name.startsWith('pasted')).length + 1;\n    const ok = addSource(`pasted_${n}.m3u`, text);\n    if (ok) $('textInput').value = '';\n    renderSources();\n    say(state.notes.length ? state.notes : 'Added pasted playlist.');\n  }\n\n  /* ============================================================\n   MATCHING\n   ============================================================ */\n  const JUNK_PARAM = /^(utm_[a-z]+|fbclid|gclid|cb|nocache|_|ts|timestamp|rnd)$/i;\n\n  function urlKey(raw, o) {\n    let u;\n    try {\n      u = new URL(raw);\n    } catch {\n      return raw.trim().toLowerCase();\n    }\n    if (u.protocol !== 'http:' && u.protocol !== 'https:') return u.href;\n\n    let host = u.hostname.toLowerCase();\n    if (o.stripWww) host = host.replace(/^www\\./, '');\n\n    let port = u.port;\n    if (o.ignoreScheme && (port === '80' || port === '443')) port = '';\n\n    /* \"/\", \"/;\" and \"\" all mean the same Shoutcast/Icecast root */\n    const path = u.pathname.replace(/\\/{2,}/g, '/').replace(/\\/;?$/, '');\n\n    let query = '';\n    if (!o.stripQuery) {\n      const params = [...u.searchParams.entries()].filter(([k]) => !(o.stripJunk && JUNK_PARAM.test(k)));\n      params.sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]));\n      if (params.length) query = '?' + params.map(([k, v]) => `${k}=${v}`).join('&');\n    }\n\n    return (o.ignoreScheme ? '' : u.protocol + '//') + host + (port ? ':' + port : '') + path + query;\n  }\n\n  function hostOf(raw) {\n    try {\n      return new URL(raw).hostname.toLowerCase().replace(/^www\\./, '');\n    } catch {\n      return '';\n    }\n  }\n\n  function titleKey(title) {\n    return title\n      .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase()\n      .replace(/[([][^)\\]]*[)\\]]/g, ' ')\n      .replace(/[^\\p{L}\\p{N}]+/gu, '');\n  }\n\n  function score(entry, o) {\n    const attrs = parseAttrs(entry.extinf);\n    const filled = Object.values(attrs).filter((v) => v !== '').length;\n    const https = /^https:/i.test(entry.url) ? 1 : 0;\n    if (o.keep === 'first') return 0;\n    if (o.keep === 'https') return https * 1000 + filled;\n    return filled * 10 + https + (entry.title ? 1 : 0);\n  }\n\n  function fillFrom(winner, loser) {\n    if (!loser.extinf) return;\n    const from = parseAttrs(loser.extinf);\n    for (const [key, value] of Object.entries(from)) {\n      if (!value) continue;\n      const have = parseAttrs(winner.extinf);\n      if (!have[key]) winner.extinf = setAttr(winner.extinf || `#EXTINF:-1,${winner.title}`, key, value);\n    }\n  }\n\n  function applySourceGroup(entry, sourceName) {\n    if (parseAttrs(entry.extinf)['group-title']) return;\n    const stem = sourceName.replace(/\\.(m3u8?|txt)$/i, '');\n    entry.extinf = setAttr(entry.extinf || `#EXTINF:-1,${entry.title}`, 'group-title', stem);\n  }\n\n  /* decides which of two duplicates stays; the list slot `index` is updated in place */\n  function resolve(list, index, incoming, reason, o, removed) {\n    const current = list[index];\n    let winner = current;\n    let loser = incoming;\n    if (o.keep !== 'first' && score(incoming, o) > score(current, o)) {\n      winner = incoming;\n      loser = current;\n      list[index] = incoming;\n    }\n    if (o.fill) fillFrom(winner, loser);\n    removed.push({ loser, winner, reason });\n  }\n\n  function merge(sources, o) {\n    let total = 0;\n    let noUrl = 0;\n    const removed = [];\n    let kept = [];\n    const byUrl = new Map();\n\n    for (const source of sources) {\n      for (const raw of source.parsed.entries) {\n        total++;\n        if (!raw.url) {\n          noUrl++;\n          continue;\n        }\n        const entry = { extinf: raw.extinf, extra: [...raw.extra], url: raw.url, title: raw.title };\n        if (o.groupFromSource) applySourceGroup(entry, source.name);\n        const key = urlKey(entry.url, o);\n        if (byUrl.has(key)) {\n          resolve(kept, byUrl.get(key), entry, 'same URL', o, removed);\n        } else {\n          byUrl.set(key, kept.length);\n          kept.push(entry);\n        }\n      }\n    }\n\n    if (o.titleMode !== 'off') {\n      const byTitle = new Map();\n      const next = [];\n      for (const entry of kept) {\n        const tk = titleKey(entry.title);\n        if (!tk) {\n          next.push(entry);\n          continue;\n        }\n        const key = o.titleMode === 'host' ? `${tk}|${hostOf(entry.url)}` : tk;\n        if (byTitle.has(key)) {\n          resolve(next, byTitle.get(key), entry, o.titleMode === 'host' ? 'same title + host' : 'same title', o, removed);\n        } else {\n          byTitle.set(key, next.length);\n          next.push(entry);\n        }\n      }\n      kept = next;\n    }\n\n    if (o.sort !== 'none') {\n      const collator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });\n      const group = (e) => parseAttrs(e.extinf)['group-title'] || '';\n      kept.sort((a, b) => {\n        if (o.sort === 'group') {\n          const g = collator.compare(group(a), group(b));\n          if (g) return g;\n        }\n        return collator.compare(a.title, b.title);\n      });\n    }\n\n    return { entries: kept, removed, total, noUrl };\n  }\n\n  function getOptions() {\n    return {\n      ignoreScheme: $('optScheme').checked,\n      stripWww: $('optWww').checked,\n      stripJunk: $('optJunk').checked,\n      stripQuery: $('optQuery').checked,\n      titleMode: $('optTitle').value,\n      keep: $('optKeep').value,\n      fill: $('optFill').checked,\n      groupFromSource: $('optGroup').checked,\n      sort: $('optSort').value,\n    };\n  }\n\n  let lastPlaylist = '';\n  let lastReport = '';\n\n  function runMerge() {\n    if (!state.sources.length) return;\n    const result = merge(state.sources, getOptions());\n    const first = state.sources[0].parsed;\n\n    const lines = [first.extm3u, ...first.header];\n    result.entries.forEach((e) => lines.push(...renderEntry(e)));\n    lastPlaylist = lines.join('\\n') + '\\n';\n    $('output').value = lastPlaylist;\n\n    const byReason = {};\n    result.removed.forEach((r) => { byReason[r.reason] = (byReason[r.reason] || 0) + 1; });\n    const parts = Object.entries(byReason).map(([k, v]) => `${v} ${k}`).join(', ');\n\n    say(\n      `${state.sources.length} source(s), ${result.total} entries in, ${result.entries.length} out. ` +\n        `${result.removed.length} duplicate(s) removed${parts ? ` (${parts})` : ''}.` +\n        (result.noUrl ? ` ${result.noUrl} title-only entr${result.noUrl === 1 ? 'y' : 'ies'} without a URL dropped.` : ''),\n    );\n\n    $('downloadBtn').classList.toggle('hidden', !result.entries.length);\n\n    lastReport = result.removed\n      .map((r) => `REMOVED (${r.reason})\\n  ${r.loser.title || '(no title)'}\\n  ${r.loser.url}\\nKEPT\\n  ${r.winner.title || '(no title)'}\\n  ${r.winner.url}\\n`)\n      .join('\\n');\n    $('reportBtn').classList.toggle('hidden', !result.removed.length);\n  }\n\n  /* ============================================================\n   WIRING\n   ============================================================ */\n  $('fileAdd').addEventListener('click', addFiles);\n  $('urlAdd').addEventListener('click', addUrls);\n  $('textAdd').addEventListener('click', addPasted);\n  $('clearAll').addEventListener('click', () => {\n    state.sources = [];\n    renderSources();\n    $('output').value = '';\n    $('downloadBtn').classList.add('hidden');\n    $('reportBtn').classList.add('hidden');\n    say('');\n  });\n  $('mergeBtn').addEventListener('click', runMerge);\n  $('downloadBtn').addEventListener('click', () => downloadText(lastPlaylist, 'audio/x-mpegurl', 'merged.m3u'));\n  $('reportBtn').addEventListener('click', () => downloadText(lastReport, 'text/plain', 'merged_duplicates_report.txt'));\n\n  renderSources();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"edit",label:"Edit playlist",tip:"Edit titles, groups and attributes in a table, in bulk",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Editor\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.wide { width: 1240px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 8px; min-width: 260px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select, .setting-item input[type='text'] { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 240px; }\n.toolbar select { flex: 0 1 auto; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 68vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; min-width: max-content; }\n.grid th { position: sticky; top: 0; z-index: 1; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 2px 4px; border-bottom: 2px solid #333; vertical-align: middle; }\n.grid tr.sel td { background: #2c2400; }\n.grid td input[type='text'] { width: 100%; margin: 0; padding: 4px 6px; border-width: 2px; font-size: 0.85em; }\n.grid td.idx { color: var(--muted); font-size: 0.8em; text-align: right; padding-right: 8px; }\n.grid td.acts { white-space: nowrap; }\n.rowbtn { display: inline-flex; width: 30px; height: 28px; margin-right: 4px; padding: 0; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 2px; }\n.pager span { min-width: 110px; text-align: center; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container wide\">\n\u003ch1>M3U Editor\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\">\n\u003cbutton id=\"fileLoad\" class=\"orange\">Load local file\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlLoad\" class=\"pink\">Load Online Link\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textLoad\" class=\"violet\">Load Pasted streams\u003c/button>\n\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"editor\" class=\"hidden\">\n\n\u003cdiv class=\"toolbar\">\n\u003cinput type=\"search\" id=\"search\" placeholder=\"Filter: words match title, URL or group...\">\n\u003cselect id=\"groupSel\" title=\"Group\">\u003c/select>\n\u003cselect id=\"showSel\" title=\"Quick filter\">\n\u003coption value=\"all\">Show: everything\u003c/option>\n\u003coption value=\"nogroup\">No group-title\u003c/option>\n\u003coption value=\"nologo\">No tvg-logo\u003c/option>\n\u003coption value=\"noid\">No tvg-id\u003c/option>\n\u003coption value=\"nocountry\">No tvg-country\u003c/option>\n\u003coption value=\"nolang\">No tvg-language\u003c/option>\n\u003coption value=\"http\">http:// only (not https)\u003c/option>\n\u003coption value=\"nourl\">Empty URL\u003c/option>\n\u003coption value=\"dupurl\">Duplicated URL\u003c/option>\n\u003c/select>\n\u003cselect id=\"pageSize\" title=\"Rows per page\">\n\u003coption value=\"50\">50 rows\u003c/option>\n\u003coption value=\"100\" selected>100 rows\u003c/option>\n\u003coption value=\"250\">250 rows\u003c/option>\n\u003coption value=\"500\">500 rows\u003c/option>\n\u003c/select>\n\u003c/div>\n\n\u003cdiv class=\"toolbar\">\n\u003cbutton id=\"selAllBtn\" class=\"mini white\">Select all filtered\u003c/button>\n\u003cbutton id=\"selNoneBtn\" class=\"mini white\">Select none\u003c/button>\n\u003cbutton id=\"selInvBtn\" class=\"mini white\">Invert\u003c/button>\n\u003cbutton id=\"delSelBtn\" class=\"mini red\">Delete selected\u003c/button>\n\u003cbutton id=\"addBtn\" class=\"mini violet\">Add entry\u003c/button>\n\u003cbutton id=\"undoBtn\" class=\"mini blue\" disabled>Undo\u003c/button>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Columns\u003c/summary>\n\u003cdiv class=\"settings-grid\">\u003cdiv class=\"btn-row\" id=\"colChecks\">\u003c/div>\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Bulk tools\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"col-title\">Apply bulk tools to\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003cselect id=\"scope\">\n\u003coption value=\"selected\">Selected rows\u003c/option>\n\u003coption value=\"filtered\" selected>All filtered rows\u003c/option>\n\u003coption value=\"all\">All rows\u003c/option>\n\u003c/select>\n\u003c/div>\n\n\u003cdiv class=\"col-title\">Set / remove a field\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cselect id=\"setField\">\u003c/select>\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cinput type=\"text\" id=\"setCustom\" placeholder=\"or custom attribute name, e.g. tvg-chno\">\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cinput type=\"text\" id=\"setValue\" placeholder=\"Value\">\u003c/div>\n\u003cdiv class=\"btn-row\">\n\u003cbutton id=\"setBtn\" class=\"mini orange\">Set\u003c/button>\n\u003cbutton id=\"unsetBtn\" class=\"mini red\">Remove attribute\u003c/button>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"col-title\">Find &amp; replace\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cselect id=\"frField\">\u003c/select>\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cinput type=\"text\" id=\"frFind\" placeholder=\"Find\">\u003c/div>\n\u003cdiv class=\"setting-item\">\u003cinput type=\"text\" id=\"frRepl\" placeholder=\"Replace with\">\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"frRegex\">\u003clabel for=\"frRegex\">Regular expression ($1 works)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"frCase\" checked>\u003clabel for=\"frCase\">Ignore case\u003c/label>\u003c/div>\n\u003cdiv class=\"btn-row\">\u003cbutton id=\"frBtn\" class=\"mini pink\">Replace\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"col-title\">Clean &amp; sort (whole list)\u003c/div>\n\u003cdiv class=\"btn-row\">\n\u003cbutton id=\"trimBtn\" class=\"mini white\">Trim titles\u003c/button>\n\u003cbutton id=\"emptyBtn\" class=\"mini white\">Drop empty URLs\u003c/button>\n\u003cbutton id=\"dedupBtn\" class=\"mini white\">Drop duplicate URLs\u003c/button>\n\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003cselect id=\"sortField\">\u003c/select>\n\u003c/div>\n\u003cdiv class=\"btn-row\">\u003cbutton id=\"sortBtn\" class=\"mini violet\">Sort A &rarr; Z\u003c/button>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"grid\">\u003cthead id=\"thead\">\u003c/thead>\u003ctbody id=\"tbody\">\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"pager\">\n\u003cbutton id=\"firstPg\" class=\"mini white\">&laquo;\u003c/button>\n\u003cbutton id=\"prevPg\" class=\"mini white\">&lsaquo;\u003c/button>\n\u003cspan id=\"pageInfo\">\u003c/span>\n\u003cbutton id=\"nextPg\" class=\"mini white\">&rsaquo;\u003c/button>\n\u003cbutton id=\"lastPg\" class=\"mini white\">&raquo;\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"downloadBtn\" class=\"green wide-btn\">Download Playlist\u003c/button>\n\u003cbutton id=\"copyBtn\" class=\"yellow wide-btn\">Copy to clipboard\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n\n  /* ============================================================\n   M3U CORE (same parser as the other M3U tool pages)\n   ============================================================ */\n  function splitExtinf(line) {\n    let inQuotes = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      const ch = line[i];\n      if (ch === '\"') inQuotes = !inQuotes;\n      else if (ch === ',' && !inQuotes) return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n    }\n    return { prefix: line, title: '' };\n  }\n\n  function parseM3U(text) {\n    const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/).map((l) => l.trim());\n    let extm3u = '#EXTM3U';\n    let seen = false;\n    const header = [];\n    const entries = [];\n    let pendingExtinf = null;\n    let pendingExtra = [];\n    const flush = (url) => {\n      entries.push({ extinf: pendingExtinf, extra: pendingExtra, url });\n      pendingExtinf = null;\n      pendingExtra = [];\n    };\n    for (const line of lines) {\n      if (line === '') continue;\n      if (/^#EXTM3U/i.test(line)) {\n        if (!seen) extm3u = line;\n        continue;\n      }\n      seen = true;\n      if (/^#EXTINF/i.test(line)) {\n        if (pendingExtinf) flush(null);\n        pendingExtinf = line;\n        continue;\n      }\n      if (line.startsWith('#')) {\n        if (!entries.length && !pendingExtinf) header.push(line);\n        else pendingExtra.push(line);\n        continue;\n      }\n      flush(line);\n    }\n    if (pendingExtinf) flush(null);\n    entries.forEach((e) => { e.title = e.extinf ? splitExtinf(e.extinf).title : ''; });\n    return { extm3u, header, entries };\n  }\n\n  function renderEntry(entry) {\n    const out = [];\n    if (entry.extinf) out.push(entry.extinf);\n    out.push(...entry.extra);\n    if (entry.url) out.push(entry.url);\n    return out;\n  }\n\n  function parseAttrs(extinf) {\n    const attrs = {};\n    if (!extinf) return attrs;\n    const { prefix } = splitExtinf(extinf);\n    const re = /([\\w.-]+)=\"([^\"]*)\"/g;\n    let m;\n    while ((m = re.exec(prefix))) attrs[m[1]] = m[2];\n    return attrs;\n  }\n\n  const escRe = (s) => s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n\n  function setAttr(extinf, key, value) {\n    const { prefix, title } = splitExtinf(extinf);\n    const safe = String(value).replace(/\"/g, \"'\");\n    const re = new RegExp(`(\\\\s${escRe(key)}=\")[^\"]*(\")`);\n    const next = re.test(prefix) ? prefix.replace(re, `$1${safe}$2`) : `${prefix} ${key}=\"${safe}\"`;\n    return `${next},${title}`;\n  }\n\n  function removeAttr(extinf, key) {\n    if (!extinf) return extinf;\n    const { prefix, title } = splitExtinf(extinf);\n    return `${prefix.replace(new RegExp(`\\\\s${escRe(key)}=\"[^\"]*\"`, 'g'), '')},${title}`;\n  }\n\n  const setTitle = (extinf, title) => (extinf ? `${splitExtinf(extinf).prefix},${title}` : `#EXTINF:-1,${title}`);\n\n  const escHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  const downloadText = (text, mime, name) => {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  };\n\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  /* ============================================================\n   STATE\n   ============================================================ */\n  const COLS = [\n    { key: '@title', label: 'Title', w: 250, on: true },\n    { key: 'group-title', label: 'Group', w: 150, on: true },\n    { key: 'tvg-id', label: 'tvg-id', w: 120, on: false },\n    { key: 'tvg-name', label: 'tvg-name', w: 150, on: false },\n    { key: 'tvg-logo', label: 'tvg-logo', w: 220, on: false },\n    { key: 'tvg-country', label: 'Country', w: 90, on: true },\n    { key: 'tvg-language', label: 'Language', w: 120, on: true },\n    { key: '@url', label: 'URL', w: 360, on: true },\n  ];\n\n  const state = {\n    entries: [],\n    visible: [],\n    selected: new Set(),\n    page: 0,\n    undo: [],\n    name: 'playlist.m3u',\n    head: { extm3u: '#EXTM3U', header: [] },\n    dirty: false,\n  };\n  let nextUid = 1;\n\n  const mk = (raw) => ({ uid: nextUid++, extinf: raw.extinf, extra: (raw.extra || []).slice(), url: raw.url || '', title: raw.title || '' });\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n\n  function getField(entry, field) {\n    if (field === '@title') return entry.title;\n    if (field === '@url') return entry.url;\n    return parseAttrs(entry.extinf)[field] || '';\n  }\n\n  function setField(entry, field, value) {\n    if (field === '@url') {\n      entry.url = value;\n    } else if (field === '@title') {\n      entry.title = value;\n      entry.extinf = setTitle(entry.extinf, value);\n    } else {\n      entry.extinf = setAttr(entry.extinf || `#EXTINF:-1,${entry.title}`, field, value);\n    }\n  }\n\n  /* ---------------- undo ---------------- */\n  function pushUndo() {\n    state.undo.push(state.entries.map((e) => ({ ...e, extra: e.extra.slice() })));\n    if (state.undo.length > 40) state.undo.shift();\n    state.dirty = true;\n    $('undoBtn').disabled = false;\n  }\n\n  function undo() {\n    const snap = state.undo.pop();\n    if (!snap) return;\n    state.entries = snap;\n    const alive = new Set(snap.map((e) => e.uid));\n    [...state.selected].forEach((id) => { if (!alive.has(id)) state.selected.delete(id); });\n    $('undoBtn').disabled = !state.undo.length;\n    refreshAll(false);\n    say('Undone.');\n  }\n\n  /* ============================================================\n   LOADING\n   ============================================================ */\n  function loadText(text, name) {\n    const parsed = parseM3U(text);\n    if (!parsed.entries.length) return alert('No entries found in that playlist.');\n    state.entries = parsed.entries.map(mk);\n    state.head = { extm3u: parsed.extm3u, header: parsed.header };\n    state.name = name;\n    state.selected.clear();\n    state.undo = [];\n    state.dirty = false;\n    $('undoBtn').disabled = true;\n    $('search').value = '';\n    $('showSel').value = 'all';\n    $('editor').classList.remove('hidden');\n    refreshGroups();\n    refreshAll(true);\n    say(`Loaded ${state.entries.length} entries from ${name}.`);\n  }\n\n  async function loadFile() {\n    const file = $('fileInput').files[0];\n    if (!file) return alert('Please upload an M3U file.');\n    loadText(await file.text(), file.name);\n  }\n\n  async function loadUrl() {\n    const input = $('urlInput').value.trim();\n    if (!input) return alert('Please enter an online M3U URL.');\n    let url;\n    try { url = normalizeOnlineUrl(input); } catch (error) { return alert(error.message); }\n    say('Fetching...');\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 20000);\n    try {\n      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      let name = 'playlist.m3u';\n      try { name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || name; } catch { /* keep default */ }\n      loadText(await response.text(), name);\n    } catch (error) {\n      say(`Error fetching online M3U file: ${error.message}. The server may block browser CORS requests.`);\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  function loadPasted() {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    loadText(text, 'pasted_streams.m3u');\n  }\n\n  /* ============================================================\n   FILTER, GROUPS, RENDER\n   ============================================================ */\n  function refreshGroups() {\n    const sel = $('groupSel');\n    const keep = sel.value;\n    const groups = new Set();\n    state.entries.forEach((e) => { const g = parseAttrs(e.extinf)['group-title']; if (g) groups.add(g); });\n    const list = [...groups].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }));\n    sel.textContent = '';\n    const add = (value, label) => {\n      const o = document.createElement('option');\n      o.value = value;\n      o.textContent = label;\n      sel.appendChild(o);\n    };\n    add('', `Group: all (${list.length})`);\n    add('__none__', '(no group)');\n    list.forEach((g) => add(g, g));\n    sel.value = [...sel.options].some((o) => o.value === keep) ? keep : '';\n  }\n\n  function applyFilter(resetPage) {\n    const terms = $('search').value.toLowerCase().split(/\\s+/).filter(Boolean);\n    const group = $('groupSel').value;\n    const show = $('showSel').value;\n    let dupCount = null;\n    if (show === 'dupurl') {\n      dupCount = new Map();\n      state.entries.forEach((e) => {\n        const k = e.url.toLowerCase().replace(/\\/+$/, '');\n        dupCount.set(k, (dupCount.get(k) || 0) + 1);\n      });\n    }\n    state.visible = state.entries.filter((e) => {\n      const a = parseAttrs(e.extinf);\n      if (group === '__none__') {\n        if (a['group-title']) return false;\n      } else if (group !== '' && (a['group-title'] || '') !== group) {\n        return false;\n      }\n      switch (show) {\n        case 'nogroup': if (a['group-title']) return false; break;\n        case 'nologo': if (a['tvg-logo']) return false; break;\n        case 'noid': if (a['tvg-id']) return false; break;\n        case 'nocountry': if (a['tvg-country']) return false; break;\n        case 'nolang': if (a['tvg-language']) return false; break;\n        case 'http': if (!/^http:/i.test(e.url)) return false; break;\n        case 'nourl': if (e.url) return false; break;\n        case 'dupurl': if (!e.url || dupCount.get(e.url.toLowerCase().replace(/\\/+$/, '')) \u003c 2) return false; break;\n        default: break;\n      }\n      if (terms.length) {\n        const hay = `${e.title} ${e.url} ${a['group-title'] || ''}`.toLowerCase();\n        if (!terms.every((t) => hay.includes(t))) return false;\n      }\n      return true;\n    });\n    if (resetPage) state.page = 0;\n  }\n\n  function renderTable() {\n    const cols = COLS.filter((c) => c.on);\n    const size = Number($('pageSize').value);\n    const pages = Math.max(1, Math.ceil(state.visible.length / size));\n    state.page = Math.min(state.page, pages - 1);\n    const start = state.page * size;\n    const slice = state.visible.slice(start, start + size);\n\n    const allSel = state.visible.length > 0 && state.visible.every((e) => state.selected.has(e.uid));\n    $('thead').innerHTML =\n      `\u003ctr>\u003cth>\u003cinput type=\"checkbox\" id=\"headSel\" title=\"Select all filtered\"${allSel ? ' checked' : ''}>\u003c/th>\u003cth>#\u003c/th>` +\n      cols.map((c) => `\u003cth>${escHtml(c.label)}\u003c/th>`).join('') +\n      '\u003cth>Row\u003c/th>\u003c/tr>';\n\n    $('tbody').innerHTML = slice\n      .map((e, i) => {\n        const a = parseAttrs(e.extinf);\n        const sel = state.selected.has(e.uid);\n        const cells = cols\n          .map((c) => {\n            const value = c.key === '@title' ? e.title : c.key === '@url' ? e.url : a[c.key] || '';\n            return `\u003ctd>\u003cinput type=\"text\" data-f=\"${c.key}\" value=\"${escHtml(value)}\" style=\"min-width:${c.w}px\" spellcheck=\"false\">\u003c/td>`;\n          })\n          .join('');\n        return (\n          `\u003ctr data-uid=\"${e.uid}\"${sel ? ' class=\"sel\"' : ''}>` +\n          `\u003ctd>\u003cinput type=\"checkbox\" class=\"rowsel\"${sel ? ' checked' : ''}>\u003c/td>\u003ctd class=\"idx\">${start + i + 1}\u003c/td>${cells}` +\n          '\u003ctd class=\"acts\">' +\n          '\u003cbutton class=\"rowbtn white\" data-act=\"up\" title=\"Move up\">&uarr;\u003c/button>' +\n          '\u003cbutton class=\"rowbtn white\" data-act=\"down\" title=\"Move down\">&darr;\u003c/button>' +\n          '\u003cbutton class=\"rowbtn white\" data-act=\"dup\" title=\"Duplicate\">+\u003c/button>' +\n          '\u003cbutton class=\"rowbtn red\" data-act=\"del\" title=\"Delete\">&times;\u003c/button>' +\n          '\u003c/td>\u003c/tr>'\n        );\n      })\n      .join('');\n\n    $('pageInfo').textContent = `Page ${state.page + 1} / ${pages}`;\n    $('firstPg').disabled = $('prevPg').disabled = state.page === 0;\n    $('lastPg').disabled = $('nextPg').disabled = state.page >= pages - 1;\n    updateCounts();\n  }\n\n  function updateCounts() {\n    const s = state.selected.size;\n    say(`${state.entries.length} entries, ${state.visible.length} shown, ${s} selected.`);\n  }\n\n  function refreshAll(resetPage) {\n    applyFilter(resetPage);\n    renderTable();\n  }\n\n  /* ============================================================\n   ROW EVENTS\n   ============================================================ */\n  const byUid = (uid) => state.entries.find((e) => e.uid === uid);\n\n  $('tbody').addEventListener('change', (ev) => {\n    const tr = ev.target.closest('tr');\n    if (!tr) return;\n    const entry = byUid(Number(tr.dataset.uid));\n    if (!entry) return;\n\n    if (ev.target.classList.contains('rowsel')) {\n      if (ev.target.checked) state.selected.add(entry.uid);\n      else state.selected.delete(entry.uid);\n      tr.classList.toggle('sel', ev.target.checked);\n      const head = $('headSel');\n      if (head) head.checked = state.visible.length > 0 && state.visible.every((e) => state.selected.has(e.uid));\n      updateCounts();\n      return;\n    }\n\n    const field = ev.target.dataset.f;\n    if (!field) return;\n    pushUndo();\n    setField(entry, field, ev.target.value);\n    if (field === 'group-title') refreshGroups();\n  });\n\n  $('tbody').addEventListener('click', (ev) => {\n    const btn = ev.target.closest('button[data-act]');\n    if (!btn) return;\n    const uid = Number(btn.closest('tr').dataset.uid);\n    const act = btn.dataset.act;\n    const index = state.entries.findIndex((e) => e.uid === uid);\n    if (index \u003c 0) return;\n\n    if (act === 'del') {\n      pushUndo();\n      state.entries.splice(index, 1);\n      state.selected.delete(uid);\n    } else if (act === 'dup') {\n      pushUndo();\n      state.entries.splice(index + 1, 0, mk(state.entries[index]));\n    } else {\n      const vi = state.visible.findIndex((e) => e.uid === uid);\n      const target = state.visible[vi + (act === 'up' ? -1 : 1)];\n      if (!target) return;\n      pushUndo();\n      const [item] = state.entries.splice(index, 1);\n      let to = state.entries.findIndex((e) => e.uid === target.uid);\n      if (act === 'down') to++;\n      state.entries.splice(to, 0, item);\n    }\n    refreshGroups();\n    refreshAll(false);\n  });\n\n  $('thead').addEventListener('change', (ev) => {\n    if (ev.target.id !== 'headSel') return;\n    state.visible.forEach((e) => { if (ev.target.checked) state.selected.add(e.uid); else state.selected.delete(e.uid); });\n    renderTable();\n  });\n\n  /* ============================================================\n   TOOLBAR + PAGER\n   ============================================================ */\n  $('search').addEventListener('input', () => refreshAll(true));\n  $('groupSel').addEventListener('change', () => refreshAll(true));\n  $('showSel').addEventListener('change', () => refreshAll(true));\n  $('pageSize').addEventListener('change', () => refreshAll(true));\n\n  $('selAllBtn').addEventListener('click', () => { state.visible.forEach((e) => state.selected.add(e.uid)); renderTable(); });\n  $('selNoneBtn').addEventListener('click', () => { state.selected.clear(); renderTable(); });\n  $('selInvBtn').addEventListener('click', () => {\n    state.visible.forEach((e) => { if (state.selected.has(e.uid)) state.selected.delete(e.uid); else state.selected.add(e.uid); });\n    renderTable();\n  });\n\n  $('delSelBtn').addEventListener('click', () => {\n    const n = state.selected.size;\n    if (!n) return alert('No rows selected.');\n    if (!confirm(`Delete ${n} selected row(s)? You can undo this.`)) return;\n    pushUndo();\n    state.entries = state.entries.filter((e) => !state.selected.has(e.uid));\n    state.selected.clear();\n    refreshGroups();\n    refreshAll(false);\n    say(`Deleted ${n} row(s).`);\n  });\n\n  $('addBtn').addEventListener('click', () => {\n    pushUndo();\n    const entry = mk({ extinf: '#EXTINF:-1,New station', extra: [], url: 'http://', title: 'New station' });\n    state.entries.push(entry);\n    state.selected.clear();\n    state.selected.add(entry.uid);\n    $('search').value = '';\n    $('groupSel').value = '';\n    $('showSel').value = 'all';\n    applyFilter(false);\n    state.page = Math.max(0, Math.ceil(state.visible.length / Number($('pageSize').value)) - 1);\n    renderTable();\n    const rows = $('tbody').querySelectorAll('tr');\n    const last = rows[rows.length - 1];\n    if (last) { last.scrollIntoView({ block: 'center' }); const inp = last.querySelector('input[type=\"text\"]'); if (inp) inp.select(); }\n  });\n\n  $('undoBtn').addEventListener('click', undo);\n  $('firstPg').addEventListener('click', () => { state.page = 0; renderTable(); });\n  $('prevPg').addEventListener('click', () => { state.page--; renderTable(); });\n  $('nextPg').addEventListener('click', () => { state.page++; renderTable(); });\n  $('lastPg').addEventListener('click', () => { state.page = 1e9; renderTable(); });\n\n  /* ============================================================\n   COLUMNS + FIELD SELECTS\n   ============================================================ */\n  function buildColumnChecks() {\n    COLS.forEach((c, i) => {\n      const label = document.createElement('label');\n      label.className = 'setting-item check';\n      const cb = document.createElement('input');\n      cb.type = 'checkbox';\n      cb.checked = c.on;\n      cb.addEventListener('change', () => { c.on = cb.checked; renderTable(); });\n      label.append(cb, document.createTextNode(c.label));\n      $('colChecks').appendChild(label);\n      label.style.marginRight = '14px';\n      void i;\n    });\n  }\n\n  function fillFieldSelect(sel, { attrsOnly = false } = {}) {\n    COLS.filter((c) => !attrsOnly || !c.key.startsWith('@')).forEach((c) => {\n      const o = document.createElement('option');\n      o.value = c.key;\n      o.textContent = c.key.startsWith('@') ? c.label : c.key;\n      sel.appendChild(o);\n    });\n  }\n\n  /* ============================================================\n   BULK TOOLS\n   ============================================================ */\n  function scopeEntries() {\n    const s = $('scope').value;\n    if (s === 'selected') return state.entries.filter((e) => state.selected.has(e.uid));\n    if (s === 'filtered') return state.visible.slice();\n    return state.entries.slice();\n  }\n\n  function finishBulk(message) {\n    refreshGroups();\n    refreshAll(false);\n    say(message);\n  }\n\n  $('setBtn').addEventListener('click', () => {\n    const field = $('setCustom').value.trim() || $('setField').value;\n    if (/[\\s\"=,]/.test(field)) return alert('Attribute names cannot contain spaces, quotes, \"=\" or commas.');\n    const targets = scopeEntries();\n    if (!targets.length) return alert('Nothing in scope. Select rows or change the scope.');\n    pushUndo();\n    const value = $('setValue').value;\n    targets.forEach((e) => setField(e, field, value));\n    finishBulk(`Set ${field} on ${targets.length} row(s).`);\n  });\n\n  $('unsetBtn').addEventListener('click', () => {\n    const field = $('setCustom').value.trim() || $('setField').value;\n    if (field.startsWith('@')) return alert('Only attributes can be removed, not the title or URL.');\n    const targets = scopeEntries();\n    if (!targets.length) return alert('Nothing in scope. Select rows or change the scope.');\n    pushUndo();\n    targets.forEach((e) => { e.extinf = removeAttr(e.extinf, field); });\n    finishBulk(`Removed ${field} from ${targets.length} row(s).`);\n  });\n\n  $('frBtn').addEventListener('click', () => {\n    const find = $('frFind').value;\n    if (!find) return alert('Enter something to find.');\n    const field = $('frField').value;\n    let re;\n    try {\n      re = new RegExp($('frRegex').checked ? find : escRe(find), $('frCase').checked ? 'gi' : 'g');\n    } catch (error) {\n      return alert(`Bad regular expression: ${error.message}`);\n    }\n    const targets = scopeEntries();\n    if (!targets.length) return alert('Nothing in scope. Select rows or change the scope.');\n    const repl = $('frRepl').value;\n    const useFn = !$('frRegex').checked;\n    pushUndo();\n    let changed = 0;\n    targets.forEach((e) => {\n      const before = getField(e, field);\n      const after = before.replace(re, useFn ? () => repl : repl);\n      if (after !== before) {\n        setField(e, field, after);\n        changed++;\n      }\n    });\n    finishBulk(`Replaced in ${changed} of ${targets.length} row(s).`);\n  });\n\n  $('trimBtn').addEventListener('click', () => {\n    pushUndo();\n    let changed = 0;\n    state.entries.forEach((e) => {\n      const t = e.title.replace(/\\s+/g, ' ').trim();\n      if (t !== e.title) { setField(e, '@title', t); changed++; }\n    });\n    finishBulk(`Trimmed ${changed} title(s).`);\n  });\n\n  $('emptyBtn').addEventListener('click', () => {\n    pushUndo();\n    const before = state.entries.length;\n    state.entries = state.entries.filter((e) => e.url.trim() && e.url.trim() !== 'http://');\n    finishBulk(`Dropped ${before - state.entries.length} entr${before - state.entries.length === 1 ? 'y' : 'ies'} without a URL.`);\n  });\n\n  $('dedupBtn').addEventListener('click', () => {\n    pushUndo();\n    const seen = new Set();\n    const before = state.entries.length;\n    state.entries = state.entries.filter((e) => {\n      const k = e.url.trim().toLowerCase().replace(/\\/+$/, '');\n      if (!k) return true;\n      if (seen.has(k)) return false;\n      seen.add(k);\n      return true;\n    });\n    finishBulk(`Dropped ${before - state.entries.length} duplicate URL(s), kept the first of each.`);\n  });\n\n  $('sortBtn').addEventListener('click', () => {\n    pushUndo();\n    const field = $('sortField').value;\n    const collator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });\n    state.entries.sort((a, b) => collator.compare(getField(a, field), getField(b, field)));\n    finishBulk(`Sorted all rows by ${field.startsWith('@') ? field.slice(1) : field}.`);\n  });\n\n  /* ============================================================\n   EXPORT\n   ============================================================ */\n  function buildText() {\n    const lines = [state.head.extm3u, ...state.head.header];\n    state.entries.forEach((e) => lines.push(...renderEntry(e)));\n    return lines.join('\\n') + '\\n';\n  }\n\n  function exportName() {\n    const m = /\\.(m3u8?)$/i.exec(state.name);\n    const stem = m ? state.name.slice(0, -m[0].length) : state.name;\n    return `${stem}_edited.${m ? m[1].toLowerCase() : 'm3u'}`;\n  }\n\n  $('downloadBtn').addEventListener('click', () => {\n    downloadText(buildText(), 'audio/x-mpegurl', exportName());\n    state.dirty = false;\n  });\n\n  $('copyBtn').addEventListener('click', async () => {\n    const text = buildText();\n    try {\n      await navigator.clipboard.writeText(text);\n      say(`Copied ${state.entries.length} entries to the clipboard.`);\n    } catch {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      ta.remove();\n      say(`Copied ${state.entries.length} entries to the clipboard.`);\n    }\n  });\n\n  window.addEventListener('beforeunload', (ev) => {\n    if (state.dirty) {\n      ev.preventDefault();\n      ev.returnValue = '';\n    }\n  });\n\n  /* ============================================================\n   INIT\n   ============================================================ */\n  $('fileLoad').addEventListener('click', loadFile);\n  $('urlLoad').addEventListener('click', loadUrl);\n  $('textLoad').addEventListener('click', loadPasted);\n  buildColumnChecks();\n  fillFieldSelect($('setField'), { attrsOnly: true });\n  fillFieldSelect($('frField'));\n  fillFieldSelect($('sortField'));\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"health",label:"Track link health",tip:"Check over time which streams die, and clean them out",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Health Monitor\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody {\n  margin: 0;\n  padding: 24px 10px 60px;\n  font-family: var(--mono);\n  font-size: 14px;\n  background: var(--concrete);\n  color: var(--text);\n}\nh1 {\n  margin: -20px -20px 18px;\n  padding: 8px 14px;\n  background: var(--yellow);\n  color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow);\n  font-size: 1.9em;\n  font-weight: 900;\n  line-height: 1.25;\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n  text-align: left;\n}\n.container {\n  position: relative;\n  width: 660px;\n  max-width: 100%;\n  margin: 0 auto;\n  padding: 20px;\n  background: var(--panel);\n  border: var(--bw) solid var(--line);\n  box-shadow: 10px 10px 0 var(--ink);\n  text-align: left;\n}\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1;\n  min-width: 0;\n  margin: 5px 0;\n  padding: 10px;\n  border: var(--bw) solid var(--line);\n  border-radius: 0;\n  background: var(--ink);\n  color: var(--text);\n  font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 3px solid var(--ink);\n  border-radius: 0;\n  background: var(--orange);\n  color: var(--ink);\n  font: inherit;\n  font-weight: 900;\n  -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\n/* Buttons: one colour per role, set through --c */\nbutton {\n  --c: var(--orange);\n  flex: none;\n  width: 130px;\n  height: 48px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 0 6px;\n  border: var(--bw) solid var(--ink);\n  border-radius: 0;\n  background: var(--c);\n  color: var(--ink);\n  font: inherit;\n  font-size: 0.95em;\n  font-weight: 900;\n  -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em;\n  line-height: 1.15;\n  text-align: center;\n  text-transform: uppercase;\n  box-shadow: 3px 3px 0 var(--text);\n  cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n\n#fileCheckButton, #fileButton { --c: var(--orange); }\n#urlCheckButton, #urlButton { --c: var(--pink); }\n#textCheckButton, #textButton { --c: var(--violet); }\n.pause-button { display: none; --c: var(--blue); }\n.cancel-button { display: none; --c: var(--red); }\n\n#downloadButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 10px auto;\n  --c: var(--green);\n}\n#downloadReportButton, #downloadDeadButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 0 auto 10px auto;\n  --c: var(--yellow);\n}\n#viewImagesButton {\n  display: none;\n  width: 260px;\n  height: 48px;\n  margin: 0 auto 10px auto;\n  --c: var(--line);\n}\n.download-row { display: flex; flex-direction: column; align-items: center; gap: 5px; }\n\n/* Output area */\n.output-wrapper {\n  position: relative;\n  width: 100%;\n  height: 110px;\n  min-width: 0;\n  min-height: 80px;\n  max-width: 100%;\n  max-height: 80vh;\n  margin: 5px 0 10px 0;\n  border: var(--bw) solid var(--line);\n  background: var(--ink);\n  resize: vertical;\n  overflow: auto;\n}\n.output-wrapper textarea#output {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  min-width: 100%;\n  min-height: 100%;\n  margin: 0;\n  padding: 0 10px;\n  border: none;\n  background: transparent;\n  color: var(--text);\n  font-size: 0.85em;\n  resize: none;\n  overflow: auto;\n  display: block;\n}\n#summaryLine {\n  min-height: 1em;\n  margin: 5px 0 10px 0;\n  font-size: 0.85em;\n  color: var(--muted);\n  text-align: left;\n}\n\n/* Advanced settings panel */\n.advanced-settings {\n  margin: 5px 0 10px 0;\n  border: var(--bw) solid var(--line);\n  background: var(--ink);\n  text-align: left;\n}\n.advanced-settings summary {\n  padding: 10px;\n  cursor: pointer;\n  user-select: none;\n  font-weight: 800;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n.advanced-settings summary:hover { background: #222222; }\n.advanced-settings .settings-grid {\n  padding: 10px;\n  border-top: var(--bw) solid var(--line);\n  background: var(--panel);\n}\n.advanced-settings .settings-grid { display: flex; align-items: center; gap: 25px; }\n.settings-column { display: flex; }\n.numeric-column { gap: 10px; }\n.checkbox-column { flex-direction: column; gap: 8px; }\n.advanced-settings .setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.advanced-settings .setting-item.checkbox-item { flex-direction: row; align-items: center; gap: 6px; }\n.advanced-settings input[type='number'] { width: 80px; flex-grow: 0; margin: 3px 0 0 0; padding: 6px; }\n.advanced-settings input[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.output-wrapper p#currentChecking {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  min-width: 100%;\n  min-height: 100%;\n  margin: 0;\n  padding: 10px;\n  border: none;\n  background: var(--ink);\n  text-align: left;\n  white-space: normal;\n  overflow: hidden;\n  display: none;\n}\n.output-wrapper p#currentChecking .checking-line {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  max-width: 100%;\n}\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n  .settings .input-group { flex-wrap: nowrap; }\n  .settings .input-group > select { flex: 1 1 auto; }\n}\n\n/* Health Monitor additions */\n.advanced-settings .settings-grid { flex-wrap: wrap; }\n.container.mid { width: 960px; }\n#downloadHistoryButton { display: none; width: 260px; height: 48px; margin: 0 auto 10px auto; --c: var(--blue); }\n#downloadButton, #downloadReportButton { margin-bottom: 10px; }\n.mini { display: inline-flex; width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.code-box { display: block; width: 100%; height: 150px; margin: 6px 0; padding: 8px; font-size: 0.78em; resize: vertical; white-space: pre; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); } .green { --c: var(--green); }\n.yellow { --c: var(--yellow); } .blue { --c: var(--blue); } .red { --c: var(--red); } .white { --c: var(--line); }\n.hint { font-size: 0.82em; color: var(--muted); margin: 4px 0; }\n.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 12px 0 4px; }\n.toolbar input, .toolbar select { margin: 0; padding: 7px 8px; border-width: 3px; }\n.toolbar input[type='search'] { flex: 1 1 220px; }\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 62vh; margin-top: 8px; }\ntable.grid { border-collapse: collapse; width: 100%; }\n.grid th { position: sticky; top: 0; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 4px 8px; border-bottom: 2px solid #333; vertical-align: top; }\n.grid td.num { text-align: right; white-space: nowrap; color: var(--muted); }\n.grid td.nm small { display: block; color: var(--muted); font-size: 0.75em; word-break: break-all; }\n.badge { display: inline-block; padding: 1px 6px; font-size: 0.72em; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); }\n.b-up { background: var(--green); } .b-down { background: var(--red); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container mid\">\n\u003ch1>M3U Health Monitor\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8\">\n\u003cbutton id=\"fileCheckButton\">Check local file\u003c/button>\n\u003cbutton id=\"filePauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"fileCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlCheckButton\">Check Online Link\u003c/button>\n\u003cbutton id=\"urlPauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"urlCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textCheckButton\">Check Pasted streams\u003c/button>\n\u003cbutton id=\"textPauseButton\" class=\"pause-button\">Pause\u003c/button>\n\u003cbutton id=\"textCancelButton\" class=\"cancel-button\">Cancel\u003c/button>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Advanced settings (concurrency, timeout, removal rule)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-column numeric-column\">\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"concurrencyInput\">Concurrency\u003c/label>\n\u003cinput type=\"number\" id=\"concurrencyInput\" min=\"1\" max=\"50\" value=\"12\">\n\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"timeoutInput\">Timeout (ms)\u003c/label>\n\u003cinput type=\"number\" id=\"timeoutInput\" min=\"1000\" max=\"30000\" step=\"500\" value=\"7000\">\n\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"removeAfterInput\">Remove after N failed runs in a row\u003c/label>\n\u003cinput type=\"number\" id=\"removeAfterInput\" min=\"1\" max=\"100\" value=\"3\">\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"advanced-settings\" open>\n\u003csummary>History (kept in this browser)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-column\">\n\u003cp class=\"hint\" id=\"histInfo\">\u003c/p>\n\u003cdiv class=\"btn-row\">\n\u003cinput type=\"file\" id=\"historyFile\" accept=\".json\" style=\"flex:1 1 240px;margin:0;padding:6px\">\n\u003cbutton id=\"historyReset\" class=\"mini red\">Reset history\u003c/button>\n\u003c/div>\n\u003cp class=\"hint\">Pick a history .json (for example the one a scheduled GitHub Action committed) to load it here. Export it from the button below the table.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Run it on a schedule (GitHub Action)\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-column\" style=\"min-width:100%\">\n\u003cdiv class=\"col-title\">1. health-monitor.js (zero dependencies, Node 16+)\u003c/div>\n\u003ctextarea id=\"nodeBox\" class=\"code-box\" readonly spellcheck=\"false\">\u003c/textarea>\n\u003cdiv class=\"btn-row\">\u003cbutton id=\"nodeCopy\" class=\"mini yellow\">Copy\u003c/button>\u003cbutton id=\"nodeSave\" class=\"mini green\">Save file\u003c/button>\u003c/div>\n\u003cdiv class=\"col-title\" style=\"margin-top:12px\">2. .github/workflows/health.yml\u003c/div>\n\u003ctextarea id=\"flowBox\" class=\"code-box\" readonly spellcheck=\"false\">\u003c/textarea>\n\u003cdiv class=\"btn-row\">\u003cbutton id=\"flowCopy\" class=\"mini yellow\">Copy\u003c/button>\u003cbutton id=\"flowSave\" class=\"mini green\">Save file\u003c/button>\u003c/div>\n\u003cp class=\"hint\">Put health-monitor.js in the repo root and the workflow in .github/workflows/. Every run adds one line to health/history.json and rewrites health/report.md. Load that history.json above to see uptime and removal candidates here. You can also run it by hand: node health-monitor.js . \u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"output-wrapper\">\n\u003ctextarea id=\"output\" rows=\"8\" readonly>\u003c/textarea>\n\u003cp id=\"currentChecking\">\u003c/p>\n\u003c/div>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"results\" style=\"display:none\">\n\u003cdiv class=\"toolbar\">\n\u003cinput type=\"search\" id=\"searchInput\" placeholder=\"Filter by title or URL...\">\n\u003cselect id=\"filterSel\">\n\u003coption value=\"all\">Show: all\u003c/option>\n\u003coption value=\"down\">Down now\u003c/option>\n\u003coption value=\"flaky\">Flaky (under 90% uptime)\u003c/option>\n\u003coption value=\"remove\">Failed N runs in a row\u0
