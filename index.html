03c/option>\n\u003c/select>\n\u003c/div>\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>Now\u003c/th>\u003cth>Station\u003c/th>\u003cth>Uptime\u003c/th>\u003cth>Failed in a row\u003c/th>\u003cth>Last OK\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"download-row\" style=\"margin-top:14px\">\n\u003cbutton id=\"downloadButton\">Download Cleaned Playlist\u003c/button>\n\u003cbutton id=\"downloadReportButton\">Download Health Report\u003c/button>\n\u003cbutton id=\"downloadHistoryButton\">Download History (.json)\u003c/button>\n\u003c/div>\n\u003ca id=\"downloadLink\" style=\"display:none\">\u003c/a>\n\u003ca id=\"downloadReportLink\" style=\"display:none\">\u003c/a>\n\u003ca id=\"downloadHistoryLink\" style=\"display:none\">\u003c/a>\n\n\u003c/div>\n\n\u003cscript type=\"text/plain\" id=\"nodeSrc\">#!/usr/bin/env node\n'use strict';\n/*\n * health-monitor.js - zero-dependency stream health checker (Node 16+)\n *\n *   node health-monitor.js \u003cfile-or-folder> [more...] [options]\n *\n *   --history \u003cfile>     history json, same format as M3U-Health-Monitor.html (default health/history.json)\n *   --report \u003cfile>      markdown report (default health/report.md)\n *   --concurrency \u003cn>    parallel checks (default 20)\n *   --timeout \u003cms>       per stream (default 8000)\n *   --keep \u003cn>           runs to remember (default 90)\n */\nconst fs = require('fs');\nconst path = require('path');\nconst http = require('http');\nconst https = require('https');\n\nconst opt = { history: 'health/history.json', report: 'health/report.md', concurrency: 20, timeout: 8000, keep: 90 };\nconst inputs = [];\nconst argv = process.argv.slice(2);\nfor (let i = 0; i \u003c argv.length; i++) {\n  const a = argv[i];\n  if (a.startsWith('--')) {\n    const k = a.slice(2);\n    if (!(k in opt)) { console.error(`Unknown option ${a}`); process.exit(2); }\n    const v = argv[++i];\n    opt[k] = typeof opt[k] === 'number' ? Number(v) : v;\n  } else inputs.push(a);\n}\nif (!inputs.length) { console.error('Usage: node health-monitor.js \u003cfile-or-folder> [more...] [options]'); process.exit(2); }\n\n/* ---------- playlists ---------- */\nfunction collect(p, out) {\n  const st = fs.statSync(p);\n  if (st.isDirectory()) {\n    for (const name of fs.readdirSync(p)) {\n      if (['node_modules', '.git', 'health'].includes(name)) continue;\n      collect(path.join(p, name), out);\n    }\n  } else if (/\\.m3u8?$/i.test(p)) out.push(p);\n}\n\nfunction titleOf(line) {\n  let q = false;\n  for (let i = 0; i \u003c line.length; i++) {\n    if (line[i] === '\"') q = !q;\n    else if (line[i] === ',' && !q) return line.slice(i + 1).trim();\n  }\n  return '';\n}\n\nconst keyOf = (u) => u.trim().toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/;?$/, '');\n\nconst files = [];\ninputs.forEach((p) => collect(p, files));\nconst stations = new Map();\nfor (const f of files) {\n  let title = '';\n  for (const raw of fs.readFileSync(f, 'utf8').replace(/^\\uFEFF/, '').split(/\\r?\\n/)) {\n    const line = raw.trim();\n    if (!line) continue;\n    if (/^#EXTINF/i.test(line)) { title = titleOf(line); continue; }\n    if (line.startsWith('#')) continue;\n    if (/^https?:\\/\\//i.test(line)) {\n      const k = keyOf(line);\n      if (!stations.has(k)) stations.set(k, { k, t: title, u: line });\n    }\n    title = '';\n  }\n}\nconsole.log(`${files.length} playlist file(s), ${stations.size} unique http(s) streams`);\n\n/* ---------- probe (http modules, so Shoutcast \"ICY 200 OK\" replies are accepted) ---------- */\nfunction probe(url, timeout, redirects = 5) {\n  return new Promise((resolve) => {\n    let u;\n    try { u = new URL(url); } catch { return resolve({ ok: false, reason: 'bad url' }); }\n    const lib = u.protocol === 'https:' ? https : http;\n    let req;\n    let settled = false;\n    const done = (r) => {\n      if (settled) return;\n      settled = true;\n      clearTimeout(timer);\n      if (req) req.destroy();\n      resolve(r);\n    };\n    const timer = setTimeout(() => done({ ok: false, reason: 'timeout' }), timeout);\n    req = lib.get(u, { headers: { Range: 'bytes=0-1', 'Icy-MetaData': '0', 'User-Agent': 'Mozilla/5.0 (health-monitor)' }, insecureHTTPParser: true }, (res) => {\n      const s = res.statusCode;\n      if (s >= 300 && s \u003c 400 && res.headers.location && redirects > 0) {\n        const next = new URL(res.headers.location, u).href;\n        settled = true;\n        clearTimeout(timer);\n        req.destroy();\n        return resolve(probe(next, timeout, redirects - 1));\n      }\n      done(s >= 200 && s \u003c 300 ? { ok: true } : { ok: false, reason: `HTTP ${s}` });\n    });\n    req.on('error', (e) => done({ ok: false, reason: e.code || e.message }));\n  });\n}\n\nasync function pool(items, n, worker) {\n  let i = 0;\n  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {\n    while (i \u003c items.length) await worker(items[i++]);\n  }));\n}\n\n/* ---------- history ---------- */\nlet history = { version: 1, stations: [], runs: [] };\ntry {\n  const h = JSON.parse(fs.readFileSync(opt.history, 'utf8'));\n  if (h && h.version === 1) history = h;\n} catch { /* first run */ }\n\n(async () => {\n  const list = [...stations.values()];\n  const results = new Map();\n  let done = 0;\n  await pool(list, opt.concurrency, async (s) => {\n    results.set(s.k, await probe(s.u, opt.timeout));\n    if (++done % 200 === 0) console.log(`  ${done}/${list.length}`);\n  });\n\n  const idx = new Map(history.stations.map((s, i) => [s.k, i]));\n  list.forEach((s) => {\n    const i = idx.get(s.k);\n    if (i === undefined) { idx.set(s.k, history.stations.length); history.stations.push(s); }\n    else { history.stations[i].t = s.t; history.stations[i].u = s.u; }\n  });\n  const chars = new Array(history.stations.length).fill('-');\n  list.forEach((s) => { chars[idx.get(s.k)] = results.get(s.k).ok ? '1' : '0'; });\n  history.runs.push({ t: new Date().toISOString(), r: chars.join('') });\n  if (history.runs.length > opt.keep) history.runs.splice(0, history.runs.length - opt.keep);\n\n  const keep = [];\n  history.stations.forEach((_, i) => { if (history.runs.some((r) => (r.r[i] || '-') !== '-')) keep.push(i); });\n  if (keep.length !== history.stations.length) {\n    history.stations = keep.map((i) => history.stations[i]);\n    history.runs.forEach((r) => { r.r = keep.map((i) => r.r[i] || '-').join(''); });\n  }\n\n  /* ---------- report ---------- */\n  const pos = new Map(history.stations.map((s, i) => [s.k, i]));\n  const down = [];\n  list.forEach((s) => {\n    if (results.get(s.k).ok) return;\n    const i = pos.get(s.k);\n    let up = 0, bad = 0, streak = 0, counting = true, lastOk = '';\n    for (let r = history.runs.length - 1; r >= 0; r--) {\n      const ch = history.runs[r].r[i] || '-';\n      if (ch === '-') continue;\n      if (ch === '1') { up++; counting = false; if (!lastOk) lastOk = history.runs[r].t.slice(0, 10); }\n      else { bad++; if (counting) streak++; }\n    }\n    down.push({ s, streak, up, bad, lastOk, reason: results.get(s.k).reason });\n  });\n  down.sort((a, b) => b.streak - a.streak || a.s.t.localeCompare(b.s.t));\n\n  const upCount = list.length - down.length;\n  const md = [\n    `# Stream health (${new Date().toISOString().slice(0, 10)})`, '',\n    `Run ${history.runs.length}: **${upCount} up**, **${down.length} down** of ${list.length} streams.`, '',\n    '| Station | Failed in a row | Uptime | Last OK | Reason |', '|---|---|---|---|---|',\n    ...down.map((d) => `| ${d.s.t.replace(/\\|/g, '/') || '(no title)'} | ${d.streak} | ${Math.round((d.up / Math.max(1, d.up + d.bad)) * 100)}% | ${d.lastOk || 'never'} | ${d.reason} |`),\n    '',\n  ].join('\\n');\n\n  fs.mkdirSync(path.dirname(opt.history), { recursive: true });\n  fs.mkdirSync(path.dirname(opt.report), { recursive: true });\n  fs.writeFileSync(opt.history, JSON.stringify(history));\n  fs.writeFileSync(opt.report, md);\n  console.log(`Run ${history.runs.length}: ${upCount} up, ${down.length} down. Wrote ${opt.history} and ${opt.report}`);\n})();\n\u003c/script>\n\u003cscript type=\"text/plain\" id=\"flowSrc\">name: Stream health\n\non:\n  schedule:\n    - cron: '17 3 * * 1'   # every Monday, 03:17 UTC\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\njobs:\n  health:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - name: Check streams\n        run: node health-monitor.js . --history health/history.json --report health/report.md\n      - name: Commit results\n        run: |\n          git config user.name \"github-actions\"\n          git config user.email \"actions@github.com\"\n          git add health\n          git diff --cached --quiet || git commit -m \"Stream health report\"\n          git push\n\u003c/script>\n\n\u003cscript>\n(() => {\n  'use strict';\n  /* ============================================================\n   SHARED BASE\n   Identical in M3U-link-checker, M3U-Metadata-embedder and\n   m3u-logo-embedder. A tool only has to provide:\n     LOCKED_INPUT_IDS, resetOutput(), processLinks(text, type, sourceName)\n   ============================================================ */\n\n  const $ = (id) => document.getElementById(id);\n  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\n  /* one run at a time: the other start buttons are disabled while it is going */\n  const run = { cancelled: false, paused: false };\n\n  /* AbortControllers of every request that is currently in flight */\n  const inflight = new Set();\n\n  const progress = { done: 0, total: 0 };\n\n  function beginRun() {\n    run.cancelled = false;\n    run.paused = false;\n  }\n\n  /*\n   * Starts a tracked request with a timeout. Call finish() when done:\n   * it also aborts, which closes a response body that was not read to\n   * the end (a live radio stream would otherwise keep downloading).\n   */\n  function startRequest(timeoutMs) {\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), timeoutMs);\n\n    inflight.add(controller);\n\n    return {\n      signal: controller.signal,\n      finish() {\n        clearTimeout(timer);\n        inflight.delete(controller);\n        controller.abort();\n      },\n    };\n  }\n\n  async function waitWhilePaused() {\n    while (run.paused && !run.cancelled) {\n      await sleep(200);\n    }\n  }\n\n  /* runs worker(item) for every item, at most `concurrency` at a time */\n  async function runPool(items, concurrency, worker) {\n    const active = new Set();\n\n    for (const item of items) {\n      if (run.cancelled) {\n        break;\n      }\n\n      const task = (async () => {\n        try {\n          await worker(item);\n        } catch (error) {\n          console.error(error);\n        } finally {\n          active.delete(task);\n        }\n      })();\n\n      active.add(task);\n\n      if (active.size >= concurrency) {\n        await Promise.race(active);\n      }\n    }\n\n    await Promise.allSettled(active);\n  }\n\n  /* ---------------- settings ---------------- */\n\n  /* default, min and max come from the input element itself */\n  function readNumber(id) {\n    const el = $(id);\n    const n = parseInt(el.value, 10);\n    const value = Number.isFinite(n) ? n : Number(el.defaultValue);\n\n    return Math.min(Number(el.max), Math.max(Number(el.min), value));\n  }\n\n  /* ---------------- UI state ---------------- */\n\n  function setCurrentChecking(message) {\n    const el = $('currentChecking');\n\n    el.textContent = '';\n\n    String(message)\n      .split('\\n')\n      .forEach((line) => {\n        const lineEl = document.createElement('div');\n\n        lineEl.className = 'checking-line';\n        lineEl.textContent = line;\n        lineEl.title = line;\n\n        el.appendChild(lineEl);\n      });\n  }\n\n  function setDisplayStates(checkingInProgress) {\n    $('output').style.display = checkingInProgress ? 'none' : 'block';\n    $('currentChecking').style.display = checkingInProgress ? 'block' : 'none';\n  }\n\n  function toggleButtons(type, checking) {\n    $(`${type}CheckButton`).style.display = checking ? 'none' : 'flex';\n    $(`${type}CancelButton`).style.display = checking ? 'flex' : 'none';\n\n    const pauseButton = $(`${type}PauseButton`);\n\n    pauseButton.style.display = checking ? 'flex' : 'none';\n\n    if (checking) {\n      pauseButton.textContent = 'Pause';\n    }\n\n    setDisplayStates(checking);\n\n    ['file', 'url', 'text']\n      .filter((t) => t !== type)\n      .forEach((other) => {\n        $(`${other}CheckButton`).disabled = checking;\n      });\n\n    LOCKED_INPUT_IDS.forEach((id) => {\n      $(id).disabled = checking;\n    });\n  }\n\n  function showProgress(heading, title, url, summary) {\n    progress.done++;\n\n    setCurrentChecking(\n      `${heading} ${progress.done} of ${progress.total}:` +\n        (title ? `\\n${title}` : '') +\n        `\\n${url}`,\n    );\n\n    $('summaryLine').textContent = summary(progress.done, progress.total);\n  }\n\n  /* ---------------- downloads ---------------- */\n\n  function hideDownload(buttonId) {\n    $(buttonId).style.display = 'none';\n  }\n\n  /* puts `text` behind a hidden \u003ca> and shows its button; frees the previous blob */\n  function setDownload(buttonId, linkId, text, mime, filename) {\n    const link = $(linkId);\n\n    if (link.href.startsWith('blob:')) {\n      URL.revokeObjectURL(link.href);\n    }\n\n    link.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    link.download = filename;\n\n    $(buttonId).style.display = 'block';\n  }\n\n  function clickLink(linkId) {\n    $(linkId).click();\n  }\n\n  /* ---------------- file names ---------------- */\n\n  function sourceNameFromUrl(input) {\n    try {\n      const last = new URL(input).pathname.split('/').pop();\n\n      return (last && decodeURIComponent(last)) || 'playlist.m3u';\n    } catch {\n      return 'playlist.m3u';\n    }\n  }\n\n  /* \"my list.m3u8\" + \"_checked\" -> \"my list_checked.m3u8\"; anything else gets .m3u */\n  function outputName(sourceName, suffix) {\n    const match = /\\.(m3u8?)$/i.exec(sourceName);\n    const stem = match ? sourceName.slice(0, -match[0].length) : sourceName;\n\n    return `${stem}${suffix}.${match ? match[1].toLowerCase() : 'm3u'}`;\n  }\n\n  function reportName(sourceName, suffix, reportSuffix) {\n    return outputName(sourceName, suffix).replace(/\\.m3u8?$/i, '') + reportSuffix;\n  }\n\n  /* ============================================================\n   M3U PARSING\n   An entry is everything that belongs to one stream: its #EXTINF\n   line, any extra #-lines (#EXTGRP, #EXTVLCOPT...) and the URL.\n   ============================================================ */\n\n  /* split at the first comma that is not inside quotes */\n  function splitExtinf(line) {\n    let inQuotes = false;\n\n    for (let i = 0; i \u003c line.length; i++) {\n      const ch = line[i];\n\n      if (ch === '\"') {\n        inQuotes = !inQuotes;\n      } else if (ch === ',' && !inQuotes) {\n        return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };\n      }\n    }\n\n    return { prefix: line, title: '' };\n  }\n\n  const isHttpUrl = (s) => /^https?:\\/\\//i.test(s || '');\n\n  function parseM3U(text) {\n    const lines = text\n      .replace(/^\\uFEFF/, '')\n      .split(/\\r?\\n/)\n      .map((l) => l.trim());\n\n    let extm3u = '#EXTM3U';\n    let sawEntryOrHeader = false;\n\n    const header = [];\n    const entries = [];\n\n    let pendingExtinf = null;\n    let pendingExtra = [];\n\n    const flush = (url) => {\n      entries.push({ extinf: pendingExtinf, extra: pendingExtra, url });\n\n      pendingExtinf = null;\n      pendingExtra = [];\n    };\n\n    for (const line of lines) {\n      if (line === '') {\n        continue;\n      }\n\n      if (/^#EXTM3U/i.test(line)) {\n        /* keep attributes such as url-tvg=\"...\" from the first header line */\n        if (!sawEntryOrHeader) {\n          extm3u = line;\n        }\n\n        continue;\n      }\n\n      sawEntryOrHeader = true;\n\n      if (/^#EXTINF/i.test(line)) {\n        if (pendingExtinf) {\n          flush(null); /* EXTINF without a URL: keep it, do not lose it */\n        }\n\n        pendingExtinf = line;\n\n        continue;\n      }\n\n      if (line.startsWith('#')) {\n        if (!entries.length && !pendingExtinf) {\n          header.push(line);\n        } else {\n          pendingExtra.push(line);\n        }\n\n        continue;\n      }\n\n      flush(line);\n    }\n\n    if (pendingExtinf) {\n      flush(null);\n    }\n\n    entries.forEach((entry) => {\n      entry.title = entry.extinf ? splitExtinf(entry.extinf).title : '';\n    });\n\n    return { extm3u, header, entries };\n  }\n\n  /* the lines of one entry, optionally with a replacement #EXTINF */\n  function renderEntry(entry, extinfOverride) {\n    const out = [];\n\n    if (entry.extinf) {\n      out.push(extinfOverride || entry.extinf);\n    }\n\n    out.push(...entry.extra);\n\n    if (entry.url) {\n      out.push(entry.url);\n    }\n\n    return out;\n  }\n\n  /* ============================================================\n   ONLINE PLAYLIST FETCH\n   ============================================================ */\n\n  /* github.com/.../raw/... redirects without CORS headers; go straight to raw.githubusercontent.com */\n  function normalizeOnlineM3UUrl(inputUrl) {\n    let url;\n\n    try {\n      url = new URL(inputUrl);\n    } catch {\n      throw new Error('Invalid URL.');\n    }\n\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') {\n      throw new Error('Only HTTP and HTTPS URLs are supported.');\n    }\n\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n\n      if (parts.length >= 5 && parts[2].toLowerCase() === 'raw') {\n        const [owner, repo, ...rest] = parts.filter((_, i) => i !== 2);\n\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n\n    return url.href;\n  }\n\n  const looksLikeM3U = (text) =>\n    /^\\s*#EXT(M3U|INF)/i.test(text) || /^\\s*[a-z][a-z0-9+.-]*:\\/\\//im.test(text);\n\n  async function fetchOnlineM3U(inputUrl, signal) {\n    const normalized = normalizeOnlineM3UUrl(inputUrl);\n    const urlsToTry = normalized === inputUrl ? [inputUrl] : [normalized, inputUrl];\n\n    let lastError = null;\n\n    for (const url of urlsToTry) {\n      try {\n        const response = await fetch(url, { signal, cache: 'no-store', redirect: 'follow' });\n\n        if (!response.ok) {\n          throw new Error(`HTTP ${response.status} ${response.statusText}`);\n        }\n\n        const text = await response.text();\n\n        if (!text.trim()) {\n          throw new Error('The fetched playlist is empty.');\n        }\n\n        if (!looksLikeM3U(text)) {\n          throw new Error('The fetched content does not appear to be an M3U playlist.');\n        }\n\n        return text;\n      } catch (error) {\n        if (error.name === 'AbortError') {\n          throw error;\n        }\n\n        lastError = error;\n      }\n    }\n\n    throw new Error(\n      `Unable to fetch the playlist. ${lastError.message} ` +\n        'The remote server may block browser CORS requests.',\n    );\n  }\n\n  /* ============================================================\n   START BUTTONS, PAUSE, CANCEL\n   ============================================================ */\n\n  async function startFile() {\n    const file = $('fileInput').files[0];\n\n    if (!file) {\n      return alert('Please upload an M3U file.');\n    }\n\n    await processLinks(await file.text(), 'file', file.name);\n  }\n\n  async function startUrl() {\n    const input = $('urlInput').value.trim();\n\n    if (!input) {\n      return alert('Please enter an online M3U URL.');\n    }\n\n    let normalized;\n\n    try {\n      normalized = normalizeOnlineM3UUrl(input);\n    } catch (error) {\n      return alert(`Error fetching online M3U file: ${error.message}`);\n    }\n\n    beginRun();\n    toggleButtons('url', true); /* shows Cancel while the download is running */\n\n    setCurrentChecking(\n      normalized !== input\n        ? `Fetching GitHub raw playlist...\\n${normalized}`\n        : 'Fetching online M3U file...',\n    );\n\n    const controller = new AbortController();\n\n    inflight.add(controller);\n\n    let text;\n\n    try {\n      text = await fetchOnlineM3U(input, controller.signal);\n    } catch (error) {\n      toggleButtons('url', false);\n      resetOutput();\n\n      if (error.name === 'AbortError') {\n        $('summaryLine').textContent = 'Online M3U fetch cancelled.';\n      } else {\n        $('summaryLine').textContent = `Error fetching online M3U file: ${error.message}`;\n        alert(`Error fetching online M3U file: ${error.message}`);\n      }\n\n      return;\n    } finally {\n      inflight.delete(controller);\n    }\n\n    await processLinks(text, 'url', sourceNameFromUrl(input));\n  }\n\n  async function startText() {\n    const text = $('textInput').value;\n\n    if (!text.trim()) {\n      return alert('Please paste M3U content.');\n    }\n\n    await processLinks(text, 'text', 'pasted_streams.m3u');\n  }\n\n  function togglePause(type) {\n    run.paused = !run.paused;\n\n    $(`${type}PauseButton`).textContent = run.paused ? 'Resume' : 'Pause';\n\n    const summary = $('summaryLine');\n    const prefix = 'Paused — click Resume to continue. ';\n\n    if (run.paused) {\n      summary.textContent = prefix + summary.textContent;\n    } else if (summary.textContent.startsWith(prefix)) {\n      summary.textContent = summary.textContent.slice(prefix.length);\n    }\n  }\n\n  function cancelProcess() {\n    run.cancelled = true;\n    run.paused = false;\n\n    inflight.forEach((controller) => controller.abort());\n  }\n\n  function wireControls(extra = {}) {\n    const starters = { file: startFile, url: startUrl, text: startText };\n\n    Object.entries(starters).forEach(([type, start]) => {\n      $(`${type}CheckButton`).addEventListener('click', start);\n      $(`${type}PauseButton`).addEventListener('click', () => togglePause(type));\n      $(`${type}CancelButton`).addEventListener('click', cancelProcess);\n    });\n\n    Object.entries(extra).forEach(([id, handler]) => $(id).addEventListener('click', handler));\n  }\n\n\n  const LOCKED_INPUT_IDS = ['fileInput', 'urlInput', 'textInput', 'concurrencyInput', 'timeoutInput', 'removeAfterInput', 'historyFile'];\n\n  /* ============================================================\n   HISTORY\n   { version: 1, stations: [{k, t, u}], runs: [{t, r}] }\n   r has one character per station: 1 up, 0 down, - not checked in that run.\n   The Node script writes the same format.\n   ============================================================ */\n  const HISTORY_KEY = 'm3u-health-history-v1';\n  const MAX_RUNS = 120;\n  let history = loadHistory();\n  let current = null;\n\n  function emptyHistory() {\n    return { version: 1, stations: [], runs: [] };\n  }\n\n  function loadHistory() {\n    try {\n      const h = JSON.parse(localStorage.getItem(HISTORY_KEY));\n      if (h && h.version === 1 && Array.isArray(h.stations) && Array.isArray(h.runs)) return h;\n    } catch { /* no saved history, or storage is blocked */ }\n    return emptyHistory();\n  }\n\n  function saveHistory() {\n    try {\n      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));\n    } catch { /* storage full or blocked: Export still works */ }\n  }\n\n  const keyOf = (url) => url.trim().toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/;?$/, '');\n\n  function compactHistory() {\n    const keep = [];\n    history.stations.forEach((_, i) => { if (history.runs.some((r) => (r.r[i] || '-') !== '-')) keep.push(i); });\n    if (keep.length === history.stations.length) return;\n    history.stations = keep.map((i) => history.stations[i]);\n    history.runs.forEach((r) => { r.r = keep.map((i) => r.r[i] || '-').join(''); });\n  }\n\n  function recordRun(list) {\n    const idx = new Map(history.stations.map((s, i) => [s.k, i]));\n    list.forEach((e) => {\n      const i = idx.get(e.key);\n      if (i === undefined) {\n        idx.set(e.key, history.stations.length);\n        history.stations.push({ k: e.key, t: e.title, u: e.url });\n      } else {\n        history.stations[i].t = e.title;\n        history.stations[i].u = e.url;\n      }\n    });\n    const chars = new Array(history.stations.length).fill('-');\n    list.forEach((e) => { chars[idx.get(e.key)] = e.ok ? '1' : '0'; });\n    history.runs.push({ t: new Date().toISOString(), r: chars.join('') });\n    if (history.runs.length > MAX_RUNS) history.runs.splice(0, history.runs.length - MAX_RUNS);\n    compactHistory();\n    saveHistory();\n  }\n\n  function statsAt(i) {\n    let up = 0;\n    let down = 0;\n    let streak = 0;\n    let counting = true;\n    let lastOk = '';\n\n    for (let r = history.runs.length - 1; r >= 0; r--) {\n      const ch = history.runs[r].r[i] || '-';\n\n      if (ch === '-') continue;\n\n      if (ch === '1') {\n        up++;\n        counting = false;\n        if (!lastOk) lastOk = history.runs[r].t.slice(0, 10);\n      } else {\n        down++;\n        if (counting) streak++;\n      }\n    }\n\n    return { up, down, streak, lastOk, uptime: up + down ? up / (up + down) : null };\n  }\n\n  function updateHistInfo() {\n    $('histInfo').textContent = history.runs.length\n      ? `${history.runs.length} run(s) stored, ${history.stations.length} station(s) tracked. Latest: ${history.runs[history.runs.length - 1].t.slice(0, 16).replace('T', ' ')} UTC.`\n      : 'No history yet. Every check you run is added here.';\n  }\n\n  /* ============================================================\n   CHECKING\n   ============================================================ */\n  function getSettings() {\n    return {\n      concurrency: readNumber('concurrencyInput'),\n      timeout: readNumber('timeoutInput'),\n      removeAfter: Math.max(1, readNumber('removeAfterInput') || 3),\n    };\n  }\n\n  function resetOutput() {\n    $('output').value = '';\n\n    hideDownload('downloadButton');\n    hideDownload('downloadReportButton');\n    hideDownload('downloadHistoryButton');\n\n    setCurrentChecking('');\n\n    $('summaryLine').textContent = '';\n\n    setDisplayStates(false);\n\n    progress.done = 0;\n    progress.total = 0;\n  }\n\n  async function fetchOnce(url, timeoutMs, { cors }) {\n    const request = startRequest(timeoutMs);\n\n    try {\n      const options = { method: 'GET', signal: request.signal, headers: { Range: 'bytes=0-1' }, redirect: 'follow', cache: 'no-store' };\n\n      if (!cors) options.mode = 'no-cors';\n\n      const response = await fetch(url, options);\n\n      if (!cors) return { ok: true };\n\n      return { ok: response.status === 200 || response.status === 206, status: response.status };\n    } catch (error) {\n      return { ok: false, error: error.name === 'AbortError' ? 'timeout' : 'network' };\n    } finally {\n      request.finish();\n    }\n  }\n\n  async function probe(url, timeoutMs) {\n    const read = await fetchOnce(url, timeoutMs, { cors: true });\n\n    if (read.ok) return { ok: true, reason: '' };\n    if (read.status) return { ok: false, reason: `HTTP ${read.status}` };\n    if (read.error === 'timeout') return { ok: false, reason: 'timeout' };\n\n    /* CORS-blocked: if the server answers at all, treat it as alive */\n    const opaque = await fetchOnce(url, timeoutMs, { cors: false });\n\n    return opaque.ok ? { ok: true, reason: 'answered (CORS-blocked)' } : { ok: false, reason: 'no answer' };\n  }\n\n  async function processLinks(text, type, sourceName) {\n    beginRun();\n    resetOutput();\n    toggleButtons(type, true);\n\n    const settings = getSettings();\n\n    setCurrentChecking('Starting health check...');\n\n    const parsed = parseM3U(text);\n    const seen = new Set();\n    const jobs = [];\n    let untestable = 0;\n\n    parsed.entries.forEach((entry) => {\n      if (!entry.url) return;\n\n      const blockedHere = window.__pageProtocol === 'https:' && /^http:/i.test(entry.url);\n\n      if (!/^https?:\\/\\//i.test(entry.url) || blockedHere) {\n        untestable++;\n\n        return;\n      }\n\n      const key = keyOf(entry.url);\n\n      if (seen.has(key)) return;\n\n      seen.add(key);\n      jobs.push({ entry, key });\n    });\n\n    progress.total = jobs.length;\n\n    const checked = [];\n    let up = 0;\n    let down = 0;\n\n    await runPool(jobs, settings.concurrency, async (job) => {\n      await waitWhilePaused();\n\n      if (run.cancelled) return;\n\n      const result = await probe(job.entry.url, settings.timeout);\n\n      if (run.cancelled) return;\n\n      checked.push({ key: job.key, title: job.entry.title, url: job.entry.url, ok: result.ok, reason: result.reason });\n\n      if (result.ok) up++; else down++;\n\n      showProgress('Checking', job.entry.title, job.entry.url, (done, total) => `Checked ${done}/${total}: ${up} up, ${down} down`);\n    });\n\n    toggleButtons(type, false);\n\n    if (checked.length) recordRun(checked);\n\n    current = { parsed, name: sourceName, checked, untestable };\n\n    updateHistInfo();\n    renderAll();\n\n    setCurrentChecking(run.cancelled ? 'Cancelled. Partial results were added to the history.' : 'Done.');\n  }\n\n  /* ============================================================\n   RESULTS\n   ============================================================ */\n  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  const SHOW_LIMIT = 1500;\n\n  function rowsNow() {\n    if (!current) return [];\n\n    const idx = new Map(history.stations.map((s, i) => [s.k, i]));\n\n    return current.checked\n      .map((c) => ({ ...c, st: statsAt(idx.get(c.key)) }))\n      .sort((a, b) => Number(a.ok) - Number(b.ok) || b.st.streak - a.st.streak || a.title.localeCompare(b.title));\n  }\n\n  function renderAll() {\n    if (!current) return;\n\n    const settings = getSettings();\n    const rows = rowsNow();\n    const up = rows.filter((r) => r.ok).length;\n    const down = rows.length - up;\n    const removable = rows.filter((r) => !r.ok && r.st.streak >= settings.removeAfter).length;\n\n    $('output').value = rows\n      .filter((r) => !r.ok)\n      .map((r) => `DOWN (${r.reason})  ${r.title || '(no title)'}\\n  ${r.url}`)\n      .join('\\n') || 'Every checked stream answered.';\n\n    $('summaryLine').textContent =\n      `Run ${history.runs.length}: ${up} up, ${down} down` +\n      (current.untestable ? `, ${current.untestable} not testable here (non-http or http on an https page)` : '') +\n      `. ${removable} failed ${settings.removeAfter}+ runs in a row.`;\n\n    $('results').style.display = rows.length ? 'block' : 'none';\n    renderTable(rows, settings);\n    rebuildDownloads(rows, settings);\n  }\n\n  function renderTable(rows, settings) {\n    const q = $('searchInput').value.trim().toLowerCase();\n    const mode = $('filterSel').value;\n\n    const shown = rows.filter((r) => {\n      if (mode === 'down' && r.ok) return false;\n      if (mode === 'flaky' && !(r.st.uptime !== null && r.st.up + r.st.down >= 2 && r.st.uptime \u003c 0.9)) return false;\n      if (mode === 'remove' && !(!r.ok && r.st.streak >= settings.removeAfter)) return false;\n      if (q && !`${r.title} ${r.url}`.toLowerCase().includes(q)) return false;\n      return true;\n    });\n\n    $('tbody').innerHTML =\n      shown.slice(0, SHOW_LIMIT).map((r) =>\n        `\u003ctr>\u003ctd>\u003cspan class=\"badge ${r.ok ? 'b-up' : 'b-down'}\">${r.ok ? 'up' : 'down'}\u003c/span>\u003c/td>` +\n        `\u003ctd class=\"nm\">${esc(r.title || '(no title)')}\u003csmall>${esc(r.url)}${r.ok ? '' : ` &middot; ${esc(r.reason)}`}\u003c/small>\u003c/td>` +\n        `\u003ctd class=\"num\">${r.st.uptime === null ? '-' : `${Math.round(r.st.uptime * 100)}% of ${r.st.up + r.st.down}`}\u003c/td>` +\n        `\u003ctd class=\"num\">${r.st.streak || ''}\u003c/td>\u003ctd class=\"num\">${esc(r.st.lastOk || (r.ok ? 'today' : 'never'))}\u003c/td>\u003c/tr>`,\n      ).join('') +\n      (shown.length > SHOW_LIMIT ? `\u003ctr>\u003ctd>\u003c/td>\u003ctd class=\"num\">...and ${shown.length - SHOW_LIMIT} more. Use the filter.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>` : '') +\n      (!shown.length ? '\u003ctr>\u003ctd>\u003c/td>\u003ctd class=\"num\">Nothing matches.\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>' : '');\n  }\n\n  function rebuildDownloads(rows, settings) {\n    const drop = new Set(rows.filter((r) => !r.ok && r.st.streak >= settings.removeAfter).map((r) => r.key));\n    const lines = [current.parsed.extm3u, ...current.parsed.header];\n    let kept = 0;\n\n    current.parsed.entries.forEach((entry) => {\n      if (entry.url && drop.has(keyOf(entry.url))) return;\n\n      kept++;\n      lines.push(...renderEntry(entry));\n    });\n\n    const report = [\n      `Stream health report: ${current.name}`,\n      `Run ${history.runs.length} (${new Date().toISOString().slice(0, 10)}): ${rows.filter((r) => r.ok).length} up, ${rows.filter((r) => !r.ok).length} down.`,\n      `Removal rule: ${settings.removeAfter} failed run(s) in a row -> ${drop.size} station(s) removed from the cleaned playlist (${kept} kept).`,\n      '',\n      ...rows.filter((r) => !r.ok).map((r) =>\n        `${r.title || '(no title)'}\\n  ${r.url}\\n  ${r.reason}; failed ${r.st.streak} run(s) in a row; uptime ${r.st.uptime === null ? '-' : Math.round(r.st.uptime * 100)}% over ${r.st.up + r.st.down} run(s); last OK ${r.st.lastOk || 'never'}\\n`),\n    ].join('\\n');\n\n    setDownload('downloadButton', 'downloadLink', `${lines.join('\\n')}\\n`, 'audio/x-mpegurl', outputName(current.name, '_cleaned'));\n    setDownload('downloadReportButton', 'downloadReportLink', report, 'text/plain', reportName(current.name, '', '_health_report.txt'));\n    setDownload('downloadHistoryButton', 'downloadHistoryLink', JSON.stringify(history), 'application/json', 'history.json');\n  }\n\n  ['searchInput', 'filterSel'].forEach((id) => $(id).addEventListener(id === 'searchInput' ? 'input' : 'change', () => { if (current) renderTable(rowsNow(), getSettings()); }));\n  $('removeAfterInput').addEventListener('input', () => { if (current) renderAll(); });\n\n  /* ============================================================\n   HISTORY BUTTONS + SCHEDULE PANEL\n   ============================================================ */\n  $('historyFile').addEventListener('change', async () => {\n    const file = $('historyFile').files[0];\n\n    if (!file) return;\n\n    try {\n      const h = JSON.parse(await file.text());\n\n      if (!h || h.version !== 1 || !Array.isArray(h.stations) || !Array.isArray(h.runs)) throw new Error('not a health history file');\n      if (history.runs.length && !confirm(`Replace the ${history.runs.length} run(s) stored here with the ${h.runs.length} run(s) in ${file.name}?`)) return;\n\n      history = h;\n      saveHistory();\n      updateHistInfo();\n      renderAll();\n    } catch (error) {\n      alert(`Could not load that history: ${error.message}`);\n    } finally {\n      $('historyFile').value = '';\n    }\n  });\n\n  $('historyReset').addEventListener('click', () => {\n    if (!confirm('Delete the stored history from this browser?')) return;\n\n    history = emptyHistory();\n    saveHistory();\n    updateHistInfo();\n    renderAll();\n  });\n\n  const saveText = (text, name) => {\n    const a = document.createElement('a');\n\n    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  };\n\n  const copyText = async (text, button) => {\n    try {\n      await navigator.clipboard.writeText(text);\n    } catch {\n      const ta = document.createElement('textarea');\n\n      ta.value = text;\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      ta.remove();\n    }\n\n    const label = button.textContent;\n\n    button.textContent = 'Copied';\n    setTimeout(() => { button.textContent = label; }, 1200);\n  };\n\n  const nodeSrc = $('nodeSrc').textContent.replace(/^\\n/, '');\n  const flowSrc = $('flowSrc').textContent.replace(/^\\n/, '');\n\n  $('nodeBox').value = nodeSrc;\n  $('flowBox').value = flowSrc;\n  $('nodeCopy').addEventListener('click', (ev) => copyText(nodeSrc, ev.currentTarget));\n  $('flowCopy').addEventListener('click', (ev) => copyText(flowSrc, ev.currentTarget));\n  $('nodeSave').addEventListener('click', () => saveText(nodeSrc, 'health-monitor.js'));\n  $('flowSave').addEventListener('click', () => saveText(flowSrc, 'health.yml'));\n\n  updateHistInfo();\n\n  wireControls({\n    downloadButton: () => clickLink('downloadLink'),\n    downloadReportButton: () => clickLink('downloadReportLink'),\n    downloadHistoryButton: () => clickLink('downloadHistoryLink'),\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"validate",label:"Validate & fix",tip:"Find and repair format problems inside the m3u file",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Validator\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.mid { width: 920px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 10px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 0; background: var(--orange);\n  color: var(--ink); font: inherit; font-weight: 900; -webkit-text-stroke: 0.6px currentColor;\n  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\n}\ninput[type='file']::file-selector-button:hover { filter: brightness(1.1); }\n::placeholder { color: var(--muted); opacity: 1; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }\ntextarea:focus, input:focus, select:focus { border-color: var(--yellow); }\n\nbutton {\n  --c: var(--orange); flex: none; width: 130px; height: 48px; display: flex; align-items: center; justify-content: center;\n  padding: 0 6px; border: var(--bw) solid var(--ink); border-radius: 0; background: var(--c); color: var(--ink);\n  font: inherit; font-size: 0.95em; font-weight: 900; -webkit-text-stroke: 0.6px currentColor; letter-spacing: 0.04em;\n  line-height: 1.15; text-align: center; text-transform: uppercase; box-shadow: 3px 3px 0 var(--text); cursor: pointer;\n}\nbutton:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }\nbutton:active { box-shadow: none; transform: translate(3px, 3px); }\nbutton:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }\n.orange { --c: var(--orange); } .pink { --c: var(--pink); } .violet { --c: var(--violet); }\n.green { --c: var(--green); } .yellow { --c: var(--yellow); } .blue { --c: var(--blue); }\n.red { --c: var(--red); } .white { --c: var(--line); }\n.wide-btn { width: 260px; }\n.mini { width: auto; height: 32px; padding: 0 10px; font-size: 0.8em; box-shadow: 2px 2px 0 var(--text); }\n.center-col { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 6px; }\n.hidden { display: none !important; }\n\n.advanced-settings { margin: 12px 0 10px; border: var(--bw) solid var(--line); background: var(--ink); }\n.advanced-settings summary { padding: 10px; cursor: pointer; user-select: none; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }\n.advanced-settings summary:hover { background: #222222; }\n.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 10px; border-top: var(--bw) solid var(--line); background: var(--panel); }\n.settings-col { display: flex; flex-direction: column; gap: 7px; min-width: 250px; flex: 1; }\n.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }\n.setting-item.check { flex-direction: row; align-items: center; gap: 6px; }\n.setting-item select { margin: 3px 0 0; padding: 6px; }\n.col-title { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--yellow); font-size: 0.85em; }\ninput[type='checkbox'] { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }\n\n.sevbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 10px 0 8px; }\n.chips { margin: 4px 0 8px; }\n.chip { display: inline-block; margin: 0 6px 6px 0; padding: 3px 8px; border: 2px solid var(--line); background: var(--ink); cursor: pointer; font-size: 0.8em; user-select: none; }\n.chip.sev-error { border-left: 7px solid var(--red); }\n.chip.sev-warning { border-left: 7px solid var(--yellow); }\n.chip.sev-info { border-left: 7px solid var(--blue); }\n.chip.active { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }\n.badge { display: inline-block; padding: 1px 6px; font-size: 0.72em; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); }\n.b-error { background: var(--red); } .b-warning { background: var(--yellow); } .b-info { background: var(--blue); }\n\n.table-wrap { border: var(--bw) solid var(--line); background: var(--ink); overflow: auto; max-height: 60vh; }\ntable.grid { border-collapse: collapse; width: 100%; }\n.grid th { position: sticky; top: 0; padding: 6px 8px; background: var(--yellow); color: var(--ink); font-size: 0.75em; letter-spacing: 0.05em; text-align: left; text-transform: uppercase; white-space: nowrap; }\n.grid td { padding: 4px 8px; border-bottom: 2px solid #333; vertical-align: top; }\n.grid td.num { text-align: right; color: var(--muted); white-space: nowrap; }\n.grid td.msg { min-width: 220px; }\n.grid td.raw { color: var(--muted); font-size: 0.8em; word-break: break-all; }\n#summaryLine { min-height: 1.2em; margin: 8px 0 6px; font-size: 0.85em; color: var(--muted); white-space: pre-wrap; }\n@media (max-width: 560px) {\n  .input-group { flex-wrap: wrap; }\n  .input-group > input, .input-group > textarea { flex: 1 1 100%; }\n  .input-group > button { flex: 1 1 90px; width: auto; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container mid\">\n\u003ch1>M3U Validator\u003c/h1>\n\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"file\" id=\"fileInput\" accept=\".m3u,.m3u8,.txt\">\n\u003cbutton id=\"fileLoad\" class=\"orange\">Validate local file\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003cinput type=\"text\" id=\"urlInput\" placeholder=\"Enter online M3U URL...\">\n\u003cbutton id=\"urlLoad\" class=\"pink\">Validate Online Link\u003c/button>\n\u003c/div>\n\u003cdiv class=\"input-group\">\n\u003ctextarea id=\"textInput\" rows=\"3\" placeholder=\"Paste M3U content here...\">\u003c/textarea>\n\u003cbutton id=\"textLoad\" class=\"violet\">Validate Pasted streams\u003c/button>\n\u003c/div>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Checks (what to look for)\u003c/summary>\n\u003cdiv class=\"settings-grid\" id=\"ruleGrid\">\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"advanced-settings\">\n\u003csummary>Auto-fix options\u003c/summary>\n\u003cdiv class=\"settings-grid\">\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"col-title\">File\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fBom\" checked>\u003clabel for=\"fBom\">Remove the BOM\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fCtrl\" checked>\u003clabel for=\"fCtrl\">Remove control characters\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fTrim\" checked>\u003clabel for=\"fTrim\">Trim leading / trailing spaces on every line\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fBlank\" checked>\u003clabel for=\"fBlank\">Remove blank lines\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fHeader\" checked>\u003clabel for=\"fHeader\">One #EXTM3U header, first line\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item\">\n\u003clabel for=\"fEol\">Line endings\u003c/label>\n\u003cselect id=\"fEol\">\n\u003coption value=\"lf\">LF (Unix, recommended)\u003c/option>\n\u003coption value=\"crlf\">CRLF (Windows)\u003c/option>\n\u003coption value=\"keep\">Whatever the file mostly uses\u003c/option>\n\u003c/select>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"settings-col\">\n\u003cdiv class=\"col-title\">Entries\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fOrphan\" checked>\u003clabel for=\"fOrphan\">Drop #EXTINF lines that have no URL\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fNoExtinf\">\u003clabel for=\"fNoExtinf\">Give bare URLs an #EXTINF (title = host name)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fDuration\" checked>\u003clabel for=\"fDuration\">Add the missing -1 duration\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fQuote\" checked>\u003clabel for=\"fQuote\">Quote unquoted attribute values\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fDupAttr\" checked>\u003clabel for=\"fDupAttr\">Remove repeated attributes (keep the first)\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fEmpty\">\u003clabel for=\"fEmpty\">Remove empty attributes (tvg-logo=\"\")\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fTitle\" checked>\u003clabel for=\"fTitle\">Trim and collapse spaces in titles\u003c/label>\u003c/div>\n\u003cdiv class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"fEntity\" checked>\u003clabel for=\"fEntity\">Decode HTML entities in titles (&amp;amp; to &amp;)\u003c/label>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\n\u003cp id=\"summaryLine\">\u003c/p>\n\n\u003cdiv id=\"results\" class=\"hidden\">\n\u003cdiv class=\"sevbar\">\n\u003clabel class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"showError\" checked>\u003cspan class=\"badge b-error\">errors\u003c/span>\u003c/label>\n\u003clabel class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"showWarning\" checked>\u003cspan class=\"badge b-warning\">warnings\u003c/span>\u003c/label>\n\u003clabel class=\"setting-item check\">\u003cinput type=\"checkbox\" id=\"showInfo\">\u003cspan class=\"badge b-info\">info\u003c/span>\u003c/label>\n\u003c/div>\n\u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n\u003cdiv class=\"table-wrap\">\n\u003ctable class=\"grid\">\n\u003cthead>\u003ctr>\u003cth>Line\u003c/th>\u003cth>Level\u003c/th>\u003cth>Problem\u003c/th>\u003cth>Text\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tbody\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"center-col\">\n\u003cbutton id=\"fixBtn\" class=\"green wide-btn\">Download Fixed Playlist\u003c/button>\n\u003cbutton id=\"reportBtn\" class=\"yellow wide-btn\">Download Report\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n\n  /* ============================================================\n   RULES\n   ============================================================ */\n  const RULES = [\n    { id: 'bom', sev: 'warning', group: 'File', label: 'UTF-8 BOM at the start' },\n    { id: 'encoding', sev: 'error', group: 'File', label: 'Broken characters (encoding is not UTF-8)' },\n    { id: 'eol-mixed', sev: 'warning', group: 'File', label: 'Mixed line endings' },\n    { id: 'eol-cr', sev: 'warning', group: 'File', label: 'CR-only line endings' },\n    { id: 'ctrl', sev: 'warning', group: 'File', label: 'Control characters' },\n    { id: 'trailing-ws', sev: 'warning', group: 'File', label: 'Trailing whitespace' },\n    { id: 'leading-ws', sev: 'warning', group: 'File', label: 'Leading whitespace' },\n    { id: 'blank-lines', sev: 'info', group: 'File', label: 'Blank lines' },\n    { id: 'empty', sev: 'error', group: 'File', label: 'No entries found' },\n    { id: 'no-header', sev: 'error', group: 'File', label: 'Missing #EXTM3U header' },\n    { id: 'multi-header', sev: 'warning', group: 'File', label: 'Repeated #EXTM3U header' },\n\n    { id: 'extinf-colon', sev: 'error', group: 'Entries', label: '#EXTINF without \":\"' },\n    { id: 'extinf-duration', sev: 'warning', group: 'Entries', label: '#EXTINF without a duration' },\n    { id: 'extinf-comma', sev: 'error', group: 'Entries', label: '#EXTINF without a comma before the title' },\n    { id: 'quotes', sev: 'error', group: 'Entries', label: 'Unbalanced quotes in #EXTINF' },\n    { id: 'attr-unquoted', sev: 'warning', group: 'Entries', label: 'Unquoted attribute value' },\n    { id: 'attr-dup', sev: 'warning', group: 'Entries', label: 'Attribute repeated in one entry' },\n    { id: 'attr-empty', sev: 'info', group: 'Entries', label: 'Empty attribute value' },\n    { id: 'title-empty', sev: 'warning', group: 'Entries', label: 'Empty title' },\n    { id: 'title-space', sev: 'info', group: 'Entries', label: 'Extra spaces in title' },\n    { id: 'title-entity', sev: 'info', group: 'Entries', label: 'HTML entity in title (&amp; etc.)' },\n    { id: 'logo-url', sev: 'warning', group: 'Entries', label: 'tvg-logo is not an http(s) or data URL' },\n    { id: 'country-code', sev: 'info', group: 'Entries', label: 'tvg-country is not a 2-letter code' },\n    { id: 'orphan-extinf', sev: 'error', group: 'Entries', label: '#EXTINF with no URL after it' },\n    { id: 'no-extinf', sev: 'warning', group: 'Entries', label: 'URL with no #EXTINF before it' },\n\n    { id: 'url-space', sev: 'error', group: 'URLs', label: 'Space inside a URL' },\n    { id: 'url-invalid', sev: 'error', group: 'URLs', label: 'URL cannot be parsed' },\n    { id: 'url-scheme', sev: 'warning', group: 'URLs', label: 'URL without a scheme (http://...)' },\n    { id: 'url-nonascii', sev: 'warning', group: 'URLs', label: 'Non-ASCII characters in a URL' },\n    { id: 'url-http', sev: 'info', group: 'URLs', label: 'Plain http:// (blocked on https pages)' },\n\n    { id: 'dup-url', sev: 'warning', group: 'Duplicates', label: 'Same URL used more than once' },\n    { id: 'dup-id', sev: 'warning', group: 'Duplicates', label: 'Same tvg-id used more than once' },\n    { id: 'dup-title', sev: 'info', group: 'Duplicates', label: 'Same title used more than once' },\n  ];\n  const RULE = Object.fromEntries(RULES.map((r) => [r.id, r]));\n  const KNOWN_SCHEMES = new Set(['http', 'https', 'rtmp', 'rtmps', 'rtsp', 'mms', 'mmsh', 'udp', 'rtp', 'file']);\n  const CTRL_RE = /[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F]/;\n  const SEV_ORDER = { error: 0, warning: 1, info: 2 };\n\n  function buildRuleGrid() {\n    const grid = $('ruleGrid');\n    ['File', 'Entries', 'URLs', 'Duplicates'].forEach((group) => {\n      const col = document.createElement('div');\n      col.className = 'settings-col';\n      const title = document.createElement('div');\n      title.className = 'col-title';\n      title.textContent = group;\n      col.appendChild(title);\n      RULES.filter((r) => r.group === group).forEach((r) => {\n        const row = document.createElement('div');\n        row.className = 'setting-item check';\n        const cb = document.createElement('input');\n        cb.type = 'checkbox';\n        cb.checked = true;\n        cb.id = `rule-${r.id}`;\n        cb.addEventListener('change', () => { if (state.text !== null) analyzeNow(); });\n        const label = document.createElement('label');\n        label.htmlFor = cb.id;\n        label.textContent = r.label;\n        row.append(cb, label);\n        col.appendChild(row);\n      });\n      grid.appendChild(col);\n    });\n  }\n\n  const enabledRules = () => new Set(RULES.filter((r) => $(`rule-${r.id}`).checked).map((r) => r.id));\n\n  /* ============================================================\n   SHARED SMALL HELPERS\n   ============================================================ */\n  /* index of the first comma that is not inside quotes, or -1 */\n  function commaIndex(line) {\n    let inQuotes = false;\n    for (let i = 0; i \u003c line.length; i++) {\n      if (line[i] === '\"') inQuotes = !inQuotes;\n      else if (line[i] === ',' && !inQuotes) return i;\n    }\n    return -1;\n  }\n\n  const ENTITY_MAP = { amp: '&', lt: '\u003c', gt: '>', quot: '\"', apos: \"'\" };\n  const decodeEntities = (s) =>\n    s.replace(/&(#\\d+|#x[0-9a-f]+|amp|lt|gt|quot|apos);/gi, (whole, body) => {\n      if (body[0] === '#') {\n        const code = body[1].toLowerCase() === 'x' ? parseInt(body.slice(2), 16) : parseInt(body.slice(1), 10);\n        try { return String.fromCodePoint(code); } catch { return whole; }\n      }\n      return ENTITY_MAP[body.toLowerCase()];\n    });\n\n  const ENTITY_RE = /&(#\\d+|#x[0-9a-f]+|amp|lt|gt|quot|apos);/i;\n\n  /* attributes of the part before the title comma, quoted or not */\n  function readAttrs(prefix) {\n    const list = [];\n    const re = /([\\w.-]+)=(?:\"([^\"]*)\"|([^\\s\"]*))/g;\n    let m;\n    while ((m = re.exec(prefix))) list.push({ key: m[1], value: m[2] !== undefined ? m[2] : m[3], quoted: m[2] !== undefined });\n    return list;\n  }\n\n  const hostOf = (url) => {\n    try { return new URL(url).hostname; } catch { return ''; }\n  };\n\n  function saveText(text, mime, name) {\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([text], { type: mime }));\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  /* TextDecoder with ignoreBOM keeps the BOM, which Blob.text() would silently remove */\n  const decodeBytes = (buffer) => new TextDecoder('utf-8', { ignoreBOM: true }).decode(buffer);\n\n  function normalizeOnlineUrl(input) {\n    const url = new URL(input);\n    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.');\n    if (url.hostname.toLowerCase() === 'github.com') {\n      const parts = url.pathname.split('/').filter(Boolean);\n      if (parts.length >= 5 && (parts[2] === 'raw' || parts[2] === 'blob')) {\n        const [owner, repo, , ...rest] = parts;\n        return `https://raw.githubusercontent.com/${owner}/${repo}/${rest.join('/')}${url.search}`;\n      }\n    }\n    return url.href;\n  }\n\n  /* ============================================================\n   ANALYSIS\n   ============================================================ */\n  function analyze(text, on) {\n    const issues = [];\n    const add = (rule, line, message, raw) => {\n      if (on.has(rule)) issues.push({ rule, sev: RULE[rule].sev, line, message, raw: (raw || '').slice(0, 120) });\n    };\n\n    if (text.charCodeAt(0) === 0xfeff) add('bom', 0, 'The file starts with a byte-order mark. Some players read it as part of \"#EXTM3U\".');\n\n    const bad = text.indexOf('\\ufffd');\n    if (bad !== -1) {\n      const count = (text.match(/\\ufffd/g) || []).length;\n      add('encoding', 0, `${count} broken character(s) (U+FFFD). The file is probably not UTF-8 (Windows-1256, Latin-1...). Re-save it as UTF-8.`);\n    }\n\n    const crlf = (text.match(/\\r\\n/g) || []).length;\n    const rest = text.replace(/\\r\\n/g, '');\n    const lf = (rest.match(/\\n/g) || []).length;\n    const cr = (rest.match(/\\r/g) || []).length;\n    if ([crlf, lf, cr].filter((n) => n > 0).length > 1) {\n      add('eol-mixed', 0, `Mixed line endings: ${crlf} CRLF, ${lf} LF, ${cr} CR.`);\n    } else if (cr > 0) {\n      add('eol-cr', 0, `${cr} CR-only line endings (old Mac style). Many tools see this as one huge line.`);\n    }\n\n    const lines = text.split(/\\r\\n|\\n|\\r/);\n    let firstContent = true;\n    let headerSeen = false;\n    let blanks = 0;\n    let pending = null;\n    const entries = [];\n\n    lines.forEach((raw, idx) => {\n      const n = idx + 1;\n      let line = raw;\n      if (n === 1 && line.charCodeAt(0) === 0xfeff) line = line.slice(1);\n\n      if (line.trim() === '') {\n        if (n !== lines.length) blanks++;\n        return;\n      }\n\n      if (CTRL_RE.test(line)) add('ctrl', n, 'Control character in this line.', line.replace(/[\\u0000-\\u001F\\u007F]/g, '?'));\n      if (/[ \\t]+$/.test(line)) add('trailing-ws', n, 'Trailing whitespace.', line);\n      if (/^[ \\t]+/.test(line)) add('leading-ws', n, 'Leading whitespace.', line);\n\n      const t = line.trim();\n\n      if (firstContent) {\n        firstContent = false;\n        if (!/^#EXTM3U/i.test(t)) add('no-header', n, 'The first line should be #EXTM3U.', t);\n      }\n\n      if (/^#EXTM3U/i.test(t)) {\n        if (headerSeen) add('multi-header', n, 'A second #EXTM3U header.', t);\n        headerSeen = true;\n        return;\n      }\n\n      if (/^#EXTINF/i.test(t)) {\n        if (pending) add('orphan-extinf', pending.line, 'This #EXTINF is not followed by a URL.', pending.raw);\n        pending = checkExtinf(t, n, add);\n        return;\n      }\n\n      if (t.startsWith('#')) return;\n\n      /* a URL line */\n      checkUrl(t, n, add);\n      if (!pending) add('no-extinf', n, 'This URL has no #EXTINF line, so it has no title.', t);\n      entries.push({ line: n, url: t, attrs: pending ? pending.attrs : [], title: pending ? pending.title : '' });\n      pending = null;\n    });\n\n    if (pending) add('orphan-extinf', pending.line, 'This #EXTINF is not followed by a URL.', pending.raw);\n    if (blanks) add('blank-lines', 0, `${blanks} blank line(s).`);\n    if (!entries.length) add('empty', 0, 'No stream URLs were found.');\n\n    /* duplicates */\n    const byUrl = new Map();\n    const byId = new Map();\n    const byTitle = new Map();\n    entries.forEach((e) => {\n      const ukey = e.url.toLowerCase().replace(/\\/+$/, '');\n      if (byUrl.has(ukey)) add('dup-url', e.line, `Same URL as line ${byUrl.get(ukey)}.`, e.url);\n      else byUrl.set(ukey, e.line);\n\n      const id = (e.attrs.find((a) => a.key === 'tvg-id') || {}).value;\n      if (id) {\n        if (byId.has(id)) add('dup-id', e.line, `tvg-id \"${id}\" is also used on line ${byId.get(id)}.`, e.title);\n        else byId.set(id, e.line);\n      }\n\n      const tkey = e.title.trim().toLowerCase();\n      if (tkey) {\n        if (byTitle.has(tkey)) add('dup-title', e.line, `Same title as line ${byTitle.get(tkey)}.`, e.title);\n        else byTitle.set(tkey, e.line);\n      }\n    });\n\n    issues.sort((a, b) => a.line - b.line || SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);\n    return { issues, entries: entries.length };\n  }\n\n  function checkExtinf(t, n, add) {\n    const m = /^#EXTINF(:?)\\s*(.*)$/i.exec(t);\n    const restOfLine = m[2];\n    if (!m[1]) add('extinf-colon', n, 'Missing \":\" after #EXTINF.', t);\n\n    const dm = /^(-?\\d+(?:\\.\\d+)?)?(.*)$/.exec(restOfLine);\n    if (dm[1] === undefined) add('extinf-duration', n, 'No duration after #EXTINF: (use -1 for streams).', t);\n\n    const quoteCount = (t.match(/\"/g) || []).length;\n    const idx = commaIndex(dm[2]);\n    let prefix = dm[2];\n    let title = '';\n\n    if (quoteCount % 2 === 1) {\n      add('quotes', n, 'Odd number of quote characters. An attribute value is not closed.', t);\n    }\n\n    if (idx === -1) {\n      add('extinf-comma', n, 'No comma before the title, so players show no name.', t);\n    } else {\n      prefix = dm[2].slice(0, idx);\n      title = dm[2].slice(idx + 1);\n    }\n\n    /* with an unclosed quote the attribute scan would only produce false alarms */\n    const attrs = quoteCount % 2 === 1 ? [] : readAttrs(prefix);\n    const seen = new Set();\n    attrs.forEach((a) => {\n      if (!a.quoted && a.value !== '') add('attr-unquoted', n, `${a.key}=${a.value} should be ${a.key}=\"${a.value}\".`, t);\n      if (seen.has(a.key)) add('attr-dup', n, `${a.key} appears more than once.`, t);\n      seen.add(a.key);\n      if (a.value === '') add('attr-empty', n, `${a.key} is empty.`, t);\n      if (a.key === 'tvg-logo' && a.value && !/^(https?:\\/\\/|data:)/i.test(a.value)) add('logo-url', n, 'tvg-logo should start with http:// or https://.', a.value);\n      if (a.key === 'tvg-country' && a.value && !/^[A-Za-z]{2}$/.test(a.value)) add('country-code', n, `tvg-country \"${a.value}\" is not an ISO 2-letter code.`, t);\n    });\n\n    const cleanTitle = title.trim();\n    if (idx !== -1 && cleanTitle === '') add('title-empty', n, 'The title is empty.', t);\n    if (cleanTitle && (title !== cleanTitle || /\\s{2,}/.test(cleanTitle))) add('title-space', n, 'Leading, trailing or repeated spaces in the title.', title);\n    if (ENTITY_RE.test(title)) add('title-entity', n, 'The title contains an HTML entity.', title);\n\n    return { line: n, raw: t, attrs, title: cleanTitle };\n  }\n\n  function checkUrl(url, n, add) {\n    if (/\\s/.test(url)) add('url-space', n, 'The URL contains a space.', url);\n    // eslint-disable-next-line no-control-regex\n    if (/[^\\u0000-\\u007F]/.test(url)) add('url-nonascii', n, 'The URL contains non-ASCII characters. Percent-encode them.', url);\n    const sm = /^([a-z][a-z0-9+.-]*):\\/\\//i.exec(url);\n    if (!sm) {\n      add('url-scheme', n, 'No scheme (for example http://).', url);\n      return;\n    }\n    const scheme = sm[1].toLowerCase();\n    if (!KNOWN_SCHEMES.has(scheme)) add('url-scheme', n, `Unusual scheme \"${scheme}://\".`, url);\n    if (scheme === 'http' || scheme === 'https') {\n      let ok = true;\n      try {\n        const u = new URL(url);\n        ok = Boolean(u.hostname);\n      } catch {\n        ok = false;\n      }\n      if (!ok) add('url-invalid', n, 'The URL has no valid host name.', url);\n      if (scheme === 'http') add('url-http', n, 'Plain http:// stream.', url);\n    }\n  }\n\n  /* ============================================================\n   AUTO-FIX\n   ============================================================ */\n  function getFixOptions() {\n    return {\n      bom: $('fBom').checked, ctrl: $('fCtrl').checked, trim: $('fTrim').checked, blank: $('fBlank').checked,\n      header: $('fHeader').checked, eol: $('fEol').value, orphan: $('fOrphan').checked, noExtinf: $('fNoExtinf').checked,\n      duration: $('fDuration').checked, quote: $('fQuote').checked, dupAttr: $('fDupAttr').checked,\n      empty: $('fEmpty').checked, title: $('fTitle').checked, entity: $('fEntity').checked,\n    };\n  }\n\n  function fixExtinf(line, f, bump) {\n    if ((line.match(/\"/g) || []).length % 2 === 1) return line; /* cannot be repaired safely */\n\n    const m = /^#EXTINF(:?)\\s*(.*)$/i.exec(line);\n    const dm = /^(-?\\d+(?:\\.\\d+)?)?\\s*(.*)$/.exec(m[2]);\n    let duration = dm[1];\n    const tail = dm[2];\n    const idx = commaIndex(tail);\n    let prefix = idx === -1 ? tail : tail.slice(0, idx);\n    let title = idx === -1 ? '' : tail.slice(idx + 1);\n\n    if (duration === undefined && f.duration) {\n      duration = '-1';\n      bump('missing duration added');\n    }\n\n    const attrs = readAttrs(prefix);\n    const hasUnquoted = attrs.some((a) => !a.quoted && a.value !== '');\n    const keys = new Set();\n    const hasDup = attrs.some((a) => (keys.has(a.key) ? true : (keys.add(a.key), false)));\n    const hasEmpty = attrs.some((a) => a.value === '');\n\n    const rebuild = (f.quote && hasUnquoted) || (f.dupAttr && hasDup) || (f.empty && hasEmpty);\n    if (rebuild) {\n      const seen = new Set();\n      const kept = [];\n      attrs.forEach((a) => {\n        if (f.dupAttr && seen.has(a.key)) { bump('repeated attribute removed'); return; }\n        seen.add(a.key);\n        if (f.empty && a.value === '') { bump('empty attribute removed'); return; }\n        if (f.quote && !a.quoted && a.value !== '') bump('attribute value quoted');\n        kept.push(` ${a.key}=\"${a.value.replace(/\"/g, \"'\")}\"`);\n      });\n      prefix = kept.join('');\n    } else {\n      prefix = prefix.trim() ? ` ${prefix.trim()}` : '';\n    }\n\n    if (f.title) {\n      const clean = title.replace(/\\s+/g, ' ').trim();\n      if (clean !== title.trim() || title !== title.trim()) bump('title spaces cleaned');\n      title = clean;\n    }\n    if (f.entity && ENTITY_RE.test(title)) {\n      title = decodeEntities(title);\n      bump('HTML entity decoded');\n    }\n\n    const out = `#EXTINF:${duration !== undefined ? duration : ''}${prefix},${title.trim()}`;\n    if (!m[1]) bump('missing \":\" after #EXTINF added');\n    if (idx === -1) bump('missing title comma added');\n    return out;\n  }\n\n  function fixText(text, f) {\n    const log = {};\n    const bump = (k, n = 1) => { log[k] = (log[k] || 0) + n; };\n\n    if (f.bom && text.charCodeAt(0) === 0xfeff) {\n      text = text.slice(1);\n      bump('BOM removed');\n    }\n\n    const eolStyle =\n      f.eol === 'crlf' ? '\\r\\n'\n        : f.eol === 'lf' ? '\\n'\n          : (text.match(/\\r\\n/g) || []).length > (text.replace(/\\r\\n/g, '').match(/\\n/g) || []).length ? '\\r\\n' : '\\n';\n\n    const rawLines = text.split(/\\r\\n|\\n|\\r/);\n    if (rawLines.length && rawLines[rawLines.length - 1] === '') rawLines.pop(); /* the file's final newline */\n    const out = [];\n    let headerLine = null;\n    let pending = null;\n\n    const flushOrphan = () => {\n      if (!pending) return;\n      if (f.orphan) bump('orphan #EXTINF dropped');\n      else out.push(...pending);\n      pending = null;\n    };\n\n    for (const original of rawLines) {\n      let line = original;\n      if (f.ctrl && CTRL_RE.test(line)) {\n        line = line.replace(new RegExp(CTRL_RE.source, 'g'), '');\n        bump('control characters removed');\n      }\n      if (f.trim && line !== line.trim()) {\n        line = line.trim();\n        bump('lines trimmed');\n      }\n\n      if (line.trim() === '') {\n        if (f.blank) { bump('blank lines removed'); continue; }\n        if (pending) pending.push(line); else out.push(line);\n        continue;\n      }\n\n      const t = line.trim();\n\n      if (/^#EXTM3U/i.test(t)) {\n        if (f.header) {\n          if (headerLine === null) headerLine = t; else bump('repeated #EXTM3U removed');\n          continue;\n        }\n        out.push(line);\n        continue;\n      }\n\n      if (/^#EXTINF/i.test(t)) {\n        flushOrphan();\n        pending = [fixExtinf(t, f, bump)];\n        continue;\n      }\n\n      if (t.startsWith('#')) {\n        if (pending) pending.push(line); else out.push(line);\n        continue;\n      }\n\n      if (pending) {\n        out.push(...pending, line);\n        pending = null;\n      } else if (f.noExtinf) {\n        out.push(`#EXTINF:-1,${hostOf(t) || t}`, line);\n        bump('#EXTINF added to bare URL');\n      } else {\n        out.push(line);\n      }\n    }\n    flushOrphan();\n\n    if (f.header) {\n      /* drop blank lines that ended up first, then put the header on top */\n      while (out.length && out[0].trim() === '') out.shift();\n      if (headerLine === null) bump('#EXTM3U header added');\n      out.unshift(headerLine === null ? '#EXTM3U' : headerLine);\n    }\n\n    while (out.length && out[out.length - 1].trim() === '') out.pop();\n    return { text: out.join(eolStyle) + eolStyle, log };\n  }\n\n  /* ============================================================\n   UI\n   ============================================================ */\n  const state = { text: null, name: 'playlist.m3u', result: null, ruleFilter: null };\n  const say = (msg) => { $('summaryLine').textContent = msg; };\n\n  function analyzeNow() {\n    state.result = analyze(state.text, enabledRules());\n    state.ruleFilter = null;\n    renderResults();\n  }\n\n  function counts(issues) {\n    return issues.reduce((acc, i) => { acc[i.sev] = (acc[i.sev] || 0) + 1; return acc; }, { error: 0, warning: 0, info: 0 });\n  }\n\n  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  const SHOW_LIMIT = 1000;\n\n  function renderResults() {\n    const { issues, entries } = state.result;\n    const c = counts(issues);\n    $('results').classList.remove('hidden');\n\n    say(\n      `${state.name}: ${entries} stream(s). ` +\n        (issues.length === 0 ? 'No problems found.' : `${c.error} error(s), ${c.warning} warning(s), ${c.info} info.`),\n    );\n\n    /* chips: one per rule that fired */\n    const byRule = {};\n    issues.forEach((i) => { byRule[i.rule] = (byRule[i.rule] || 0) + 1; });\n    const chips = Object.entries(byRule)\n      .sort((a, b) => SEV_ORDER[RULE[a[0]].sev] - SEV_ORDER[RULE[b[0]].sev] || b[1] - a[1])\n      .map(([id, n]) => `\u003cspan class=\"chip sev-${RULE[id].sev}${state.ruleFilter === id ? ' active' : ''}\" data-rule=\"${id}\">${esc(RULE[id].label)} &middot; ${n}\u003c/span>`)\n      .join('');\n    $('chips').innerHTML = chips;\n\n    const show = { error: $('showError').checked, warning: $('showWarning').checked, info: $('showInfo').checked };\n    const rows = issues.filter((i) => show[i.sev] && (!state.ruleFilter || i.rule === state.ruleFilter));\n    $('tbody').innerHTML =\n      rows.slice(0, SHOW_LIMIT).map((i) =>\n        `\u003ctr>\u003ctd class=\"num\">${i.line || '-'}\u003c/td>\u003ctd>\u003cspan class=\"badge b-${i.sev}\">${i.sev}\u003c/span>\u003c/td>` +\n        `\u003ctd class=\"msg\">${esc(i.message)}\u003c/td>\u003ctd class=\"raw\">${esc(i.raw)}\u003c/td>\u003c/tr>`,\n      ).join('') +\n      (rows.length > SHOW_LIMIT ? `\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd colspan=\"2\" class=\"raw\">...and ${rows.length - SHOW_LIMIT} more. Narrow it with the level boxes or a rule chip. The report download has everything.\u003c/td>\u003c/tr>` : '') +\n      (!rows.length ? '\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd colspan=\"2\" class=\"raw\">Nothing to show with the current filters.\u003c/td>\u003c/tr>' : '');\n  }\n\n  $('chips').addEventListener('click', (ev) => {\n    const chip = ev.target.closest('.chip');\n    if (!chip) return;\n    state.ruleFilter = state.ruleFilter === chip.dataset.rule ? null : chip.dataset.rule;\n    if (state.ruleFilter) {\n      /* make sure the clicked level is visible */\n      const box = { error: 'showError', warning: 'showWarning', info: 'showInfo' }[RULE[state.ruleFilter].sev];\n      $(box).checked = true;\n    }\n    renderResults();\n  });\n  ['showError', 'showWarning', 'showInfo'].forEach((id) => $(id).addEventListener('change', renderResults));\n\n  function loadText(text, name) {\n    state.text = text;\n    state.name = name;\n    analyzeNow();\n  }\n\n  async function loadFile() {\n    const file = $('fileInput').files[0];\n    if (!file) return alert('Please upload an M3U file.');\n    loadText(decodeBytes(await file.arrayBuffer()), file.name);\n  }\n\n  async function loadUrl() {\n    const input = $('urlInput').value.trim();\n    if (!input) return alert('Please enter an online M3U URL.');\n    let url;\n    try { url = normalizeOnlineUrl(input); } catch (error) { return alert(error.message); }\n    say('Fetching...');\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 20000);\n    try {\n      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      let name = 'playlist.m3u';\n      try { name = decodeURIComponent(new URL(url).pathname.split('/').pop()) || name; } catch { /* keep default */ }\n      loadText(decodeBytes(await response.arrayBuffer()), name);\n    } catch (error) {\n      say(`Error fetching online M3U file: ${error.message}. The server may block browser CORS requests.`);\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  function loadPasted() {\n    const text = $('textInput').value;\n    if (!text.trim()) return alert('Please paste M3U content.');\n    loadText(text, 'pasted_streams.m3u');\n  }\n\n  function outName(suffix, ext) {\n    const stem = state.name.replace(/\\.(m3u8?|txt)$/i, '');\n    const own = /\\.(m3u8?)$/i.exec(state.name);\n    return `${stem}${suffix}.${ext || (own ? own[1].toLowerCase() : 'm3u')}`;\n  }\n\n  $('fixBtn').addEventListener('click', () => {\n    const { text, log } = fixText(state.text, getFixOptions());\n    const again = analyze(text, enabledRules());\n    const c = counts(again.issues);\n    const total = Object.values(log).reduce((a, b) => a + b, 0);\n    const detail = Object.entries(log).map(([k, v]) => `  ${v} x ${k}`).join('\\n');\n    say(\n      `Fixed playlist saved (${total} change(s)).\\n${detail || '  nothing needed changing'}\\n` +\n        `Still open in the fixed file: ${c.error} error(s), ${c.warning} warning(s), ${c.info} info. ` +\n        'Duplicates, dead links and unclosed quotes are not changed automatically.',\n    );\n    saveText(text, 'audio/x-mpegurl', outName('_fixed'));\n  });\n\n  $('reportBtn').addEventListener('click', () => {\n    const { issues, entries } = state.result;\n    const c = counts(issues);\n    const lines = [\n      `M3U validation report for ${state.name}`,\n      `${entries} stream(s), ${c.error} error(s), ${c.warning} warning(s), ${c.info} info`,\n      '',\n      ...issues.map((i) => `${i.line ? `line ${i.line}` : 'file'} | ${i.sev.toUpperCase()} | ${RULE[i.rule].label} | ${i.message}${i.raw ? `\\n    ${i.raw}` : ''}`),\n    ];\n    saveText(lines.join('\\n') + '\\n', 'text/plain', outName('_validation_report', 'txt'));\n  });\n\n  $('fileLoad').addEventListener('click', loadFile);\n  $('urlLoad').addEventListener('click', loadUrl);\n  $('textLoad').addEventListener('click', loadPasted);\n  buildRuleGrid();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  {id:"find",label:"Find stations",tip:"Search the Radio Browser directory and add stations to a playlist",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>window.__pageProtocol=(function(){try{return window.top.location.protocol}catch(e){return 'file:'}})();\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>M3U Station Discovery\u003c/title>\n\u003cstyle>\n/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */\n:root {\n  --concrete: #2b2b2b;\n  --panel: #1a1a1a;\n  --line: #e6e6e6;\n  --ink: #000000;\n  --text: #ffffff;\n  --muted: #bdbdbd;\n  --orange: #ff6a1a;\n  --pink: #ff4fa3;\n  --violet: #a77bff;\n  --green: #3ddc84;\n  --yellow: #ffd100;\n  --red: #ff3b30;\n  --blue: #3d8bff;\n  --bw: 4px;\n  --mono: ui-monospace, Consolas, \"Courier New\", monospace;\n}\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; padding: 24px 10px 60px; font-family: var(--mono); font-size: 14px; background: var(--concrete); color: var(--text); }\nh1 {\n  margin: -20px -20px 18px; padding: 8px 14px; background: var(--yellow); color: var(--ink);\n  border-bottom: var(--bw) solid var(--yellow); font-size: 1.9em; font-weight: 900; line-height: 1.25;\n  letter-spacing: 0.02em; text-transform: uppercase; text-align: left;\n}\n.container {\n  position: relative; width: 660px; max-width: 100%; margin: 0 auto; padding: 20px;\n  background: var(--panel); border: var(--bw) solid var(--line); box-shadow: 10px 10px 0 var(--ink); text-align: left;\n}\n.container.wide { width: 1240px; }\n.input-group { display: flex; align-items: center; gap: 10px; }\ntextarea, input, select {\n  flex-grow: 1; min-width: 0; margin: 5px 0; padding: 10px; border: var(--bw) solid var(--line);\n  border-radius: 0; background: var(--ink); color: var(--text); font: inherit;\n}\ninput[type='file']::file-selector-button {\n  margin-right: 1
